name: F10.9 Trusted Boundary Bootstrap

on:
  pull_request_target:
    branches: [desarrollo]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.context/00_INDICE.md'
      - '.context/backlog_tareas/req_est_001_sprint_1/tarea_001_hito_1.md'
      - '.context/decisiones/ADR-0024_g5_link_header_hardening_closure.md'
      - '.context/estado_del_proyecto.md'
      - '.context/operaciones/g5_operational_activation_manifest_2026_08_15.json'
      - '.context/operaciones/g5_operational_activation_runbook_2026_08_15.md'
      - '.context/operaciones/plan_remediacion_f10_9_fg2_fg3.md'
      - '.github/workflows/f9-7-contract.yml'
      - '.github/workflows/f10-9-g5-trusted-boundary-bootstrap.yml'
      - 'scripts/security/f109_boundary.py'
      - 'scripts/security/f109_trusted_boundary_bootstrap.py'
      - 'scripts/shared/f10_9_g5_operational_activation_preflight.py'
      - 'tests/test_f109_trusted_boundary_bootstrap.py'
      - 'tests/test_fase10_9_branch_reconciliation.py'
      - 'tests/test_fase10_9_g5_operational_activation_preflight.py'
      - 'workers/g5-trust-broker/src/index.mjs'
      - 'workers/g5-trust-broker/test/trust-broker.test.mjs'

permissions:
  contents: read

concurrency:
  group: f10-9-g5-trusted-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-boundary:
    name: F10.9 Trusted Boundary Bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected base only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure candidate object is available as untrusted data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$BASE_REPO" = "$REPOSITORY"
          test "$HEAD_REPO" = "$REPOSITORY"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}" || git fetch --no-tags --depth=2 origin "+$HEAD_SHA:refs/f10-9-g5-trusted-boundary/candidate"
          git cat-file -e "$HEAD_SHA^{commit}"
      - name: Validate candidate git objects without executing candidate code
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          CHECK_NAME: F10.9 Trusted Boundary Bootstrap
        run: |
          set -euo pipefail
          python3 scripts/security/f109_trusted_boundary_bootstrap.py \
            --repo . \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --base-repo "$BASE_REPO" \
            --head-repo "$HEAD_REPO" \
            --repository "$REPOSITORY" \
            --check-name "$CHECK_NAME"
