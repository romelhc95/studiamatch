# StudIAMatch-Docs: .context/componentes/infra_release.md#workflow-fg2-pipeline
name: FG2 - StudIAMatch Golden Pipeline

on:
  schedule:
    - cron: '0 5 * * *' # Daily production window; no immediate post-db-sync FG2
  workflow_dispatch:
    inputs:
      bounded_first_run:
        description: "Use the bounded first-run cohort and per-origin request limits"
        required: false
        type: boolean
        default: false
      resume_enrichment_from_272:
        description: "Resume only Enrichment and Sync from the pinned failed #272 artifact; no harvesting or cleansing"
        required: false
        type: boolean
        default: false
      approved_lot_reference:
        description: "Human review reference for the exact FG2 lot"
        required: false
        type: string
      approved_lot_sha256:
        description: "SHA-256 fingerprint of the reviewed FG2 lot bytes"
        required: false
        type: string
      approved_lot_manifest_b64:
        description: "Base64 JSON payload of the reviewed FG2 lot; never log this input"
        required: false
        type: string
      approved_lot_selection:
        description: "Selection rule bound to the reviewed FG2 lot"
        required: false
        type: choice
        options:
          - rotation_prefix
          - reviewed_exact
        default: rotation_prefix

concurrency:
  group: studiamatch-fg2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  main_ref_guard:
    name: "Require main ref before production resources"
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Reject non-main execution
        shell: bash
        env:
          FG2_BOUNDED_FIRST_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.bounded_first_run }}
          FG2_RESUME_ENRICHMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_enrichment_from_272 }}
          FG2_APPROVED_LOT_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_lot_selection || 'rotation_prefix' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
            echo "::error::FG2 production execution is restricted to refs/heads/main."
            exit 1
          fi
          if [[ "$FG2_BOUNDED_FIRST_RUN" == "true" && "$FG2_RESUME_ENRICHMENT" == "true" ]]; then
            echo "::error::A run cannot combine a new harvest with the pinned enrichment recovery."
            exit 1
          fi
          if [[ "$FG2_APPROVED_LOT_SELECTION" == "reviewed_exact" && ( "$FG2_BOUNDED_FIRST_RUN" != "true" || "$FG2_RESUME_ENRICHMENT" == "true" ) ]]; then
            echo "::error::Reviewed-exact selection requires a bounded manual first run and cannot be used for recovery or schedule."
            exit 1
          fi
          echo "FG2 production ref guard passed."

  production_control_preflight:
    name: "FG2 Production Control Preflight"
    needs: main_ref_guard
    if: needs.main_ref_guard.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    outputs:
      writer: ${{ steps.preflight.outputs.writer }}
      allow_writer: ${{ steps.preflight.outputs.allow_writer }}
      automation_enabled: ${{ steps.preflight.outputs.automation_enabled }}
      writers_paused: ${{ steps.preflight.outputs.writers_paused }}
      reason: ${{ steps.preflight.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve production controls
        id: preflight
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          PRODUCTION_WRITERS_PAUSED: ${{ vars.PRODUCTION_WRITERS_PAUSED }}
          FG2_RECOVERY_ENRICHMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_enrichment_from_272 }}
        run: |
          if [[ "$FG2_RECOVERY_ENRICHMENT" == "true" ]]; then
            bash .github/scripts/production_control_preflight.sh FG2-ENRICHMENT
          else
            bash .github/scripts/production_control_preflight.sh FG2-HARVEST
          fi

  # 🚉 STATION 1: Massive Discovery & Harvesting
  # -------------------------------------------------------------
  phase_1_harvesting:
    name: ${{ (inputs.resume_enrichment_from_272 && '1. Recovery manifest verification (no HTTP)') || '1. Massive Harvesting' }}
    needs: [main_ref_guard, production_control_preflight]
    if: needs.main_ref_guard.result == 'success' && needs.production_control_preflight.outputs.allow_writer == 'true'
    outputs:
      cohort_manifest_b64: ${{ steps.harvest.outputs.cohort_manifest_b64 }}
      cohort_manifest_sha256: ${{ steps.harvest.outputs.cohort_manifest_sha256 }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 350
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FG2_RECOVERY_ENRICHMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_enrichment_from_272 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Verify exact failed #272 source run and artifact"
        if: env.FG2_RECOVERY_ENRICHMENT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/45342980592" > "$RUNNER_TEMP/fg2-source-run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/45342980592/artifacts?per_page=100" > "$RUNNER_TEMP/fg2-source-artifacts.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/45342980592/jobs?per_page=100" > "$RUNNER_TEMP/fg2-source-jobs.json"
          python3 - "$RUNNER_TEMP/fg2-source-run.json" "$RUNNER_TEMP/fg2-source-artifacts.json" "$RUNNER_TEMP/fg2-source-jobs.json" <<'PY'
          import json
          import pathlib
          import sys

          run, artifacts, jobs = [json.loads(pathlib.Path(item).read_text(encoding="utf-8")) for item in sys.argv[1:]]
          expected_run = {
              "id": 45342980592,
              "run_attempt": 1,
              "workflow_id": 261386590,
              "path": ".github/workflows/production_pipeline.yml",
              "head_branch": "main",
              "head_sha": "9dd7962ae50822d5bc1bbf56b375fa199209f3ff",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "failure",
          }
          if any(run.get(key) != value for key, value in expected_run.items()):
              raise SystemExit("FG2_RECOVERY_SOURCE_REJECTED reason=run_binding_mismatch")
          expected_artifact = {
              "id": 14896234555,
              "name": "fg2-bounded-cohort-45342980592-1",
              "expired": False,
              "digest": "sha256:a313fbcbcece66f61e66a91d174126051a26e4d8461327514912243b16ee4864",
          }
          matches = [item for item in artifacts.get("artifacts", []) if item.get("id") == expected_artifact["id"]]
          if len(matches) != 1 or any(matches[0].get(key) != value for key, value in expected_artifact.items()):
              raise SystemExit("FG2_RECOVERY_SOURCE_REJECTED reason=artifact_binding_mismatch")
          run_binding = matches[0].get("workflow_run", {})
          if run_binding.get("id") != expected_run["id"] or run_binding.get("head_sha") != expected_run["head_sha"]:
              raise SystemExit("FG2_RECOVERY_SOURCE_REJECTED reason=artifact_origin_mismatch")
          expected_jobs = {
              "Require main ref before production resources": "success",
              "FG2 Production Control Preflight": "success",
              "1. Massive Harvesting": "success",
              "1.5. High Fidelity Cleansing": "success",
              "2. AI Enrichment (14 Pillars)": "failure",
              "3. Integrity & Sync": "skipped",
              "4. CA1 Audit Boundary": "skipped",
          }
          found = {item.get("name"): item.get("conclusion") for item in jobs.get("jobs", [])}
          if any(found.get(name) != conclusion for name, conclusion in expected_jobs.items()):
              raise SystemExit("FG2_RECOVERY_SOURCE_REJECTED reason=job_sequence_mismatch")
          print("FG2_RECOVERY_SOURCE_VERIFIED run=45342980592 attempt=1 jobs=7 artifact=14896234555")
          PY
      - name: "Download exact #272 cohort artifact"
        if: env.FG2_RECOVERY_ENRICHMENT == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: 14896234555
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: 45342980592
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fg2-recovery-source
      - name: "Verify downloaded #272 manifest bytes"
        if: env.FG2_RECOVERY_ENRICHMENT == 'true'
        run: |
          python3 - "$RUNNER_TEMP/fg2-recovery-source/fg2-cohort-manifest.json" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit("FG2_RECOVERY_SOURCE_REJECTED reason=manifest_file_missing")
          if hashlib.sha256(path.read_bytes()).hexdigest() != "5bb5f594b3e49c1369cd50d233db72b852e1ca3d48d8451a4a523ca7c50c0450":
              raise SystemExit("FG2_RECOVERY_SOURCE_REJECTED reason=manifest_digest_mismatch")
          print("FG2_RECOVERY_SOURCE_MANIFEST_VERIFIED sha256=5bb5f594b3e49c1369cd50d233db72b852e1ca3d48d8451a4a523ca7c50c0450")
          PY
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python Dependencies
        run: pip install --require-hashes -r requirements-pipeline.txt
      - name: Install Playwright browsers
        if: env.FG2_RECOVERY_ENRICHMENT != 'true'
        run: playwright install chromium
      - name: Set Job Start Time
        run: echo "JOB_START_TIME=$(date +%s)" >> "$GITHUB_ENV"
      - name: Verify production controls for the selected FG2 path
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          PRODUCTION_WRITERS_PAUSED: ${{ vars.PRODUCTION_WRITERS_PAUSED }}
        run: |
          if [[ "$FG2_RECOVERY_ENRICHMENT" == "true" ]]; then
            bash .github/scripts/production_control_preflight.sh FG2-ENRICHMENT --enforce
          else
            bash .github/scripts/production_control_preflight.sh FG2-HARVEST --enforce
          fi
      - name: Run Master Orchestrator (Harvest or Recovery Manifest)
        id: harvest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          JOB_START_TIME: ${{ env.JOB_START_TIME }}
          FG2_CONTROLLED_FIRST_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.bounded_first_run }}
          FG2_SCHEDULED_COHORT: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
          FG2_COHORT_SCOPED: ${{ (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.bounded_first_run || inputs.resume_enrichment_from_272)) }}
          FG2_APPROVED_LOT_REFERENCE: ${{ inputs.approved_lot_reference }}
          FG2_APPROVED_LOT_SHA256: ${{ inputs.approved_lot_sha256 }}
          FG2_APPROVED_LOT_MANIFEST_B64: ${{ inputs.approved_lot_manifest_b64 }}
          FG2_APPROVED_LOT_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_lot_selection || 'rotation_prefix' }}
          FG2_PROFILE_DIAGNOSTICS_ENABLED: ${{ vars.FG2_PROFILE_DIAGNOSTICS_ENABLED }}
          FG2_PROFILE_DIAGNOSTIC_SLUGS: ${{ vars.FG2_PROFILE_DIAGNOSTIC_SLUGS }}
          FG2_PROFILE_DIAGNOSTIC_PERSIST_ENABLED: ${{ vars.FG2_PROFILE_DIAGNOSTIC_PERSIST_ENABLED }}
          FG2_PROFILE_AUTO_ACTIVATE_VERIFIED: ${{ vars.FG2_PROFILE_AUTO_ACTIVATE_VERIFIED }}
        run: |
          set -euo pipefail
          if [[ "$FG2_RECOVERY_ENRICHMENT" == "true" ]]; then
            python3 scripts/core/master_orchestrator.py --limit 5 --skip-cleansing --prepare-post272-enrichment-recovery --source-cohort-manifest "$RUNNER_TEMP/fg2-recovery-source/fg2-cohort-manifest.json" --cohort-manifest "$RUNNER_TEMP/fg2-cohort-manifest.json" --approved-lot-manifest "$RUNNER_TEMP/fg2-approved-lot.json" --approved-lot-reference "$FG2_APPROVED_LOT_REFERENCE" --approved-lot-sha256 "$FG2_APPROVED_LOT_SHA256"
          elif [[ "$FG2_SCHEDULED_COHORT" == "true" ]]; then
            python3 scripts/core/master_orchestrator.py --limit 10 --max-urls 10 --skip-cleansing --scheduled-cohort --cohort-manifest "$RUNNER_TEMP/fg2-cohort-manifest.json"
          elif [[ "$FG2_CONTROLLED_FIRST_RUN" == "true" ]]; then
            python3 scripts/core/master_orchestrator.py --limit 10 --max-urls 10 --skip-cleansing --controlled-first-run --cohort-manifest "$RUNNER_TEMP/fg2-cohort-manifest.json" --approved-lot-manifest "$RUNNER_TEMP/fg2-approved-lot.json" --approved-lot-reference "$FG2_APPROVED_LOT_REFERENCE" --approved-lot-sha256 "$FG2_APPROVED_LOT_SHA256" --approved-lot-selection "$FG2_APPROVED_LOT_SELECTION"
          else
            python3 scripts/core/master_orchestrator.py --limit 10 --skip-cleansing
          fi
          if [[ "$FG2_COHORT_SCOPED" == "true" ]]; then
            python3 - "$RUNNER_TEMP/fg2-cohort-manifest.json" "$GITHUB_OUTPUT" <<'PY'
          import base64
          import hashlib
          import pathlib
          import sys

          raw = pathlib.Path(sys.argv[1]).read_bytes()
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write("cohort_manifest_b64=" + base64.b64encode(raw).decode("ascii") + "\n")
              output.write("cohort_manifest_sha256=" + hashlib.sha256(raw).hexdigest() + "\n")
          PY
          fi
      - name: Preserve controlled FG2 cohort manifest for review and recovery
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.bounded_first_run || inputs.resume_enrichment_from_272)))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fg2-bounded-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fg2-cohort-manifest.json
          if-no-files-found: ignore
          retention-days: 7

  # 🚉 STATION 1.5: High Fidelity Cleansing
  # -------------------------------------------------------------
  phase_1_5_cleansing:
    name: "1.5. High Fidelity Cleansing"
    needs: [production_control_preflight, phase_1_harvesting, main_ref_guard]
    if: needs.main_ref_guard.result == 'success' && needs.production_control_preflight.outputs.allow_writer == 'true' && inputs.resume_enrichment_from_272 != true && needs.phase_1_harvesting.result == 'success'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FG2_COHORT_SCOPED: ${{ (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.bounded_first_run || inputs.resume_enrichment_from_272)) }}
      FG2_COHORT_MANIFEST_B64: ${{ needs.phase_1_harvesting.outputs.cohort_manifest_b64 }}
      FG2_COHORT_MANIFEST_SHA256: ${{ needs.phase_1_harvesting.outputs.cohort_manifest_sha256 }}
      FG2_APPROVED_LOT_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_lot_selection || 'rotation_prefix' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install --require-hashes -r requirements-pipeline.txt
      - name: Verify production controls before mutating station
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          PRODUCTION_WRITERS_PAUSED: ${{ vars.PRODUCTION_WRITERS_PAUSED }}
        run: bash .github/scripts/production_control_preflight.sh FG2-CLEANSING --enforce
      - name: Restore exact controlled cohort manifest
        if: env.FG2_COHORT_SCOPED == 'true'
        run: |
          python3 - "$RUNNER_TEMP/fg2-cohort-manifest.json" <<'PY'
          import base64
          import hashlib
          import os
          import pathlib
          import sys

          raw = base64.b64decode(os.environ["FG2_COHORT_MANIFEST_B64"], validate=True)
          if hashlib.sha256(raw).hexdigest() != os.environ["FG2_COHORT_MANIFEST_SHA256"]:
              raise SystemExit("controlled cohort digest mismatch")
          pathlib.Path(sys.argv[1]).write_bytes(raw)
          PY
      - name: Run Cleansing Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          if [[ "$FG2_COHORT_SCOPED" == "true" ]]; then
            python scripts/core/cleansing_worker.py --cohort-manifest "$RUNNER_TEMP/fg2-cohort-manifest.json" --cohort-manifest-sha256 "$FG2_COHORT_MANIFEST_SHA256"
          else
            python scripts/core/cleansing_worker.py
          fi

  # 🚉 STATION 2: AI Enrichment (14 Metadata Pillars)
  # -------------------------------------------------------------
  phase_2_enrichment:
    name: "2. AI Enrichment (14 Pillars)"
    needs: [production_control_preflight, phase_1_harvesting, phase_1_5_cleansing, main_ref_guard]
    if: >-
      always() && !cancelled() &&
      needs.main_ref_guard.result == 'success' &&
      needs.production_control_preflight.result == 'success' &&
      needs.production_control_preflight.outputs.allow_writer == 'true' &&
      needs.phase_1_harvesting.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.resume_enrichment_from_272 == true && needs.phase_1_5_cleansing.result == 'skipped') ||
       (inputs.resume_enrichment_from_272 != true && needs.phase_1_5_cleansing.result == 'success'))
    timeout-minutes: 350
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FG2_REQUIRE_REAL_PROVIDER: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
      FG2_COHORT_SCOPED: ${{ (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.bounded_first_run || inputs.resume_enrichment_from_272)) }}
      FG2_COHORT_MANIFEST_B64: ${{ needs.phase_1_harvesting.outputs.cohort_manifest_b64 }}
      FG2_COHORT_MANIFEST_SHA256: ${{ needs.phase_1_harvesting.outputs.cohort_manifest_sha256 }}
      FG2_APPROVED_LOT_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_lot_selection || 'rotation_prefix' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install --require-hashes -r requirements-pipeline.txt
      - name: Verify production controls before mutating station
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          PRODUCTION_WRITERS_PAUSED: ${{ vars.PRODUCTION_WRITERS_PAUSED }}
        run: bash .github/scripts/production_control_preflight.sh FG2-ENRICHMENT --enforce
      - name: Restore exact controlled cohort manifest
        if: env.FG2_COHORT_SCOPED == 'true'
        run: |
          python3 - "$RUNNER_TEMP/fg2-cohort-manifest.json" <<'PY'
          import base64
          import hashlib
          import os
          import pathlib
          import sys

          raw = base64.b64decode(os.environ["FG2_COHORT_MANIFEST_B64"], validate=True)
          if hashlib.sha256(raw).hexdigest() != os.environ["FG2_COHORT_MANIFEST_SHA256"]:
              raise SystemExit("controlled cohort digest mismatch")
          pathlib.Path(sys.argv[1]).write_bytes(raw)
          PY
      - name: Multicloud AI Enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ "$FG2_COHORT_SCOPED" == "true" ]]; then
            python scripts/core/enrichment_worker.py --cohort-manifest "$RUNNER_TEMP/fg2-cohort-manifest.json" --cohort-manifest-sha256 "$FG2_COHORT_MANIFEST_SHA256"
          else
            python scripts/core/enrichment_worker.py
          fi

  # 🚉 STATION 3: Production Sync (Vectors & Slugs)
  # -------------------------------------------------------------
  phase_3_sync:
    name: "3. Integrity & Sync"
    needs: [production_control_preflight, phase_1_harvesting, phase_1_5_cleansing, phase_2_enrichment, main_ref_guard]
    if: >-
      always() && !cancelled() &&
      needs.main_ref_guard.result == 'success' &&
      needs.production_control_preflight.result == 'success' &&
      needs.production_control_preflight.outputs.allow_writer == 'true' &&
      needs.phase_1_harvesting.result == 'success' &&
      needs.phase_2_enrichment.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.resume_enrichment_from_272 == true && needs.phase_1_5_cleansing.result == 'skipped') ||
       (inputs.resume_enrichment_from_272 != true && needs.phase_1_5_cleansing.result == 'success'))
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FG2_REQUIRE_REAL_PROVIDER: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
      FG2_COHORT_SCOPED: ${{ (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.bounded_first_run || inputs.resume_enrichment_from_272)) }}
      FG2_COHORT_MANIFEST_B64: ${{ needs.phase_1_harvesting.outputs.cohort_manifest_b64 }}
      FG2_COHORT_MANIFEST_SHA256: ${{ needs.phase_1_harvesting.outputs.cohort_manifest_sha256 }}
      FG2_APPROVED_LOT_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_lot_selection || 'rotation_prefix' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install --require-hashes -r requirements-pipeline.txt
      - name: Verify production controls before mutating station
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          PRODUCTION_WRITERS_PAUSED: ${{ vars.PRODUCTION_WRITERS_PAUSED }}
        run: bash .github/scripts/production_control_preflight.sh FG2-SYNC --enforce
      - name: Restore exact controlled cohort manifest
        if: env.FG2_COHORT_SCOPED == 'true'
        run: |
          python3 - "$RUNNER_TEMP/fg2-cohort-manifest.json" <<'PY'
          import base64
          import hashlib
          import os
          import pathlib
          import sys

          raw = base64.b64decode(os.environ["FG2_COHORT_MANIFEST_B64"], validate=True)
          if hashlib.sha256(raw).hexdigest() != os.environ["FG2_COHORT_MANIFEST_SHA256"]:
              raise SystemExit("controlled cohort digest mismatch")
          pathlib.Path(sys.argv[1]).write_bytes(raw)
          PY
      - name: Sync to Production Courses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          if [[ "$FG2_COHORT_SCOPED" == "true" ]]; then
            python scripts/core/sync_vector_worker.py --cohort-manifest "$RUNNER_TEMP/fg2-cohort-manifest.json" --cohort-manifest-sha256 "$FG2_COHORT_MANIFEST_SHA256"
          else
            python scripts/core/sync_vector_worker.py
          fi

  phase_4_audit:
    name: "4. CA1 Audit Boundary"
    needs: [production_control_preflight, phase_1_harvesting, phase_1_5_cleansing, phase_2_enrichment, phase_3_sync, main_ref_guard]
    if: >-
      always() && !cancelled() &&
      needs.main_ref_guard.result == 'success' &&
      needs.production_control_preflight.result == 'success' &&
      needs.production_control_preflight.outputs.allow_writer == 'true' &&
      needs.phase_1_harvesting.result == 'success' &&
      needs.phase_2_enrichment.result == 'success' &&
      needs.phase_3_sync.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.resume_enrichment_from_272 == true && needs.phase_1_5_cleansing.result == 'skipped') ||
       (inputs.resume_enrichment_from_272 != true && needs.phase_1_5_cleansing.result == 'success'))
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Declare CA1-only audit boundary
        run: |
          set -euo pipefail
          echo "F9.8 CA1-only candidate stops after FG2 sync."
          echo "Maintenance audits and Cloudflare rebuild remain outside the authorized scope."
