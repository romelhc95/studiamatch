name: FG2 - StudIAMatch Golden Pipeline

on:
  schedule:
    - cron: '0 5 * * *' # Daily production window; no immediate post-db-sync FG2
  workflow_dispatch:      # Manual

concurrency:
  group: studiamatch-fg2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 🚉 STATION 1: Massive Discovery & Harvesting
  # -------------------------------------------------------------
  phase_1_harvesting:
    name: "1. Massive Harvesting"
    if: contains(fromJSON('["refs/heads/main","refs/heads/certificacion","refs/heads/desarrollo"]'), github.ref) && (github.event_name != 'schedule' || (github.ref_name == 'main' && vars.AUTOMATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python Dependencies
        run: pip install --require-hashes -r requirements-pipeline.txt
      - name: Install Playwright browsers
        run: playwright install chromium
      - name: Set Job Start Time
        run: echo "JOB_START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Run Master Orchestrator (Harvesting Only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          JOB_START_TIME: ${{ env.JOB_START_TIME }}
        run: python3 scripts/core/master_orchestrator.py --limit 10 --skip-cleansing

  # 🚉 STATION 1.5: High Fidelity Cleansing
  # -------------------------------------------------------------
  phase_1_5_cleansing:
    name: "1.5. High Fidelity Cleansing"
    needs: phase_1_harvesting
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install --require-hashes -r requirements-pipeline.txt
      - name: Run Cleansing Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: python scripts/core/cleansing_worker.py

  # 🚉 STATION 2: AI Enrichment (14 Metadata Pillars)
  # -------------------------------------------------------------
  phase_2_enrichment:
    name: "2. AI Enrichment (14 Pillars)"
    needs: phase_1_5_cleansing
    timeout-minutes: 350
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install --require-hashes -r requirements-pipeline.txt
      - name: Multicloud AI Enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python scripts/core/enrichment_worker.py

  # 🚉 STATION 3: Production Sync (Vectors & Slugs)
  # -------------------------------------------------------------
  phase_3_sync:
    name: "3. Integrity & Sync"
    needs: phase_2_enrichment
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install --require-hashes -r requirements-pipeline.txt
      - name: Sync to Production Courses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: python scripts/core/sync_vector_worker.py

  phase_4_audit:
    name: "4. CA1 Audit Boundary"
    needs: phase_3_sync
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG2') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Declare CA1-only audit boundary
        run: |
          set -euo pipefail
          echo "F9.8 CA1-only candidate stops after FG2 sync."
          echo "Maintenance audits and Cloudflare rebuild remain outside the authorized scope."
