name: F10.9 G5 Manual Trust Gate Deployment-Ready Disabled

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: g5-manual-trust-gate-${{ github.repository_id }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  production-read-only-diagnostic:
    name: F10.9 G5 Production Read-Only Diagnostic
    if: >-
      ${{ vars.G5_TRUST_RUNTIME_ENABLED == 'true' &&
          github.ref == 'refs/heads/main' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Derive immutable GitHub context
        env:
          G5_CONTEXT_SHA: ${{ github.sha }}
          G5_CONTEXT_REF: ${{ github.ref }}
          G5_CONTEXT_RUN_ID: ${{ github.run_id }}
          G5_CONTEXT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$G5_CONTEXT_REF" = "refs/heads/main"
          test "$G5_CONTEXT_RUN_ATTEMPT" = "1"
          printf '%s' "$G5_CONTEXT_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$G5_CONTEXT_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
      - name: Run G5 trust client and connected collector
        env:
          G5_TRUST_BROKER_ENDPOINT: ${{ vars.G5_TRUST_BROKER_ENDPOINT }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          node workers/g5-trust-broker/src/index.mjs --g5-connected-diagnostic
