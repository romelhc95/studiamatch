              'scripts/maintenance/taxonomy_roi_audit.py',
          }
          protected_prefixes = ('scripts/core/', 'scripts/shared/', 'config/')
          denied_prefixes = ('db/', 'supabase/', 'web/', 'scripts/maintenance/')
