          python3 - <<'PY'
          import os
          import subprocess

          protected = (
              '.github/workflows/fg1_inventory.yml',
              '.github/workflows/production_pipeline.yml',
              '.github/workflows/fg3_integrity.yml',
              '.github/workflows/db-sync-to-pro.yml',
              'scripts/core',
              'scripts/shared',
              'config',
              'requirements-fg1.txt',
