env:
  F97_BASELINE_COMMIT: 8ab1cdf9173b8093781e75ba32c2fea9ae931b14
  F97_FROZEN_COMMIT: 258ef3a98c7c1010efe58522bb1eca892e26390e
  F97_FROZEN_TREE: 2cb182ab9ece141bd8e84d7bbf9c91d771f603de
  ACTIONLINT_VERSION: '1.7.7'
  SHELLCHECK_VERSION: '0.9.0'
  SHELLCHECK_SHA256: 700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f
  ACTIONLINT_ASSET: actionlint_1.7.7_linux_amd64.tar.gz
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
  F97_CREDENTIAL_PATTERN: >-
    eyJhbG[A-Za-z0-9_-]{10,}|sb_publishable_[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{10,}|sbp_[A-Za-z0-9_-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghs_[A-Za-z0-9]{20,}|opencode_[A-Za-z0-9_-]{20,}|oc_[A-Za-z0-9_-]{30,}|OPENCODE_API_KEY[[:space:]]*[:=][[:space:]]*['"]?[A-Za-z0-9_-]{20,}

jobs:
  f1010-m3-zero-write:
    name: F10.10 M3 Zero-Write Collector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact M3 candidate surface
        run: |
          test -f scripts/maintenance/f10_10_m3_readonly_collector.py
          test -f tests/test_f10_10_m3_readonly_collector.py
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install frozen test dependencies
        run: |
          git show "$F97_FROZEN_COMMIT:requirements-test.txt" > "$RUNNER_TEMP/requirements-test.txt"
          git show "$F97_FROZEN_COMMIT:requirements-db-migrate.txt" > "$RUNNER_TEMP/requirements-db-migrate.txt"
          pip install --require-hashes \
            -r "$RUNNER_TEMP/requirements-db-migrate.txt" \
            -r "$RUNNER_TEMP/requirements-test.txt"
      - name: Materialize pinned PostgreSQL 17 and Python images
        run: |
          postgres_image="postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193"
          python_image="python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93"
          docker pull "$postgres_image"
          docker pull "$python_image"
          test -n "$(docker image inspect --format '{{.Id}}' "$postgres_image")"
          test -n "$(docker image inspect --format '{{.Id}}' "$python_image")"
      - name: Prepare M3 firewall cleanup state
        run: |
          state_dir="$(mktemp -d "$RUNNER_TEMP/f1010-m3-firewall.XXXXXXXX")"
          guard="$RUNNER_TEMP/fase09_7_firewall_guard.sh"
          chmod 700 "$state_dir"
          git show "$F97_FROZEN_COMMIT:.github/scripts/fase09_7_firewall_guard.sh" > "$guard"
          chmod 500 "$guard"
          echo "F1010_M3_FIREWALL_STATE=$state_dir" >> "$GITHUB_ENV"
          echo "F1010_M3_FIREWALL_GUARD=$guard" >> "$GITHUB_ENV"
      - name: Block M3 external egress
        run: >-
          "$F1010_M3_FIREWALL_GUARD" setup
          FASE097_AUDIT_EGRESS "$F1010_M3_FIREWALL_STATE"
      - name: Run M3 PUBLIC database ACL preflight contract
        run: |
          python3 -m pytest -q -p no:cacheprovider \
            tests/test_f10_10_m3_public_db_acl_preflight.py
          bash tests/sql/run_f10_10_m3_public_db_acl_preflight_postgres17.sh
      - name: Run M3 zero-write collector contract
        run: |
          workspace_ancestor="$(dirname "$GITHUB_WORKSPACE")"
          while [ "$workspace_ancestor" != "/" ]; do
            sudo chmod o+x "$workspace_ancestor"
            workspace_ancestor="$(dirname "$workspace_ancestor")"
          done
          sudo chmod -R go+rX,go-w "$GITHUB_WORKSPACE"
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
             PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
              tests/test_f10_10_m3_readonly_collector.py \
              tests/test_f10_10_m3_reader_package.py
      - name: Prepare M3 reader PostgreSQL socket
        run: |
          state_dir="$(mktemp -d "$RUNNER_TEMP/f1010-m3-reader.XXXXXXXX")"
          chmod 711 "$state_dir"
          mkdir "$state_dir/postgres-socket"
          chmod 777 "$state_dir/postgres-socket"
          echo "F1010_M3_READER_STATE=$state_dir" >> "$GITHUB_ENV"
          echo "F1010_M3_READER_SOCKET=$state_dir/postgres-socket" >> "$GITHUB_ENV"
      - name: Start M3 reader networkless PostgreSQL 17
        run: |
          docker run --detach --pull never --name studiamatch-m3-reader-postgres \
            --network none \
            --security-opt no-new-privileges:true \
            --volume "$F1010_M3_READER_SOCKET:/var/run/postgresql" \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' \
            studiamatch-m3-reader-postgres)" = "none"
          init_complete=0
          for _ in $(seq 1 60); do
            test "$(docker inspect --format '{{.State.Running}}' \
              studiamatch-m3-reader-postgres)" = "true" || break
            if docker logs studiamatch-m3-reader-postgres 2>&1 | \
                grep -Fq "PostgreSQL init process complete; ready for start up."; then
              init_complete=1
              break
            fi
            sleep 1
          done
          if [ "$init_complete" -ne 1 ]; then
            docker logs studiamatch-m3-reader-postgres
            exit 1
          fi
          final_ready=0
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Running}}' \
                studiamatch-m3-reader-postgres)" != "true" ]; then
              break
            fi
            if test -S "$F1010_M3_READER_SOCKET/.s.PGSQL.5432" && \
                pg_isready --host "$F1010_M3_READER_SOCKET" \
                  --username postgres --dbname postgres; then
              final_ready=1
              break
            fi
            sleep 1
          done
          if [ "$final_ready" -ne 1 ]; then
            docker logs studiamatch-m3-reader-postgres
            exit 1
          fi
          # Require stability after acquiring the final server.  A failed probe
          # resets the consecutive counter instead of accepting a transient socket.
          stable_probes=0
          for _ in $(seq 1 15); do
            if [ "$(docker inspect --format '{{.State.Running}}' \
                studiamatch-m3-reader-postgres)" = "true" ] && \
                test -S "$F1010_M3_READER_SOCKET/.s.PGSQL.5432" && \
                pg_isready --host "$F1010_M3_READER_SOCKET" \
                  --username postgres --dbname postgres; then
              stable_probes=$((stable_probes + 1))
              if [ "$stable_probes" -eq 3 ]; then
                break
              fi
            else
              stable_probes=0
            fi
            sleep 1
          done
          if [ "$stable_probes" -ne 3 ]; then
            docker logs studiamatch-m3-reader-postgres
            exit 1
          fi
      - name: Run M3 reader PostgreSQL 17 contract
        run: |
          python3 -m pytest -q tests/test_f10_10_m3_apply_projection.py
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" \
            TEST_DATABASE_URL="postgresql://postgres:postgres@/postgres?host=$F1010_M3_READER_SOCKET" \
            F10_10_M3_READER_TEST_SOCKET="$F1010_M3_READER_SOCKET" \
            ALLOW_DESTRUCTIVE_LOCAL_TEST_DB=F10_10_M3_READER_LOCAL_POSTGRES17_ONLY \
            bash tests/sql/run_fase10_10_m3_free_reader_postgres17.sh
      - name: Remove M3 reader local database
        if: always()
        run: |
          cleanup_status=0
          if docker container inspect studiamatch-m3-reader-postgres >/dev/null 2>&1; then
            docker rm --force studiamatch-m3-reader-postgres || cleanup_status=$?
          fi
          state_dir="${F1010_M3_READER_STATE:-}"
          if [ -n "$state_dir" ] && [ -e "$state_dir" ]; then
            sudo rm -rf -- "$state_dir" || cleanup_status=1
          fi
          exit "$cleanup_status"
      - name: Restore M3 external egress
        if: always()
        run: |
          cleanup_status=0
          state_dir="${F1010_M3_FIREWALL_STATE:-}"
          guard="${F1010_M3_FIREWALL_GUARD:-}"
          if [ -n "$state_dir" ] && [ -d "$state_dir" ] && [ -x "$guard" ]; then
            "$guard" cleanup \
              FASE097_AUDIT_EGRESS "$state_dir" || cleanup_status=$?
            if [ "$cleanup_status" -eq 0 ]; then
              rm -rf -- "$state_dir" || cleanup_status=1
            fi
          else
            cleanup_status=1
          fi
          exit "$cleanup_status"

  fase09-7-schema-rls:
    name: F9.7 Public Access, Trigger Retirement, and Security Hold PostgreSQL 17 Contract
    needs: f1010-m3-zero-write
    if: ${{ always() && (github.event_name != 'pull_request' || github.base_ref != 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require M3 zero-write prerequisite
        run: test "${{ needs.f1010-m3-zero-write.result }}" = "success"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate exact F10.9 transition boundary
        id: f109
        if: >-
          (github.event_name == 'pull_request' &&
            ((github.base_ref == 'certificacion' && github.event.pull_request.base.sha == '2a70dd001d8ded34d5ba67c19221f7f5e291d2c8') ||
             github.base_ref == 'desarrollo')) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/desarrollo')
        env:
          F109_EVENT: ${{ github.event_name }}
          F109_BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          F109_HEAD_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          F109_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          F109_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          F109_BASE_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          F109_HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin certificacion desarrollo archive/f10-9-ca2-preserve-desarrollo-20260809
          cert_tip="$(git rev-parse origin/certificacion)"
          p1_base=""
          p1_base_tree=""
          p2_base=""
          p2_base_tree=""
          g2_base=""
          g2_base_tree=""
          p5_base=""
          p5_base_tree=""
          f1010_m1_base=""
          f1010_m1_base_tree=""
          if [ "$F109_EVENT" = "pull_request" ] && [ "$F109_HEAD_REF" = "fix/f10-9-p1-rebuilt" ]; then
            protected_dev_tip="$(git rev-parse origin/desarrollo)"
            test "$F109_BASE_SHA" = "$protected_dev_tip"
            p1_base="$F109_BASE_SHA"
            p1_base_tree="$(git rev-parse "$F109_BASE_SHA^{tree}")"
          elif [ "$F109_EVENT" = "pull_request" ] && [ "$F109_HEAD_REF" = "feat/f10-9-p2-readonly-planners" ]; then
            protected_dev_tip="$(git rev-parse origin/desarrollo)"
            test "$F109_BASE_SHA" = "$protected_dev_tip"
            p2_base="$F109_BASE_SHA"
            p2_base_tree="$(git rev-parse "$F109_BASE_SHA^{tree}")"
          elif [ "$F109_EVENT" = "pull_request" ] && [ "$F109_HEAD_REF" = "feat/f10-9-p3-p4-runtime-fail-closed" ]; then
            protected_dev_tip="$(git rev-parse origin/desarrollo)"
            test "$F109_BASE_SHA" = "$protected_dev_tip"
            g2_base="$F109_BASE_SHA"
            g2_base_tree="$(git rev-parse "$F109_BASE_SHA^{tree}")"
          elif [ "$F109_EVENT" = "pull_request" ] && [ "$F109_HEAD_REF" = "feat/f10-9-p5-metadata-readonly" ]; then
            protected_dev_tip="$(git rev-parse origin/desarrollo)"
            test "$F109_BASE_SHA" = "$protected_dev_tip"
            p5_base="$F109_BASE_SHA"
            p5_base_tree="$(git rev-parse "$F109_BASE_SHA^{tree}")"
          elif [ "$F109_EVENT" = "pull_request" ] && [ "$F109_HEAD_REF" = "feat/f10-10-m1-offline-tooling" ]; then
            protected_dev_tip="$(git rev-parse origin/desarrollo)"
            test "$F109_BASE_SHA" = "$protected_dev_tip"
            f1010_m1_base="$F109_BASE_SHA"
            f1010_m1_base_tree="$(git rev-parse "$F109_BASE_SHA^{tree}")"
          elif [ "$F109_EVENT" = "push" ] && [ "$F109_BASE_REF" = "desarrollo" ]; then
            p1_base="$F109_BASE_SHA"
            p1_base_tree="$(git rev-parse "$F109_BASE_SHA^{tree}")"
            p2_base="$F109_BASE_SHA"
            p2_base_tree="$p1_base_tree"
            g2_base="$F109_BASE_SHA"
            g2_base_tree="$p1_base_tree"
            p5_base="$F109_BASE_SHA"
            p5_base_tree="$p1_base_tree"
            f1010_m1_base="$F109_BASE_SHA"
            f1010_m1_base_tree="$p1_base_tree"
          fi
          python3 scripts/security/f109_boundary.py \
            --event "$F109_EVENT" \
            --base-ref "$F109_BASE_REF" \
            --head-ref "$F109_HEAD_REF" \
            --base-sha "$F109_BASE_SHA" \
            --head-sha "$F109_HEAD_SHA" \
            --base-repo "$F109_BASE_REPO" \
            --head-repo "$F109_HEAD_REPO" \
            --cert-tip "$cert_tip" \
            --p1-base "$p1_base" \
            --p1-base-tree "$p1_base_tree" \
            --p2-base "$p2_base" \
            --p2-base-tree "$p2_base_tree" \
            --g2-base "$g2_base" \
            --g2-base-tree "$g2_base_tree" \
            --p5-base "$p5_base" \
            --p5-base-tree "$p5_base_tree" \
            --f1010-m1-base "$f1010_m1_base" \
            --f1010-m1-base-tree "$f1010_m1_base_tree" \
            --github-output "$GITHUB_OUTPUT"
          python3 -m unittest tests.test_fase10_9_branch_reconciliation -v
      - name: Validate F9.8 transition boundary
        if: >-
          steps.f109.outputs.mode == 'skip_non_p1' ||
          !((github.event_name == 'pull_request' &&
            ((github.base_ref == 'certificacion' && github.event.pull_request.base.sha == '2a70dd001d8ded34d5ba67c19221f7f5e291d2c8') ||
              github.base_ref == 'desarrollo')) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/desarrollo'))
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            F98_HEAD_COMMIT="${{ github.event.pull_request.head.sha }}"
            F98_BASE_COMMIT="${{ github.event.pull_request.base.sha }}"
          else
            test "${{ github.ref }}" = "refs/heads/desarrollo"
            F98_HEAD_COMMIT="${{ github.sha }}"
            F98_BASE_COMMIT="${{ github.event.before }}"
          fi
          printf '%s' "$F98_HEAD_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$F98_BASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test "$F98_HEAD_COMMIT" != "0000000000000000000000000000000000000000"
          test "$F98_BASE_COMMIT" != "0000000000000000000000000000000000000000"
          git cat-file -e "$F98_BASE_COMMIT^{commit}"
          git cat-file -e "$F98_HEAD_COMMIT^{commit}"
