name: F9.7 Local Contract

on:
  pull_request:
    paths:
      - 'db/manifests/fase09_7_free_schema_rls.json'
      - 'db/migrations/20260727_fase09_7_public_access_closure.sql'
      - 'scripts/maintenance/fase09_7_candidate.py'
      - 'tests/sql/fase09_7_*'
      - 'tests/sql/run_fase09_7_postgres.sh'
      - 'tests/test_fase09_7_backend_identity.py'
      - 'tests/test_fase09_7_schema_rls.py'
      - '.github/workflows/fg1_inventory.yml'
      - '.github/workflows/fg3_integrity.yml'
      - '.github/workflows/production_pipeline.yml'
      - 'scripts/core/**'
      - 'scripts/maintenance/category_coverage_audit.py'
      - 'scripts/maintenance/quality_assurance_audit.py'
      - 'scripts/maintenance/taxonomy_roi_audit.py'
      - 'scripts/shared/**'
      - 'requirements-pipeline.txt'
      - '.github/workflows/f9-7-contract.yml'
  push:
    branches: [desarrollo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fase09-7-schema-rls:
    name: F9.7 Public Access Closure PostgreSQL 17 Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned test dependencies
        run: >-
          pip install --require-hashes
          -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Prepare local PostgreSQL socket
        run: |
          state_dir=$(mktemp -d "$RUNNER_TEMP/fase097-postgres.XXXXXXXX")
          chmod 711 "$state_dir"
          mkdir "$state_dir/postgres-socket"
          chmod 777 "$state_dir/postgres-socket"
          echo "FASE097_STATE=$state_dir" >> "$GITHUB_ENV"
      - name: Start networkless PostgreSQL 17
        run: |
          docker run --detach --name studiamatch-f97-postgres \
            --network none \
            --security-opt no-new-privileges:true \
            --volume "$FASE097_STATE/postgres-socket:/var/run/postgresql" \
            --env POSTGRES_DB=studiamatch_f97 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' \
            studiamatch-f97-postgres)" = "none"
          for _ in $(seq 1 30); do
            pg_isready --host "$FASE097_STATE/postgres-socket" \
              --username postgres --dbname studiamatch_f97 && exit 0
            sleep 1
          done
          exit 1
      - name: Block external egress
        run: |
          sudo iptables -w 10 -N FASE097_EGRESS
          sudo iptables -w 10 -A FASE097_EGRESS -o lo -j RETURN
          sudo iptables -w 10 -A FASE097_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -w 10 -A FASE097_EGRESS -j REJECT
          sudo iptables -w 10 -I OUTPUT 1 -j FASE097_EGRESS
          sudo ip6tables -w 10 -N FASE097_EGRESS
          sudo ip6tables -w 10 -A FASE097_EGRESS -o lo -j RETURN
          sudo ip6tables -w 10 -A FASE097_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo ip6tables -w 10 -A FASE097_EGRESS -j REJECT
          sudo ip6tables -w 10 -I OUTPUT 1 -j FASE097_EGRESS
      - name: Run local-only Python and PostgreSQL contracts
        run: |
          sudo chmod -R o+rX "$GITHUB_WORKSPACE"
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
            tests/test_fase09_7_backend_identity.py \
            tests/test_fase09_7_schema_rls.py
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            TEST_DATABASE_URL="postgresql://postgres:postgres@/studiamatch_f97?host=$FASE097_STATE/postgres-socket" \
            bash tests/sql/run_fase09_7_postgres.sh
      - name: Restore runner and remove local database
        if: always()
        run: |
          for firewall in iptables ip6tables; do
            while sudo "$firewall" -w 10 -C OUTPUT -j FASE097_EGRESS >/dev/null 2>&1; do
              sudo "$firewall" -w 10 -D OUTPUT -j FASE097_EGRESS
            done
            if sudo "$firewall" -w 10 -nL FASE097_EGRESS >/dev/null 2>&1; then
              sudo "$firewall" -w 10 -F FASE097_EGRESS
              sudo "$firewall" -w 10 -X FASE097_EGRESS
            fi
          done
          docker rm --force studiamatch-f97-postgres >/dev/null 2>&1 || true
          if [ -n "${FASE097_STATE:-}" ] && [ -d "$FASE097_STATE" ]; then
            sudo rm -rf -- "$FASE097_STATE"
          fi
