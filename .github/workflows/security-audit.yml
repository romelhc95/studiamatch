name: Security Audit Gate

on:
  pull_request:
    branches: [desarrollo, certificacion, main]
  push:
    branches: [desarrollo, certificacion, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  F97_BASELINE_COMMIT: 8ab1cdf9173b8093781e75ba32c2fea9ae931b14
  F97_FROZEN_COMMIT: 258ef3a98c7c1010efe58522bb1eca892e26390e
  F97_FROZEN_TREE: 2cb182ab9ece141bd8e84d7bbf9c91d771f603de
  ACTIONLINT_VERSION: '1.7.7'
  SHELLCHECK_VERSION: '0.9.0'
  SHELLCHECK_SHA256: 700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f
  ACTIONLINT_ASSET: actionlint_1.7.7_linux_amd64.tar.gz
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
  F97_CREDENTIAL_PATTERN: >-
    eyJhbG[A-Za-z0-9_-]{10,}|sb_publishable_[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{10,}|sbp_[A-Za-z0-9_-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghs_[A-Za-z0-9]{20,}|opencode_[A-Za-z0-9_-]{20,}|oc_[A-Za-z0-9_-]{30,}|OPENCODE_API_KEY[[:space:]]*[:=][[:space:]]*['"]?[A-Za-z0-9_-]{20,}

permissions:
  contents: read

jobs:
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve explicit F9.8 candidate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            F97_CANDIDATE_COMMIT="${{ github.event.pull_request.head.sha }}"
          else
            F97_CANDIDATE_COMMIT="${{ github.sha }}"
          fi
          printf '%s' "$F97_CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "$F97_BASELINE_COMMIT^{commit}"
          git cat-file -e "$F97_CANDIDATE_COMMIT^{commit}"
          git merge-base --is-ancestor "$F97_BASELINE_COMMIT" "$F97_CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$F97_CANDIDATE_COMMIT"
          F97_CANDIDATE_TREE="$(git rev-parse "$F97_CANDIDATE_COMMIT^{tree}")"
          test "$(git rev-parse "$F97_CANDIDATE_COMMIT^{tree}")" = "$F97_CANDIDATE_TREE"
          git diff --quiet
          git diff --cached --quiet
          {
            echo "F97_CANDIDATE_MODE=commit"
            echo "F97_CANDIDATE_COMMIT=$F97_CANDIDATE_COMMIT"
            echo "F97_CANDIDATE_TREE=$F97_CANDIDATE_TREE"
          } >> "$GITHUB_ENV"
      - name: Scan for hardcoded credentials
        run: |
          set -eu
          if git grep -a -q -E "$F97_CREDENTIAL_PATTERN" "$F97_CANDIDATE_TREE" -- .; then
            echo "::error::Potential hardcoded credential detected in candidate tree (content redacted)"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "::error::Credential scan failed operationally on candidate tree (rc=$rc)"
              exit 1
            fi
          fi
          for commit in $(git rev-list "$F97_BASELINE_COMMIT..$F97_CANDIDATE_COMMIT"); do
            tree="$(git rev-parse "$commit^{tree}")"
            if git grep -a -q -E "$F97_CREDENTIAL_PATTERN" "$tree" -- .; then
              echo "::error::Potential hardcoded credential detected in intermediate commit $commit (content redacted)"
              exit 1
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "::error::Credential scan failed operationally on commit $commit (rc=$rc)"
                exit 1
              fi
            fi
          done
          echo "Credential scan passed for candidate tree and commit range"

  release-gates:
    name: Release Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve explicit F9.7 candidate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            F97_CANDIDATE_COMMIT="${{ github.event.pull_request.head.sha }}"
          else
            F97_CANDIDATE_COMMIT="${{ github.sha }}"
          fi
          printf '%s' "$F97_CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "$F97_BASELINE_COMMIT^{commit}"
          git cat-file -e "$F97_CANDIDATE_COMMIT^{commit}"
          git merge-base --is-ancestor "$F97_BASELINE_COMMIT" "$F97_CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$F97_CANDIDATE_COMMIT"
          F97_CANDIDATE_TREE="$(git rev-parse "$F97_CANDIDATE_COMMIT^{tree}")"
          test "$(git rev-parse "$F97_CANDIDATE_COMMIT^{tree}")" = "$F97_CANDIDATE_TREE"
          git diff --quiet
          git diff --cached --quiet
          {
            echo "F97_CANDIDATE_MODE=commit"
            echo "F97_CANDIDATE_COMMIT=$F97_CANDIDATE_COMMIT"
            echo "F97_CANDIDATE_TREE=$F97_CANDIDATE_TREE"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned actionlint and ShellCheck
        run: |
          set -eu
          shellcheck_dir="$(mktemp -d "$RUNNER_TEMP/shellcheck.XXXXXXXX")"
          shellcheck_archive="$shellcheck_dir/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$shellcheck_archive" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum -c -
          tar -xJf "$shellcheck_archive" -C "$shellcheck_dir"
          PATH="$shellcheck_dir/shellcheck-v${SHELLCHECK_VERSION}:$PATH"
          command -v shellcheck
          reported_shellcheck_version="$(shellcheck --version | awk -F': ' '$1 == "version" { print $2 }')"
          test "$reported_shellcheck_version" = "$SHELLCHECK_VERSION"
          echo "$shellcheck_dir/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          actionlint_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXXXX")"
          actionlint_archive="$actionlint_dir/$ACTIONLINT_ASSET"
          curl -fsSLo "$actionlint_archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ASSET}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum -c -
          tar -xzf "$actionlint_archive" -C "$actionlint_dir" actionlint
          reported_actionlint_output="$("$actionlint_dir/actionlint" -version)"
          reported_actionlint_release="${reported_actionlint_output%%$'\n'*}"
          test "$reported_actionlint_release" = "$ACTIONLINT_VERSION"
          echo "ACTIONLINT_BIN=$actionlint_dir/actionlint" >> "$GITHUB_ENV"
      - name: Run actionlint
        run: |
          set -eu
          command -v shellcheck
          reported_shellcheck_version="$(shellcheck --version | awk -F': ' '$1 == "version" { print $2 }')"
          test "$reported_shellcheck_version" = "$SHELLCHECK_VERSION"
          workflow_list="$RUNNER_TEMP/actionlint-workflows.list"
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 > "$workflow_list"
          test -s "$workflow_list"
          xargs -0 "$ACTIONLINT_BIN" \
            -config-file .github/actionlint.yaml < "$workflow_list"
      - name: Enforce LF for candidate text files
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          baseline = os.environ['F97_BASELINE_COMMIT']
          candidate = os.environ['F97_CANDIDATE_COMMIT']
          raw = subprocess.check_output([
              'git', 'diff', '--name-status', '-z', '--find-renames', '--find-copies', '--diff-filter=ACMR',
              baseline, candidate, '--',
          ])
          fields = raw.split(b'\0')
          failed = []
          index = 0
          while index < len(fields) and fields[index]:
              status = fields[index].decode('ascii')
              index += 1
              if status.startswith(('R', 'C')):
                  index += 1
              path = fields[index].decode('utf-8', 'surrogateescape')
              index += 1
              blob = subprocess.check_output(['git', 'cat-file', 'blob', f'{candidate}:{path}'])
              if b'\0' in blob:
                  continue
              if b'\r\n' in blob:
                  failed.append(path.encode('unicode_escape').decode('ascii'))
          if failed:
              for path in failed:
                  print(f'::error file={path}::CRLF detected in changed candidate blob')
              raise SystemExit(1)
          PY
      - name: Check whitespace and protected path drift
        run: |
          set -eu
          git cat-file -e "$F97_BASELINE_COMMIT^{commit}"
          git cat-file -e "$F97_CANDIDATE_COMMIT^{commit}"
          git diff --check "$F97_BASELINE_COMMIT" "$F97_CANDIDATE_COMMIT"
          python3 - <<'PY'
          import os
          import subprocess

          protected = (
              '.github/workflows/fg1_inventory.yml',
              '.github/workflows/production_pipeline.yml',
              '.github/workflows/fg3_integrity.yml',
              '.github/workflows/db-sync-to-pro.yml',
              'scripts/core',
              'scripts/shared',
              'config',
              'requirements-fg1.txt',
              'requirements-pipeline.txt',
              'requirements-fg3.txt',
              'requirements-db-migrate.txt',
              'db/manifests/fase09_7_free_schema_rls_v3.json',
              'db/migrations/20260724_fase06_g1b_reconciliation.sql',
              'db/migrations/20260724_fase06_hito1_editorial_contract.sql',
              'db/migrations/20260725_fase07_g1b_closure.sql',
              'db/migrations/20260725_fase08_hito1_functional_closure.sql',
              'db/migrations/20260727_fase09_7_public_access_closure.sql',
              'db/migrations/20260728_fase09_7_notify_new_lead_retirement_v3.sql',
              'scripts/maintenance/category_coverage_audit.py',
              'scripts/maintenance/quality_assurance_audit.py',
              'scripts/maintenance/taxonomy_roi_audit.py',
          )
          f98_ca1_allowed = {
              '.github/workflows/fg1_inventory.yml',
              '.github/workflows/production_pipeline.yml',
              '.github/workflows/fg3_integrity.yml',
              'scripts/core/discovery_institutions.py',
              'scripts/core/universal_harvester.py',
              'scripts/core/sync_vector_worker.py',
              'scripts/core/integrity_ping.py',
              'scripts/shared/db_client.py',
          }

          def ls_tree(treeish):
              raw = subprocess.check_output(['git', 'ls-tree', '-r', '-z', treeish, '--', *protected])
              objects = {}
              for record in raw.split(b'\0'):
                  if not record:
                      continue
                  meta, path = record.split(b'\t', 1)
                  mode, kind, oid = meta.decode('ascii').split(' ')
                  objects[path.decode('utf-8', 'surrogateescape')] = (mode, kind, oid)
              return objects

          baseline = ls_tree(os.environ['F97_BASELINE_COMMIT'])
          candidate = ls_tree(os.environ['F97_CANDIDATE_TREE'])
          if len(baseline) != 32:
              raise SystemExit(f'protected baseline expansion drifted: {len(baseline)}')
          failed = []
          raw_status = subprocess.check_output([
              'git', 'diff', '--name-status', '-z', '--find-renames', '--find-copies',
              os.environ['F97_BASELINE_COMMIT'], os.environ['F97_CANDIDATE_COMMIT'], '--'
          ])
          status_by_path = {}
          fields = raw_status.split(b'\0')
          index = 0
          while index < len(fields) and fields[index]:
              status = fields[index].decode('ascii')
              index += 1
              if status.startswith(('R', 'C')):
                  old_path = fields[index].decode('utf-8', 'surrogateescape')
                  index += 1
                  path = fields[index].decode('utf-8', 'surrogateescape')
                  status_by_path[old_path] = status
              else:
                  path = fields[index].decode('utf-8', 'surrogateescape')
              index += 1
              status_by_path[path] = status
          for path in sorted(set(baseline) | set(candidate)):
              if baseline.get(path) != candidate.get(path):
                  failed.append(path.encode('unicode_escape').decode('ascii'))
          if failed:
              unexpected = [path for path in failed if path not in f98_ca1_allowed]
              allowed_failures = []
              for path in failed:
                  if path in f98_ca1_allowed:
                      base_mode, base_kind, _base_oid = baseline[path]
                      head_mode, head_kind, _head_oid = candidate[path]
                      if status_by_path.get(path) != 'M':
                          allowed_failures.append(path)
                      if (base_mode, base_kind, head_mode, head_kind) != ('100644', 'blob', '100644', 'blob'):
                          allowed_failures.append(path)
              if not unexpected and not allowed_failures:
                  print('F9.8 CA1 protected-path drift is within the explicit allowlist')
                  raise SystemExit(0)
              for path in sorted(set(unexpected + allowed_failures)):
                  print(f'::error file={path}::protected path blob/mode/path drift')
              raise SystemExit(1)
          PY
      - name: Validate Context Graph
        run: python3 scripts/maintenance/validate_context_graph.py

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend Static Build and Public Surface Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: npm ci
      - name: Install Python Playwright dependencies and browser
        run: |
          pip install --require-hashes -r ../requirements-test.txt
          python -m playwright install chromium --with-deps
      - name: Prepare frontend firewall cleanup state
        run: |
          state_dir="$(mktemp -d "$RUNNER_TEMP/f97-frontend-firewall.XXXXXXXX")"
          chmod 700 "$state_dir"
          echo "F97_FRONTEND_FIREWALL_STATE=$state_dir" >> "$GITHUB_ENV"
      - name: Block external egress for frontend public surface
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/fase09_7_firewall_guard.sh" setup F97_FRONTEND_EGRESS "$F97_FRONTEND_FIREWALL_STATE"
      - name: Build static frontend with local Supabase stub and hostile lead flag
        run: node tests/buildWithLocalSupabaseStub.mjs
      - name: Assert public static export and local Playwright contract
        env:
          SUPABASE_TEST_ORIGIN: http://127.0.0.1:54321
        run: |
          node tests/assertPublicExport.mjs
          python -m pytest -q ../tests/test_frontend_public_surfaces_playwright.py
      - name: Restore frontend public surface egress
        if: always()
        run: |
          cleanup_status=0
          state_dir="${F97_FRONTEND_FIREWALL_STATE:-}"
          if [ -n "$state_dir" ]; then
            if [ -d "$state_dir" ]; then
              "$GITHUB_WORKSPACE/.github/scripts/fase09_7_firewall_guard.sh" cleanup F97_FRONTEND_EGRESS "$state_dir" || cleanup_status=$?
              if [ "$cleanup_status" -eq 0 ]; then
                rm -rf -- "$state_dir" || cleanup_status=1
              fi
            else
              echo "F9.7 frontend firewall state directory is missing"
              cleanup_status=1
            fi
          fi
          exit "$cleanup_status"

  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check all core scripts compile
        run: |
          echo "Checking scripts/core/*.py..."
          find scripts/core -name '*.py' -exec python3 -m py_compile {} \;
          echo "Checking scripts/maintenance/*.py..."
          find scripts/maintenance -name '*.py' -exec python3 -m py_compile {} \;
          echo "Checking scripts/shared/*.py..."
          find scripts/shared -name '*.py' -exec python3 -m py_compile {} \;
          echo "✅ All Python scripts compile successfully"

  context-graph:
    name: Context Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate canonical context graph
        run: python3 scripts/maintenance/validate_context_graph.py

  fase06-db-as-code:
    name: FASE-06 DB-as-Code Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Validate FASE-06 package and credential contracts
        run: python3 -m pytest -q tests/test_fase06_db_as_code.py tests/test_supabase_credentials_contract.py

  fase07-g1b:
    name: FASE-07 G1b Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Validate FASE-07 G1b contract
        run: python3 -m pytest -q tests/test_fase07_g1b.py

  fase08-hito1:
    name: FASE-08 Hito 1 Functional Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: studiamatch_f8
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studiamatch_f8"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studiamatch_f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Validate FASE-08 Python contracts
        run: python3 -m pytest -q tests/test_fase08_db.py tests/test_fase08_workers.py
      - name: Validate FASE-08 PostgreSQL contract
        run: bash tests/sql/run_fase08_postgres.sh

  fase09-pre-free:
    name: FASE-09 Pre-Free Local Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: studiamatch_f9
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studiamatch_f9"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Block external egress for FASE-09 evidence
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          POSTGRES_IP=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_CONTAINER")
          test -n "$POSTGRES_IP"
          sudo iptables -N FASE09_EGRESS
          sudo iptables -A FASE09_EGRESS -o lo -j RETURN
          sudo iptables -A FASE09_EGRESS -p tcp -d "$POSTGRES_IP" --dport 5432 -j RETURN
          sudo iptables -A FASE09_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -A FASE09_EGRESS -j REJECT
          sudo iptables -I OUTPUT 1 -j FASE09_EGRESS
          sudo ip6tables -N FASE09_EGRESS
          sudo ip6tables -A FASE09_EGRESS -o lo -j RETURN
          sudo ip6tables -A FASE09_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
