name: Security Audit Gate

on:
  pull_request:
    branches: [desarrollo, certificacion, main]
  push:
    branches: [desarrollo, certificacion, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

permissions:
  contents: read

jobs:
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan for hardcoded credentials
        run: |
          PATTERNS="eyJhbG[A-Za-z0-9_-]{10,}|sb_publishable_[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{10,}|sbp_[A-Za-z0-9_-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghs_[A-Za-z0-9]{20,}|opencode_[A-Za-z0-9_-]{20,}|oc_[A-Za-z0-9_-]{30,}|OPENCODE_API_KEY[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_-]{20,}"
          if ! find . -type f \
            ! -path './.git/*' \
            ! -path '*/node_modules/*' \
            ! -path '*/.next/*' \
            ! -path '*/out/*' \
            ! -name '*.png' ! -name '*.jpg' ! -name '*.jpeg' \
            ! -name '*.gif' ! -name '*.ico' \
            ! -name '*.woff*' ! -name '*.ttf' ! -name '*.eot' \
            ! -name '*.mp4' ! -name '*.mov' ! -name '*.avi' \
            ! -name '*.pdf' ! -name '*.zip' ! -name '*.tar.gz' \
            -print0 > credential_files.list; then
            echo "Credential scan failed while enumerating files"
            exit 1
          fi
          while IFS= read -r -d '' file; do
            if grep -IqE "$PATTERNS" "$file"; then
              printf '%s\0' "$file" >> credential_findings.list
            else
              status=$?
              if [ "$status" -gt 1 ]; then
                echo "::error file=${file#./}::Credential scan failed while reading file"
                exit 1
              fi
            fi
          done < credential_files.list
          if [ -s credential_findings.list ]; then
            echo "❌ CREDENTIAL SCAN FAILED: Hardcoded credentials detected!"
            while IFS= read -r -d '' file; do
              echo "::error file=${file#./}::Potential hardcoded credential detected (content redacted)"
            done < credential_findings.list
            exit 1
          fi
          echo "✅ Credential scan passed"

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend Static Builds and Lead Capture Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: npm ci
      - name: Install Python Playwright dependencies and browser
        run: |
          pip install --require-hashes -r ../requirements-test.txt
          python -m playwright install chromium --with-deps
      - name: Run lead capture helper tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
        run: node --experimental-strip-types --test tests/leadCapture.test.ts
      - name: Build static frontend with lead capture enabled
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
          NEXT_PUBLIC_LEAD_CAPTURE_ENABLED: 'true'
        run: npm run build
      - name: Assert enabled static export and local Playwright POST contract
        env:
          LEAD_CAPTURE_EXPECTED: enabled
          SUPABASE_TEST_ORIGIN: http://127.0.0.1:54321
        run: |
          node tests/assertLeadCaptureExport.mjs enabled
          python -m pytest -q ../tests/test_frontend_lead_capture_playwright.py
      - name: Build static frontend with lead capture disabled
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
          NEXT_PUBLIC_LEAD_CAPTURE_ENABLED: 'false'
        run: npm run build
      - name: Assert disabled static export and local Playwright zero-POST contract
        env:
          LEAD_CAPTURE_EXPECTED: disabled
          SUPABASE_TEST_ORIGIN: http://127.0.0.1:54321
        run: |
          node tests/assertLeadCaptureExport.mjs disabled
          python -m pytest -q ../tests/test_frontend_lead_capture_playwright.py
      - name: Build static frontend with lead capture unset
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
        run: npm run build
      - name: Assert unset static export fails closed
        env:
          LEAD_CAPTURE_EXPECTED: unset
          SUPABASE_TEST_ORIGIN: http://127.0.0.1:54321
        run: |
          node tests/assertLeadCaptureExport.mjs unset
          python -m pytest -q ../tests/test_frontend_lead_capture_playwright.py

  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check all core scripts compile
        run: |
          echo "Checking scripts/core/*.py..."
          find scripts/core -name '*.py' -exec python3 -m py_compile {} \;
          echo "Checking scripts/maintenance/*.py..."
          find scripts/maintenance -name '*.py' -exec python3 -m py_compile {} \;
          echo "Checking scripts/shared/*.py..."
          find scripts/shared -name '*.py' -exec python3 -m py_compile {} \;
          echo "✅ All Python scripts compile successfully"

  context-graph:
    name: Context Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate canonical context graph
        run: python3 scripts/maintenance/validate_context_graph.py

  fase06-db-as-code:
    name: FASE-06 DB-as-Code Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Validate FASE-06 package and credential contracts
        run: python3 -m pytest -q tests/test_fase06_db_as_code.py tests/test_supabase_credentials_contract.py

  fase07-g1b:
    name: FASE-07 G1b Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Validate FASE-07 G1b contract
        run: python3 -m pytest -q tests/test_fase07_g1b.py

  fase08-hito1:
    name: FASE-08 Hito 1 Functional Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: studiamatch_f8
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studiamatch_f8"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studiamatch_f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Validate FASE-08 Python contracts
        run: python3 -m pytest -q tests/test_fase08_db.py tests/test_fase08_workers.py
      - name: Validate FASE-08 PostgreSQL contract
        run: bash tests/sql/run_fase08_postgres.sh

  fase09-pre-free:
    name: FASE-09 Pre-Free Local Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: studiamatch_f9
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studiamatch_f9"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Block external egress for FASE-09 evidence
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          POSTGRES_IP=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_CONTAINER")
          test -n "$POSTGRES_IP"
          sudo iptables -N FASE09_EGRESS
          sudo iptables -A FASE09_EGRESS -o lo -j RETURN
          sudo iptables -A FASE09_EGRESS -p tcp -d "$POSTGRES_IP" --dport 5432 -j RETURN
          sudo iptables -A FASE09_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -A FASE09_EGRESS -j REJECT
          sudo iptables -I OUTPUT 1 -j FASE09_EGRESS
          sudo ip6tables -N FASE09_EGRESS
          sudo ip6tables -A FASE09_EGRESS -o lo -j RETURN
          sudo ip6tables -A FASE09_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo ip6tables -A FASE09_EGRESS -j REJECT
          sudo ip6tables -I OUTPUT 1 -j FASE09_EGRESS
      - name: Validate FASE-09 Python contracts
        run: >-
          env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE"
          python3 -m pytest -q tests/test_fase09_db.py tests/test_fase09_workers.py
      - name: Validate FASE-09 PostgreSQL package
        run: >-
          env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE"
          TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/studiamatch_f9
          bash tests/sql/run_fase09_postgres.sh
      - name: Restore runner network
        if: always()
        run: |
          sudo iptables -D OUTPUT -j FASE09_EGRESS || true
          sudo iptables -F FASE09_EGRESS || true
          sudo iptables -X FASE09_EGRESS || true
          sudo ip6tables -D OUTPUT -j FASE09_EGRESS || true
          sudo ip6tables -F FASE09_EGRESS || true
          sudo ip6tables -X FASE09_EGRESS || true

  fase09-free-preflight-contract:
    name: F9.3 Free Preflight Local Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Prepare F9.3 firewall cleanup state
        run: |
          state_dir=$(mktemp -d "$RUNNER_TEMP/fase093-firewall.XXXXXXXX")
          chmod 700 "$state_dir"
          echo "FASE093_FIREWALL_STATE=$state_dir" >> "$GITHUB_ENV"
      - name: Block all egress for F9.3 local validation
        run: |
          test -d "$FASE093_FIREWALL_STATE"
          sudo iptables -w 10 -L OUTPUT >/dev/null
          sudo ip6tables -w 10 -L OUTPUT >/dev/null
          if sudo iptables -w 10 -nL FASE093_EGRESS >/dev/null 2>&1; then
            echo "FASE093_EGRESS IPv4 chain already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "Unable to verify IPv4 chain absence (rc=$rc)"
              exit 1
            fi
          fi
          if sudo ip6tables -w 10 -nL FASE093_EGRESS >/dev/null 2>&1; then
            echo "FASE093_EGRESS IPv6 chain already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "Unable to verify IPv6 chain absence (rc=$rc)"
              exit 1
            fi
          fi
          : > "$FASE093_FIREWALL_STATE/ipv4-owned"
          sudo iptables -w 10 -N FASE093_EGRESS
          sudo iptables -w 10 -A FASE093_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -w 10 -A FASE093_EGRESS -j REJECT
          sudo iptables -w 10 -I OUTPUT 1 -j FASE093_EGRESS
          : > "$FASE093_FIREWALL_STATE/ipv6-owned"
          sudo ip6tables -w 10 -N FASE093_EGRESS
          sudo ip6tables -w 10 -A FASE093_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo ip6tables -w 10 -A FASE093_EGRESS -j REJECT
          sudo ip6tables -w 10 -I OUTPUT 1 -j FASE093_EGRESS
      - name: Validate F9.3 focused contract tests
        run: |
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo down
            test "$(ip -o link show up | wc -l)" -eq 0
            cd "$1"
            exec setpriv --reuid="$3" --regid="$4" --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i HOME=/tmp CI=true PATH="$2" PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=10s 300s python3 -m pytest -q -p no:cacheprovider tests/test_fase09_free_preflight.py
          ' _ "$GITHUB_WORKSPACE" "$PATH" "$(id -u)" "$(id -g)"
      - name: Validate F9.3 immutable descriptor
        run: |
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo down
            test "$(ip -o link show up | wc -l)" -eq 0
            cd "$1"
            exec setpriv --reuid="$3" --regid="$4" --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i HOME=/tmp CI=true PATH="$2" PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=10s 60s python3 scripts/maintenance/free_preflight.py --contract db/manifests/f9_3_free_preflight_contract.json --validate-only
          ' _ "$GITHUB_WORKSPACE" "$PATH" "$(id -u)" "$(id -g)"
      - name: Replay F9.3 synthetic fail-closed contract
        run: |
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo down
            test "$(ip -o link show up | wc -l)" -eq 0
            cd "$1"
            exec setpriv --reuid="$3" --regid="$4" --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i HOME=/tmp CI=true PATH="$2" PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=10s 60s python3 scripts/maintenance/free_preflight.py --contract db/manifests/f9_3_free_preflight_contract.json --synthetic-self-test
          ' _ "$GITHUB_WORKSPACE" "$PATH" "$(id -u)" "$(id -g)"
      - name: Restore runner network
        if: always()
        run: |
          cleanup_failed=0
          state_dir="${FASE093_FIREWALL_STATE:-}"
          ipv4_available=1
          ipv6_available=1

          if ! sudo iptables -w 10 -L OUTPUT >/dev/null; then
            echo "Unable to access IPv4 firewall for cleanup"
            cleanup_failed=1
            ipv4_available=0
          fi
          if ! sudo ip6tables -w 10 -L OUTPUT >/dev/null; then
            echo "Unable to access IPv6 firewall for cleanup"
            cleanup_failed=1
            ipv6_available=0
          fi

          if [ "$ipv4_available" -eq 1 ] && [ -n "$state_dir" ] && [ -f "$state_dir/ipv4-owned" ]; then
            while true; do
              if sudo iptables -w 10 -C OUTPUT -j FASE093_EGRESS >/dev/null 2>&1; then
                if ! sudo iptables -w 10 -D OUTPUT -j FASE093_EGRESS; then
                  cleanup_failed=1
                  break
                fi
              else
                rc=$?
                if [ "$rc" -eq 1 ]; then
                  break
                fi
                echo "IPv4 jump check failed during cleanup (rc=$rc)"
                cleanup_failed=1
                break
              fi
            done
            if sudo iptables -w 10 -nL FASE093_EGRESS >/dev/null 2>&1; then
              if ! sudo iptables -w 10 -F FASE093_EGRESS; then
                cleanup_failed=1
              fi
              if ! sudo iptables -w 10 -X FASE093_EGRESS; then
                cleanup_failed=1
              fi
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "IPv4 chain check failed during cleanup (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi
          if [ "$ipv6_available" -eq 1 ] && [ -n "$state_dir" ] && [ -f "$state_dir/ipv6-owned" ]; then
            while true; do
              if sudo ip6tables -w 10 -C OUTPUT -j FASE093_EGRESS >/dev/null 2>&1; then
                if ! sudo ip6tables -w 10 -D OUTPUT -j FASE093_EGRESS; then
                  cleanup_failed=1
                  break
                fi
              else
                rc=$?
                if [ "$rc" -eq 1 ]; then
                  break
                fi
                echo "IPv6 jump check failed during cleanup (rc=$rc)"
                cleanup_failed=1
                break
              fi
            done
            if sudo ip6tables -w 10 -nL FASE093_EGRESS >/dev/null 2>&1; then
              if ! sudo ip6tables -w 10 -F FASE093_EGRESS; then
                cleanup_failed=1
              fi
              if ! sudo ip6tables -w 10 -X FASE093_EGRESS; then
                cleanup_failed=1
              fi
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "IPv6 chain check failed during cleanup (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi

          if [ "$ipv4_available" -eq 1 ]; then
            if sudo iptables -w 10 -nL FASE093_EGRESS >/dev/null 2>&1; then
              echo "FASE093_EGRESS chain remains in iptables"
              cleanup_failed=1
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Unable to verify IPv4 chain absence (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi
          if [ "$ipv6_available" -eq 1 ]; then
            if sudo ip6tables -w 10 -nL FASE093_EGRESS >/dev/null 2>&1; then
              echo "FASE093_EGRESS chain remains in ip6tables"
              cleanup_failed=1
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Unable to verify IPv6 chain absence (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi
          if [ -n "$state_dir" ] && [ -d "$state_dir" ]; then
            if ! rm -rf -- "$state_dir"; then
              cleanup_failed=1
            fi
          fi
          exit "$cleanup_failed"

  fase09-5-rls:
    name: F9.5 RLS Forward-only PostgreSQL 17 Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Prepare F9.5 firewall cleanup state
        run: |
          state_dir=$(mktemp -d "$RUNNER_TEMP/fase095-firewall.XXXXXXXX")
          chmod 711 "$state_dir"
          echo "FASE095_FIREWALL_STATE=$state_dir" >> "$GITHUB_ENV"
      - name: Start networkless F9.5 PostgreSQL 17
        run: |
          socket_dir="$FASE095_FIREWALL_STATE/postgres-socket"
          mkdir "$socket_dir"
          chmod 777 "$socket_dir"
          docker run --detach --name studiamatch-f95-postgres \
            --network none \
            --security-opt no-new-privileges:true \
            --volume "$socket_dir:/var/run/postgresql" \
            --env POSTGRES_DB=studiamatch_f95 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' \
            studiamatch-f95-postgres)" = "none"
          ready=0
          for _ in $(seq 1 30); do
            if pg_isready --host "$socket_dir" --username postgres \
              --dbname studiamatch_f95; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Block external egress for F9.5 PostgreSQL evidence
        run: |
          test -d "$FASE095_FIREWALL_STATE"
          sudo iptables -w 10 -L OUTPUT >/dev/null
          sudo ip6tables -w 10 -L OUTPUT >/dev/null
          if sudo iptables -w 10 -nL FASE095_EGRESS >/dev/null 2>&1; then
            echo "FASE095_EGRESS IPv4 chain already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "Unable to verify IPv4 chain absence (rc=$rc)"
              exit 1
            fi
          fi
          if sudo ip6tables -w 10 -nL FASE095_EGRESS >/dev/null 2>&1; then
            echo "FASE095_EGRESS IPv6 chain already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "Unable to verify IPv6 chain absence (rc=$rc)"
              exit 1
            fi
          fi
          : > "$FASE095_FIREWALL_STATE/ipv4-owned"
          sudo iptables -w 10 -N FASE095_EGRESS
          sudo iptables -w 10 -A FASE095_EGRESS -o lo -j RETURN
          sudo iptables -w 10 -A FASE095_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -w 10 -A FASE095_EGRESS -p tcp -d 1.1.1.1 \
            --dport 443 -j REJECT
          sudo iptables -w 10 -A FASE095_EGRESS -j REJECT
          sudo iptables -w 10 -I OUTPUT 1 -j FASE095_EGRESS
          : > "$FASE095_FIREWALL_STATE/ipv6-owned"
          sudo ip6tables -w 10 -N FASE095_EGRESS
          sudo ip6tables -w 10 -A FASE095_EGRESS -o lo -j RETURN
          sudo ip6tables -w 10 -A FASE095_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo ip6tables -w 10 -A FASE095_EGRESS -j REJECT
          sudo ip6tables -w 10 -I OUTPUT 1 -j FASE095_EGRESS
      - name: Prove F9.5 external egress is blocked
        run: |
          sudo iptables -w 10 -C OUTPUT -j FASE095_EGRESS
          sudo iptables -w 10 -C FASE095_EGRESS -j REJECT
          sudo ip6tables -w 10 -C OUTPUT -j FASE095_EGRESS
          sudo ip6tables -w 10 -C FASE095_EGRESS -j REJECT
          reject_before=$(sudo iptables -w 10 -nvxL FASE095_EGRESS | \
            awk '$3 == "REJECT" && $9 == "1.1.1.1" { print $1 }')
          test -n "$reject_before"
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp PATH="$PATH" python3 - <<'PY'
          import socket

          try:
              socket.create_connection(("1.1.1.1", 443), timeout=2).close()
          except OSError:
              pass
          else:
              raise SystemExit("F9.5 IPv4 egress probe unexpectedly connected")
          PY
          reject_after=$(sudo iptables -w 10 -nvxL FASE095_EGRESS | \
            awk '$3 == "REJECT" && $9 == "1.1.1.1" { print $1 }')
          test -n "$reject_after"
          test "$reject_after" -gt "$reject_before"
      - name: Validate F9.5 Python and PostgreSQL contracts without secrets
        run: |
          workspace_ancestor="$(dirname "$GITHUB_WORKSPACE")"
          while [ "$workspace_ancestor" != "/" ]; do
            sudo chmod o+x "$workspace_ancestor"
            workspace_ancestor="$(dirname "$workspace_ancestor")"
          done
          sudo chmod -R o+rX "$GITHUB_WORKSPACE"
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            test -r "$GITHUB_WORKSPACE/tests/test_fase09_5_rls.py"
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            test ! -w "$GITHUB_WORKSPACE/tests/test_fase09_5_rls.py"
          if [ -S /var/run/docker.sock ]; then
            sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
              --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
              test ! -r /var/run/docker.sock
            sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
              --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
              test ! -w /var/run/docker.sock
          fi
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
             env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
             PYTHONDONTWRITEBYTECODE=1 timeout --signal=TERM --kill-after=10s 300s \
             python3 -m pytest -q -p no:cacheprovider \
             tests/test_fase09_5_rls.py tests/test_fase09_5_rls_v2.py
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            TEST_DATABASE_URL="postgresql://postgres:postgres@/studiamatch_f95?host=$FASE095_FIREWALL_STATE/postgres-socket" \
            timeout --signal=TERM --kill-after=10s 300s bash tests/sql/run_fase09_5_postgres.sh
      - name: Restore runner network
        if: always()
        run: |
          cleanup_failed=0
          state_dir="${FASE095_FIREWALL_STATE:-}"

          cleanup_family() {
            firewall="$1"
            marker="$2"
            family="$3"
            if ! sudo "$firewall" -w 10 -L OUTPUT >/dev/null; then
              echo "Unable to access $family firewall for cleanup"
              cleanup_failed=1
              return
            fi
            if [ -n "$state_dir" ] && [ -f "$state_dir/$marker" ]; then
              while true; do
                if sudo "$firewall" -w 10 -C OUTPUT -j FASE095_EGRESS >/dev/null 2>&1; then
                  if ! sudo "$firewall" -w 10 -D OUTPUT -j FASE095_EGRESS; then
                    cleanup_failed=1
                    break
                  fi
                else
                  rc=$?
                  if [ "$rc" -eq 1 ]; then
                    break
                  fi
                  echo "$family jump check failed during cleanup (rc=$rc)"
                  cleanup_failed=1
                  break
                fi
              done
              if sudo "$firewall" -w 10 -nL FASE095_EGRESS >/dev/null 2>&1; then
                if ! sudo "$firewall" -w 10 -F FASE095_EGRESS; then
                  cleanup_failed=1
                fi
                if ! sudo "$firewall" -w 10 -X FASE095_EGRESS; then
                  cleanup_failed=1
                fi
              else
                rc=$?
                if [ "$rc" -ne 1 ]; then
                  echo "$family chain check failed during cleanup (rc=$rc)"
                  cleanup_failed=1
                fi
              fi
            fi
            if sudo "$firewall" -w 10 -nL FASE095_EGRESS >/dev/null 2>&1; then
              echo "FASE095_EGRESS chain remains in $firewall"
              cleanup_failed=1
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Unable to verify $family chain absence (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          }

          cleanup_family iptables ipv4-owned IPv4
          cleanup_family ip6tables ipv6-owned IPv6
          if docker inspect studiamatch-f95-postgres >/dev/null 2>&1; then
            if ! docker rm --force studiamatch-f95-postgres; then
              cleanup_failed=1
            fi
          fi
          if [ -n "$state_dir" ] && [ -d "$state_dir" ]; then
            if ! sudo rm -rf -- "$state_dir"; then
              cleanup_failed=1
            fi
          fi
          exit "$cleanup_failed"

  fase10-promotion-contract:
    name: FASE-10 Local Promotion Contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Prepare FASE-10 firewall cleanup state
        run: |
          state_dir=$(mktemp -d "$RUNNER_TEMP/fase10-firewall.XXXXXXXX")
          chmod 700 "$state_dir"
          echo "FASE10_FIREWALL_STATE=$state_dir" >> "$GITHUB_ENV"
      - name: Block external egress for FASE-10 evidence
        run: |
          test -d "$FASE10_FIREWALL_STATE"
          sudo iptables -w 10 -L OUTPUT >/dev/null
          sudo ip6tables -w 10 -L OUTPUT >/dev/null
          if sudo iptables -w 10 -nL FASE10_EGRESS >/dev/null 2>&1; then
            echo "FASE10_EGRESS IPv4 chain already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "Unable to verify IPv4 chain absence (rc=$rc)"
              exit 1
            fi
          fi
          if sudo ip6tables -w 10 -nL FASE10_EGRESS >/dev/null 2>&1; then
            echo "FASE10_EGRESS IPv6 chain already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "Unable to verify IPv6 chain absence (rc=$rc)"
              exit 1
            fi
          fi
          : > "$FASE10_FIREWALL_STATE/ipv4-owned"
          sudo iptables -w 10 -N FASE10_EGRESS
          sudo iptables -w 10 -A FASE10_EGRESS -o lo -j RETURN
          sudo iptables -w 10 -A FASE10_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -w 10 -A FASE10_EGRESS -j REJECT
          sudo iptables -w 10 -I OUTPUT 1 -j FASE10_EGRESS
          : > "$FASE10_FIREWALL_STATE/ipv6-owned"
          sudo ip6tables -w 10 -N FASE10_EGRESS
          sudo ip6tables -w 10 -A FASE10_EGRESS -o lo -j RETURN
          sudo ip6tables -w 10 -A FASE10_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo ip6tables -w 10 -A FASE10_EGRESS -j REJECT
          sudo ip6tables -w 10 -I OUTPUT 1 -j FASE10_EGRESS
      - name: Validate FASE-10 promotion descriptor
        run: >-
          env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE"
          timeout --signal=TERM --kill-after=10s 120s python3 scripts/maintenance/db_migrate.py --env free
          --promotion-contract db/manifests/fase10_promotion_contract.json --validate-only
      - name: Validate FASE-10 promotion contracts
        run: >-
          env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE"
          timeout --signal=TERM --kill-after=10s 900s python3 -m pytest -q
          tests/test_fase06_db_as_code.py
          tests/test_fase07_g1b.py
          tests/test_fase08_db.py
          tests/test_fase08_workers.py
          tests/test_fase09_db.py
          tests/test_fase09_workers.py
          tests/test_fase10_promotion_contract.py
          tests/test_supabase_credentials_contract.py
      - name: Restore runner network
        if: always()
        run: |
          cleanup_failed=0
          state_dir="${FASE10_FIREWALL_STATE:-}"
          ipv4_available=1
          ipv6_available=1

          if ! sudo iptables -w 10 -L OUTPUT >/dev/null; then
            echo "Unable to access IPv4 firewall for cleanup"
            cleanup_failed=1
            ipv4_available=0
          fi
          if ! sudo ip6tables -w 10 -L OUTPUT >/dev/null; then
            echo "Unable to access IPv6 firewall for cleanup"
            cleanup_failed=1
            ipv6_available=0
          fi

          if [ "$ipv4_available" -eq 1 ] && [ -n "$state_dir" ] && [ -f "$state_dir/ipv4-owned" ]; then
            while true; do
              if sudo iptables -w 10 -C OUTPUT -j FASE10_EGRESS >/dev/null 2>&1; then
                if ! sudo iptables -w 10 -D OUTPUT -j FASE10_EGRESS; then
                  cleanup_failed=1
                  break
                fi
              else
                rc=$?
                if [ "$rc" -eq 1 ]; then
                  break
                fi
                echo "IPv4 jump check failed during cleanup (rc=$rc)"
                cleanup_failed=1
                break
              fi
            done
            if sudo iptables -w 10 -nL FASE10_EGRESS >/dev/null 2>&1; then
              if ! sudo iptables -w 10 -F FASE10_EGRESS; then
                cleanup_failed=1
              fi
              if ! sudo iptables -w 10 -X FASE10_EGRESS; then
                cleanup_failed=1
              fi
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "IPv4 chain check failed during cleanup (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi
          if [ "$ipv6_available" -eq 1 ] && [ -n "$state_dir" ] && [ -f "$state_dir/ipv6-owned" ]; then
            while true; do
              if sudo ip6tables -w 10 -C OUTPUT -j FASE10_EGRESS >/dev/null 2>&1; then
                if ! sudo ip6tables -w 10 -D OUTPUT -j FASE10_EGRESS; then
                  cleanup_failed=1
                  break
                fi
              else
                rc=$?
                if [ "$rc" -eq 1 ]; then
                  break
                fi
                echo "IPv6 jump check failed during cleanup (rc=$rc)"
                cleanup_failed=1
                break
              fi
            done
            if sudo ip6tables -w 10 -nL FASE10_EGRESS >/dev/null 2>&1; then
              if ! sudo ip6tables -w 10 -F FASE10_EGRESS; then
                cleanup_failed=1
              fi
              if ! sudo ip6tables -w 10 -X FASE10_EGRESS; then
                cleanup_failed=1
              fi
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "IPv6 chain check failed during cleanup (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi

          if [ "$ipv4_available" -eq 1 ]; then
            if sudo iptables -w 10 -nL FASE10_EGRESS >/dev/null 2>&1; then
              echo "FASE10_EGRESS chain remains in iptables"
              cleanup_failed=1
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Unable to verify IPv4 chain absence (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi
          if [ "$ipv6_available" -eq 1 ]; then
            if sudo ip6tables -w 10 -nL FASE10_EGRESS >/dev/null 2>&1; then
              echo "FASE10_EGRESS chain remains in ip6tables"
              cleanup_failed=1
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Unable to verify IPv6 chain absence (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi
          if [ -n "$state_dir" ] && [ -d "$state_dir" ]; then
            if ! rm -rf -- "$state_dir"; then
              cleanup_failed=1
            fi
          fi
          exit "$cleanup_failed"

  fase09-7-remediation:
    name: F9.7 Remediation Definition PostgreSQL 17 Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned F9.7 test dependencies
        run: >-
          pip install --require-hashes
          -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Prepare F9.7 local PostgreSQL socket
        run: |
          state_dir=$(mktemp -d "$RUNNER_TEMP/fase097-audit.XXXXXXXX")
          chmod 711 "$state_dir"
          mkdir "$state_dir/postgres-socket"
          chmod 777 "$state_dir/postgres-socket"
          echo "FASE097_AUDIT_STATE=$state_dir" >> "$GITHUB_ENV"
      - name: Start networkless F9.7 PostgreSQL 17
        run: |
          docker run --detach --name studiamatch-f97-audit-postgres \
            --network none \
            --security-opt no-new-privileges:true \
            --volume "$FASE097_AUDIT_STATE/postgres-socket:/var/run/postgresql" \
            --env POSTGRES_DB=studiamatch_f97 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' \
            studiamatch-f97-audit-postgres)" = "none"
          for _ in $(seq 1 30); do
            pg_isready --host "$FASE097_AUDIT_STATE/postgres-socket" \
              --username postgres --dbname studiamatch_f97 && exit 0
            sleep 1
          done
          exit 1
      - name: Block external egress for F9.7
        run: |
          sudo iptables -w 10 -N FASE097_AUDIT_EGRESS
          sudo iptables -w 10 -A FASE097_AUDIT_EGRESS -o lo -j RETURN
          sudo iptables -w 10 -A FASE097_AUDIT_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -w 10 -A FASE097_AUDIT_EGRESS -j REJECT
          sudo iptables -w 10 -I OUTPUT 1 -j FASE097_AUDIT_EGRESS
          sudo ip6tables -w 10 -N FASE097_AUDIT_EGRESS
          sudo ip6tables -w 10 -A FASE097_AUDIT_EGRESS -o lo -j RETURN
          sudo ip6tables -w 10 -A FASE097_AUDIT_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo ip6tables -w 10 -A FASE097_AUDIT_EGRESS -j REJECT
          sudo ip6tables -w 10 -I OUTPUT 1 -j FASE097_AUDIT_EGRESS
      - name: Validate F9.7 local-only remediation contracts
        run: |
          workspace_ancestor="$(dirname "$GITHUB_WORKSPACE")"
          while [ "$workspace_ancestor" != "/" ]; do
            sudo chmod o+x "$workspace_ancestor"
            workspace_ancestor="$(dirname "$workspace_ancestor")"
          done
          sudo chmod -R o+rX "$GITHUB_WORKSPACE"
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
              tests/test_fase09_7_backend_identity.py \
              tests/test_fase09_7_acl_source_attestation.py \
              tests/test_fase09_7_gate_b_readonly.py \
              tests/test_fase09_7_remediation_definition.py \
              tests/test_fase09_7_schema_rls.py \
              tests/test_supabase_credentials_contract.py
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            PYTHONDONTWRITEBYTECODE=1 \
            TEST_DATABASE_URL="postgresql://postgres:postgres@/studiamatch_f97?host=$FASE097_AUDIT_STATE/postgres-socket" \
            python3 -m pytest -q -p no:cacheprovider \
              tests/test_fase09_7_acl_source_attestation.py
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            TEST_DATABASE_URL="postgresql://postgres:postgres@/studiamatch_f97?host=$FASE097_AUDIT_STATE/postgres-socket" \
            bash tests/sql/run_fase09_7_postgres.sh
      - name: Restore runner and remove F9.7 database
        if: always()
        run: |
          for firewall in iptables ip6tables; do
            while sudo "$firewall" -w 10 -C OUTPUT -j FASE097_AUDIT_EGRESS >/dev/null 2>&1; do
              sudo "$firewall" -w 10 -D OUTPUT -j FASE097_AUDIT_EGRESS
            done
            if sudo "$firewall" -w 10 -nL FASE097_AUDIT_EGRESS >/dev/null 2>&1; then
              sudo "$firewall" -w 10 -F FASE097_AUDIT_EGRESS
              sudo "$firewall" -w 10 -X FASE097_AUDIT_EGRESS
            fi
          done
          docker rm --force studiamatch-f97-audit-postgres >/dev/null 2>&1 || true
          if [ -n "${FASE097_AUDIT_STATE:-}" ] && [ -d "$FASE097_AUDIT_STATE" ]; then
            sudo rm -rf -- "$FASE097_AUDIT_STATE"
          fi

  security-audit:
    name: security-audit
    if: always()
    needs: [credential-scan, lint, typecheck, frontend-build, python-check, context-graph, fase06-db-as-code, fase07-g1b, fase08-hito1, fase09-pre-free, fase09-free-preflight-contract, fase09-5-rls, fase09-7-remediation, fase10-promotion-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          CS: ${{ needs.credential-scan.result }}
          LINT: ${{ needs.lint.result }}
          TC: ${{ needs.typecheck.result }}
          BUILD: ${{ needs.frontend-build.result }}
          PC: ${{ needs.python-check.result }}
          CG: ${{ needs.context-graph.result }}
          F6: ${{ needs.fase06-db-as-code.result }}
          F7: ${{ needs.fase07-g1b.result }}
          F8: ${{ needs.fase08-hito1.result }}
          F9: ${{ needs.fase09-pre-free.result }}
          F93: ${{ needs.fase09-free-preflight-contract.result }}
          F95: ${{ needs.fase09-5-rls.result }}
          F97: ${{ needs.fase09-7-remediation.result }}
          F10: ${{ needs.fase10-promotion-contract.result }}
        run: |
          exec >> "$GITHUB_STEP_SUMMARY"
          echo "### Security Audit Results"
          echo ""
          echo "| Check | Status |"
          echo "|---|---|"
          # Credential scan and Python check are HARD requirements
          if [ "$CS" != "success" ]; then
            echo "❌ **credential-scan**: $CS (BLOCKING)"
            exit 1
          fi
          echo "✅ **credential-scan**: passed"
          if [ "$PC" != "success" ]; then
            echo "❌ **python-check**: $PC (BLOCKING)"
            exit 1
          fi
          echo "✅ **python-check**: passed"
          if [ "$CG" != "success" ]; then
            echo "❌ **context-graph**: $CG (BLOCKING)"
            exit 1
          fi
          echo "✅ **context-graph**: passed"
          if [ "$F6" != "success" ]; then
            echo "❌ **fase06-db-as-code**: $F6 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase06-db-as-code**: passed"
          if [ "$F7" != "success" ]; then
            echo "❌ **fase07-g1b**: $F7 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase07-g1b**: passed"
          if [ "$F8" != "success" ]; then
            echo "❌ **fase08-hito1**: $F8 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase08-hito1**: passed"
          if [ "$F9" != "success" ]; then
            echo "❌ **fase09-pre-free**: $F9 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase09-pre-free**: passed"
          if [ "$F93" != "success" ]; then
            echo "❌ **fase09-free-preflight-contract**: $F93 (BLOCKING)"
            exit 1
          fi
