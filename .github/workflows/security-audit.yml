name: Security Audit Gate

on:
  pull_request:
    branches: [desarrollo, certificacion, main]
  push:
    branches: [desarrollo, certificacion, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  F99_CERTIFICATION_BASELINE: e4ad815624184b692219ca9490347880af8de6b6
  F99_CA1_SOURCE_COMMIT: 456becf94a2bab3d8091c7036509cfb80791a3f9
  F910_CERTIFICATION_BASELINE: bc227629b8df1fcabca47ea7be3ea1d5b4c7667b
  F910_PRE_MAIN_SOURCE_COMMIT: bfe46ab31b150051f2842e6d8c196a2bfd431fab
  F108_CERTIFICATION_BASELINE: 5c40be67241cff5524191c8cbf71b76ccd2b0590
  F108_MAIN_GATE_BASELINE: f6fb25b2f00f283081de3180238da808117137cf
  F108_F97_MAIN_SCOPE_BASELINE: 8958ffdd021e09e43c48495057dc0869c990c9df
  F108_FG1_SOURCE_SLUG_BASELINE: 7b948c3ea5fe5057f17cf7aa11124c116f93c2f2

jobs:
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded credentials
        run: |
          PATTERNS="eyJhbG[A-Za-z0-9_-]{10,}|sb_publishable_[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{10,}|sbp_[A-Za-z0-9_-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghs_[A-Za-z0-9]{20,}|opencode_[A-Za-z0-9_-]{20,}|oc_[A-Za-z0-9_-]{30,}|OPENCODE_API_KEY[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_-]{20,}"
          raw_findings="$(mktemp)"
          find . -type f \
            ! -path './.git/*' \
            ! -path '*/node_modules/*' \
            ! -path '*/.next/*' \
            ! -path '*/out/*' \
            ! -name '*.lock' \
            ! -name '*.png' ! -name '*.jpg' ! -name '*.jpeg' \
            ! -name '*.gif' ! -name '*.ico' ! -name '*.svg' \
            ! -name '*.woff*' ! -name '*.ttf' ! -name '*.eot' \
            ! -name '*.mp4' ! -name '*.mov' ! -name '*.avi' \
            ! -name '*.pdf' ! -name '*.zip' ! -name '*.tar.gz' \
            -exec grep -nE "$PATTERNS" {} + > "$raw_findings" 2>/dev/null || true
          if [ -s "$raw_findings" ]; then
            awk -F: '{ print $1 ":" $2 ": [REDACTED credential-like value]" }' "$raw_findings" | head -50 | tee -a credential_findings.txt
            echo "❌ CREDENTIAL SCAN FAILED: Hardcoded credentials detected!"
            exit 1
          fi
          echo "✅ Credential scan passed"

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit

  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all core scripts compile
        run: |
          echo "Checking scripts/core/*.py..."
          find scripts/core -name '*.py' -exec python3 -m py_compile {} \;
          echo "Checking scripts/maintenance/*.py..."
          find scripts/maintenance -name '*.py' -exec python3 -m py_compile {} \;
          echo "Checking scripts/shared/*.py..."
          find scripts/shared -name '*.py' -exec python3 -m py_compile {} \;
          echo "Checking F10.8 DB Sync workflow contract..."
          python3 tests/test_fase10_8_db_sync.py
          echo "✅ All Python scripts compile successfully"

  f99-certification-selective:
    name: F9.9 Certification Selective Candidate
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'certificacion' && github.event.pull_request.base.sha == 'e4ad815624184b692219ca9490347880af8de6b6') || (github.event_name == 'push' && github.ref == 'refs/heads/certificacion' && github.event.before == 'e4ad815624184b692219ca9490347880af8de6b6') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate F9.9 selective CA1 boundary
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            F99_BASE_COMMIT="${{ github.event.pull_request.base.sha }}"
            F99_CANDIDATE_COMMIT="${{ github.event.pull_request.head.sha }}"
          else
            test "${{ github.ref }}" = "refs/heads/certificacion"
            F99_BASE_COMMIT="${{ github.event.before }}"
            F99_CANDIDATE_COMMIT="${{ github.sha }}"
          fi
          test "$F99_BASE_COMMIT" = "$F99_CERTIFICATION_BASELINE"
          printf '%s' "$F99_CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "$F99_CA1_SOURCE_COMMIT^{commit}"
          git cat-file -e "$F99_CERTIFICATION_BASELINE^{commit}"
          git cat-file -e "$F99_CANDIDATE_COMMIT^{commit}"
          test "$(git rev-parse HEAD)" = "$F99_CANDIDATE_COMMIT"
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          base = os.environ['F99_CERTIFICATION_BASELINE']
          source = os.environ['F99_CA1_SOURCE_COMMIT']
          head = os.environ.get('F99_CANDIDATE_COMMIT') or subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          # F9.9 bootstrap exception: this seed PR introduces the certificacion
          # boundary gate itself. Reuse is constrained by the exact baseline check.
          allowed_statuses = {
              '.github/workflows/f9_9_certification_canary.yml': {'A', 'M'},
              '.github/workflows/security-audit.yml': {'M'},
              'scripts/core/certification_canary_manifest.py': {'A', 'M'},
              'scripts/core/certification_canary_state.py': {'A', 'M'},
              'scripts/core/cleansing_worker.py': {'M'},
              'scripts/core/discovery_institutions.py': {'M'},
              'scripts/core/enrichment_worker.py': {'M'},
              'scripts/core/integrity_ping.py': {'M'},
              'scripts/core/master_orchestrator.py': {'M'},
              'scripts/core/sync_vector_worker.py': {'M'},
              'scripts/core/universal_harvester.py': {'M'},
              'tests/test_fase09_9_certification_canary.py': {'A', 'M'},
          }
          runtime_paths = {
              '.github/workflows/f9_9_certification_canary.yml',
              'scripts/core/certification_canary_manifest.py',
              'scripts/core/certification_canary_state.py',
              'scripts/core/cleansing_worker.py',
              'scripts/core/discovery_institutions.py',
              'scripts/core/enrichment_worker.py',
              'scripts/core/integrity_ping.py',
              'scripts/core/master_orchestrator.py',
              'scripts/core/sync_vector_worker.py',
              'scripts/core/universal_harvester.py',
          }
          harness_paths = {'tests/test_fase09_9_certification_canary.py'}
          source_equal_paths = sorted(runtime_paths - {
              '.github/workflows/f9_9_certification_canary.yml',
              'scripts/core/certification_canary_manifest.py',
              'scripts/core/certification_canary_state.py',
              'scripts/core/cleansing_worker.py',
              'scripts/core/enrichment_worker.py',
              'scripts/core/sync_vector_worker.py',
              'scripts/core/universal_harvester.py',
          })
          denied_prefixes = ('db/', 'supabase/', 'web/', 'scripts/maintenance/')
          denied_exact = {'supabase/functions/send-lead-emails/index.ts'}
          raw = subprocess.check_output([
              'git', 'diff', '--name-status', '-z', '--find-renames', '--find-copies',
              base, head, '--',
          ])
          fields = raw.split(b'\0')
          index = 0
          failures = []
          changed = []
          while index < len(fields) and fields[index]:
              status = fields[index].decode('ascii')
              index += 1
              old_path = None
              if status.startswith(('R', 'C')):
                  old_path = fields[index].decode('utf-8', 'surrogateescape')
                  index += 1
              path = fields[index].decode('utf-8', 'surrogateescape')
              index += 1
              paths = [path] + ([old_path] if old_path else [])
              changed.append((status, path))
              if any(p and (p.startswith(denied_prefixes) or p in denied_exact) for p in paths):
                  failures.append(f'denied-path:{status}:{path}')
                  continue
              expected = allowed_statuses.get(path)
              if not expected:
                  failures.append(f'unexpected-path:{status}:{path}')
                  continue
              if status not in expected:
                  failures.append(f'status:{status}:{path}')
                  continue
              base_meta = subprocess.check_output(['git', 'ls-tree', base, '--', path], text=True).strip()
              head_meta = subprocess.check_output(['git', 'ls-tree', head, '--', path], text=True).strip()
              if status == 'A':
                  if base_meta:
                      failures.append(f'base-present:{path}')
                  if not head_meta:
                      failures.append(f'missing-head:{path}')
                  elif head_meta.split(None, 3)[:2] != ['100644', 'blob']:
                      failures.append(f'head-kind:{path}')
              elif status == 'M':
                  if not base_meta or not head_meta:
                      failures.append(f'missing:{path}')
                  elif base_meta.split(None, 3)[:2] != head_meta.split(None, 3)[:2]:
                      failures.append(f'mode-kind:{path}')
          for path in source_equal_paths:
              source_blob = subprocess.check_output(['git', 'cat-file', 'blob', f'{source}:{path}'])
              head_blob = subprocess.check_output(['git', 'cat-file', 'blob', f'{head}:{path}'])
              if source_blob != head_blob:
                  failures.append(f'source-drift:{path}')
          if not changed:
              failures.append('empty-candidate')
          if failures:
              for failure in failures:
                  print(f'::error::{failure}')
              sys.exit(1)
          print('F9.9 selective CA1 boundary passed')
          PY
      - name: Run F9.9 canary contract tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('tests/test_fase09_9_certification_canary.py')
          spec = importlib.util.spec_from_file_location('f99_canary_tests', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          for name in sorted(dir(module)):
              if name.startswith('test_'):
                  getattr(module, name)()
          PY

  f910-pre-main-controls:
    name: F9.10 Pre-Main Repository Controls
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'certificacion' && github.event.pull_request.base.sha == 'bc227629b8df1fcabca47ea7be3ea1d5b4c7667b') || (github.event_name == 'push' && github.ref == 'refs/heads/certificacion' && github.event.before == 'bc227629b8df1fcabca47ea7be3ea1d5b4c7667b') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate F9.10 transition boundary
        env:
          F910_BASELINE: ${{ env.F910_CERTIFICATION_BASELINE }}
          F910_SOURCE_COMMIT: ${{ env.F910_PRE_MAIN_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            F910_BASE_COMMIT="${{ github.event.pull_request.base.sha }}"
            F910_CANDIDATE_COMMIT="${{ github.event.pull_request.head.sha }}"
          else
            test "${{ github.ref }}" = "refs/heads/certificacion"
            F910_BASE_COMMIT="${{ github.event.before }}"
            F910_CANDIDATE_COMMIT="${{ github.sha }}"
          fi
          test "$F910_BASE_COMMIT" = "$F910_BASELINE"
          printf '%s' "$F910_CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          git fetch --no-tags origin certificacion desarrollo
          git cat-file -e "$F910_SOURCE_COMMIT^{commit}"
          git cat-file -e "$F910_BASELINE^{commit}"
          git cat-file -e "$F910_CANDIDATE_COMMIT^{commit}"
          test "$(git rev-parse HEAD)" = "$F910_CANDIDATE_COMMIT"
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          base = os.environ["F910_BASELINE"]
          source = os.environ["F910_SOURCE_COMMIT"]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          allowed_statuses = {
              ".gitattributes": {"A"},
              ".context/evidencias_cliente/sprint_1/paquete_hito_001.md": {"M"},
              ".context/operaciones/plan_cierre_hito1_ca1_only.md": {"M"},
              ".github/scripts/production_control_preflight.sh": {"M"},
              ".github/workflows/production_canary.yml": {"A"},
              ".github/workflows/security-audit.yml": {"M"},
              "scripts/core/cleansing_worker.py": {"M"},
              "scripts/core/enrichment_worker.py": {"M"},
              "scripts/core/production_canary_manifest.py": {"A"},
              "scripts/core/production_canary_state.py": {"A"},
              "scripts/core/sync_vector_worker.py": {"M"},
              "scripts/core/universal_harvester.py": {"M"},
              "tests/test_fase09_10_pre_main_controls.py": {"M"},
              "tests/test_fase10_main_boundary.py": {"M"},
              "tests/test_fase10_production_canary.py": {"A"},
          }
          expected_modes = {
              path: "100644"
              for path in allowed_statuses
          }
          expected_modes[".github/workflows/security-audit.yml"] = "100755"
          source_equal_paths = {
              ".github/scripts/production_control_preflight.sh",
              ".github/workflows/production_canary.yml",
              "scripts/core/production_canary_manifest.py",
              "scripts/core/production_canary_state.py",
          }
          denied_prefixes = ("db/", "supabase/", "web/", "scripts/maintenance/")
          denied_exact = {
              ".github/workflows/f9-7-contract.yml",
              "tests/test_fase09_7_release_gates.py",
          }
          raw = subprocess.check_output([
              "git", "diff", "--name-status", "-z", "--find-renames", "--find-copies",
              base, head, "--",
          ])
          fields = raw.split(b"\0")
          index = 0
          changed = []
          failures = []
          while index < len(fields) and fields[index]:
              status = fields[index].decode("ascii")
              index += 1
              old_path = None
              if status.startswith(("R", "C")):
                  old_path = fields[index].decode("utf-8", "surrogateescape")
                  index += 1
              path = fields[index].decode("utf-8", "surrogateescape")
              index += 1
              paths = [path] + ([old_path] if old_path else [])
              changed.append((status, path))
              if any(p and (p.startswith(denied_prefixes) or p in denied_exact) for p in paths):
                  failures.append(f"denied-path:{status}:{path}")
                  continue
              expected = allowed_statuses.get(path)
              if not expected:
                  failures.append(f"unexpected-path:{status}:{path}")
                  continue
              if status not in expected:
                  failures.append(f"status:{status}:{path}")
                  continue
              head_meta = subprocess.check_output(["git", "ls-tree", head, "--", path], text=True).strip()
              if not head_meta:
                  failures.append(f"missing-head:{path}")
                  continue
              head_parts = head_meta.split(None, 3)
              expected_mode = expected_modes[path]
              if head_parts[:2] != [expected_mode, "blob"]:
                  failures.append(f"mode-kind:{path}:{head_parts[:2]}")
                  continue
              base_meta = subprocess.check_output(["git", "ls-tree", base, "--", path], text=True).strip()
              if status == "A" and base_meta:
                  failures.append(f"base-present:{path}")
              if status == "M" and not base_meta:
                  failures.append(f"missing-base:{path}")
          for path in sorted(source_equal_paths):
              source_blob = subprocess.check_output(["git", "cat-file", "blob", f"{source}:{path}"])
              head_blob = subprocess.check_output(["git", "cat-file", "blob", f"{head}:{path}"])
              if source_blob != head_blob:
                  failures.append(f"source-drift:{path}")
          if not changed:
              failures.append("empty-f910-candidate")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print("F9.10 pre-main transition boundary passed")
          PY
      - name: Run F9.10 pre-main controls tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          for path in (
              Path('tests/test_fase09_10_pre_main_controls.py'),
              Path('tests/test_fase10_main_boundary.py'),
              Path('tests/test_fase10_production_canary.py'),
          ):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              assert spec.loader is not None
              spec.loader.exec_module(module)
              for name in sorted(dir(module)):
                  if name.startswith('test_'):
                      getattr(module, name)()
          PY

  f10-main-boundary:
    name: F10 Main Boundary
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate F10 main boundary
        env:
          F10_EVENT_NAME: ${{ github.event_name }}
          F10_REF: ${{ github.ref }}
          F10_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          F10_HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          F10_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          F10_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          F10_REPOSITORY: ${{ github.repository }}
          F10_BASE_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          F10_HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main certificacion
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          EXPECTED = {
              ".context/estado_del_proyecto.md": ("A", "100644"),
              ".context/evidencias_cliente/sprint_1/paquete_hito_001.md": ("M", "100644"),
              ".context/evidencias_cliente/sprint_1/registro_canary_production_f10_8_2026-08-07.md": ("A", "100644"),
              ".context/operaciones/plan_cierre_hito1_ca1_only.md": ("M", "100644"),
              ".github/workflows/f9-7-contract.yml": ("A", "100644"),
              ".github/workflows/production_canary.yml": ("M", "100644"),
              ".github/workflows/security-audit.yml": ("M", "100755"),
              "scripts/core/discovery_institutions.py": ("M", "100644"),
              "scripts/core/master_orchestrator.py": ("M", "100644"),
              "scripts/core/production_canary_manifest.py": ("M", "100644"),
              "scripts/core/production_canary_source_preflight.py": ("A", "100644"),
              "scripts/core/universal_harvester.py": ("M", "100644"),
              "scripts/security/scan_credentials.sh": ("M", "100755"),
              "tests/test_fase10_main_boundary.py": ("M", "100644"),
              "tests/test_fase10_8_db_sync.py": ("A", "100644"),
              "tests/test_fase10_production_canary.py": ("M", "100644"),
              "tests/test_supabase_credentials_contract.py": ("M", "100644"),
          }
          DENIED_PREFIXES = ("db/", "supabase/", "web/", "scripts/maintenance/")
          DENIED_PATHS = {".github/workflows/opencode.yml"}

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def git_text(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def git_bytes(*args):
              return subprocess.check_output(["git", *args])

          event_name = os.environ["F10_EVENT_NAME"]
          base_ref = os.environ["F10_BASE_REF"]
          head_ref = os.environ["F10_HEAD_REF"]
          base = os.environ["F10_BASE_SHA"]
          head = os.environ["F10_HEAD_SHA"]
          repository = os.environ["F10_REPOSITORY"]
          base_repo = os.environ["F10_BASE_REPO"]
          head_repo = os.environ["F10_HEAD_REPO"]

          for name, value in {"F10_BASE_SHA": base, "F10_HEAD_SHA": head}.items():
              if not SHA_RE.fullmatch(value or "") or value == "0" * 40:
                  fail(f"{name} is not a supported commit SHA")
          if base == head:
              fail("F10 main boundary requires distinct base and head")
          if event_name == "pull_request":
              if base_ref != "main" or head_ref != "certificacion":
                  fail("F10 main PR must be certificacion -> main")
              if base_repo != repository or head_repo != repository:
                  fail("F10 main PR must originate from the same repository")
              certificacion_tip = git_text("rev-parse", "refs/remotes/origin/certificacion^{commit}")
              if certificacion_tip != head:
                  fail("F10 main PR must use the protected certificacion tip")
          elif os.environ["F10_REF"] != "refs/heads/main":
              fail("F10 push boundary only supports main")

          if git_text("rev-parse", "HEAD") != head:
              fail("checked out commit does not match F10 head SHA")

          raw = git_bytes("diff", "--name-status", "-z", "--find-renames", "--find-copies", base, head, "--")
          fields = raw.split(b"\0")
          index = 0
          manifest = []
          failures = []
          while index < len(fields) and fields[index]:
              status = fields[index].decode("ascii")
              status_code = status[:1]
              index += 1
              old_path = None
              if status_code in {"R", "C"}:
                  old_path = fields[index].decode("utf-8", "surrogateescape")
                  index += 1
              path = fields[index].decode("utf-8", "surrogateescape")
              index += 1
              for item in [p for p in (old_path, path) if p]:
                  if item in DENIED_PATHS or item.startswith(DENIED_PREFIXES):
                      failures.append(f"denied-path:{status}:{item}")
                  elif item not in EXPECTED:
                      failures.append(f"unexpected-path:{status}:{item}")
              if status_code not in {"A", "M"}:
                  failures.append(f"unsupported-status:{status}:{path}")
                  continue
              if path not in EXPECTED:
                  continue
              expected_status, expected_mode = EXPECTED[path]
              if status_code != expected_status:
                  failures.append(f"status:{status}:{path}")
                  continue
              head_meta = git_text("ls-tree", head, "--", path)
              base_meta = git_text("ls-tree", base, "--", path)
              if not head_meta:
                  failures.append(f"missing-head:{path}")
                  continue
              head_mode, head_kind, head_blob = head_meta.split(None, 3)[:3]
              if head_kind != "blob":
                  failures.append(f"non-blob:{path}")
              if status_code == "A":
                  if base_meta:
                      failures.append(f"base-present:{path}")
                  if head_mode != expected_mode:
                      failures.append(f"added-mode:{path}:{head_mode}")
              else:
                  if not base_meta:
                      failures.append(f"missing-base:{path}")
                  else:
                      base_mode, base_kind = base_meta.split(None, 3)[:2]
                      if base_kind != "blob" or base_mode != head_mode or head_mode != expected_mode:
                          failures.append(f"mode-kind:{path}:{base_mode}->{head_mode}")
              manifest.append((status_code, path, head_mode, head_blob))
          seen_paths = {path for _, path, _, _ in manifest}
          if seen_paths != set(EXPECTED):
              failures.append(f"missing-expected:{sorted(set(EXPECTED) - seen_paths)}")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print(f"F10 main boundary passed: {len(manifest)} exact CA1 objects")
          PY

