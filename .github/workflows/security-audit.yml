name: Security Audit Gate

on:
  pull_request:
    branches: [desarrollo, certificacion, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [desarrollo, certificacion, main]

permissions:
  actions: read
  contents: read
  checks: read
  issues: read
  pull-requests: read

env:
  F1011_TECH_BASE: ad89e8ab9575b37476502d6062e22c044ad6447b

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Scan for hardcoded credentials
        run: |
          set -euo pipefail
          PATTERNS="eyJhbG[A-Za-z0-9_-]{10,}|sb_publishable_[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{10,}|sbp_[A-Za-z0-9_-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghs_[A-Za-z0-9]{20,}|opencode_[A-Za-z0-9_-]{20,}|oc_[A-Za-z0-9_-]{30,}|OPENCODE_API_KEY[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_-]{20,}"
          raw_findings="$(mktemp)"
          find . -type f \
            ! -path './.git/*' \
            ! -path '*/node_modules/*' \
            ! -path '*/.next/*' \
            ! -path '*/out/*' \
            ! -name '*.lock' \
            ! -name '*.png' ! -name '*.jpg' ! -name '*.jpeg' \
            ! -name '*.gif' ! -name '*.ico' ! -name '*.svg' \
            ! -name '*.woff*' ! -name '*.ttf' ! -name '*.eot' \
            ! -name '*.mp4' ! -name '*.mov' ! -name '*.avi' \
            ! -name '*.pdf' ! -name '*.zip' ! -name '*.tar.gz' \
            -exec grep -nE "$PATTERNS" {} + > "$raw_findings" 2>/dev/null || true
          if [ -s "$raw_findings" ]; then
            awk -F: '{ print $1 ":" $2 ": [REDACTED credential-like value]" }' "$raw_findings" | head -50
            exit 1
          fi

  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile Python and validate manifests
        run: |
          set -euo pipefail
          find scripts -name '*.py' -exec python3 -m py_compile {} \;

  manifest-digest:
    name: Manifest Digest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate work package manifests and digests
        run: |
          set -euo pipefail
          python3 scripts/security/validate_work_package.py

  markdown-links:
    name: Markdown Link Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate local Markdown links
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path.cwd()
          failures = []
          pattern = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          for path in sorted((root / ".context").rglob("*.md")):
              text = path.read_text(encoding="utf-8")
              for match in pattern.finditer(text):
                  target = match.group(1).split("#", 1)[0]
                  if not target or "://" in target or target.startswith("mailto:"):
                      continue
                  resolved = (path.parent / target).resolve()
                  try:
                      resolved.relative_to(root.resolve())
                  except ValueError:
                      failures.append(f"{path.relative_to(root)} -> {target} escapes repository")
                      continue
                  if not resolved.exists():
                      failures.append(f"{path.relative_to(root)} -> {target}")
          if failures:
              for failure in failures:
                  print(f"::error::broken-link:{failure}")
              sys.exit(1)
          print("markdown links valid")
          PY

  context-graph:
    name: Context Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate semantic Context Graph
        run: |
          set -euo pipefail
          python3 scripts/security/validate_context_graph.py

  path-boundary:
    name: Canonical Path Boundary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce canonical path boundary
        env:
          PR_BASE_REF_SAFE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF_SAFE: ${{ github.event.pull_request.head.ref }}
          PR_SAME_REPO_SAFE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            base_ref="$PR_BASE_REF_SAFE"
            head_ref="$PR_HEAD_REF_SAFE"
            same_repo="$PR_SAME_REPO_SAFE"
            promotion_pair=false
            if [ "$same_repo" = "true" ]; then
              case "$base_ref:$head_ref" in
                certificacion:promote/gov-hom-007-o2-req1|main:promote/gov-hom-007-o3-req1|certificacion:promote/gov-hom-007-o4-req1|desarrollo:promote/gov-hom-007-o5-req1)
                  promotion_pair=true
                  ;;
              esac
              case "$head_ref" in
                promote/gov-hom-*)
                  if [ "$promotion_pair" != "true" ]; then
                    echo "::error::blocked superseded or unknown promotion branch: $head_ref"
                    # Historical blocked examples kept for regression visibility:
                    # github.event.pull_request.head.ref == 'promote/gov-hom-006-o3-req1'
                    # github.event.pull_request.head.ref == 'promote/gov-hom-006-o5-req1'
                    # promote/gov-hom-006-o2-req1 promote/gov-hom-006-o4-req1
                    exit 1
                  fi
                  ;;
              esac
            fi
            if [ "$promotion_pair" = "true" ]; then
              echo "promotion path boundary handled by Promotion Boundary job"
              exit 0
            fi
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          fi
          python3 scripts/security/validate_work_package.py --changed-from "$base"

  path-boundary-push:
    name: Canonical Path Boundary
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      post_merge_promotion: ${{ steps.boundary.outputs.post_merge_promotion }}
      post_merge_classification: ${{ steps.boundary.outputs.post_merge_classification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce canonical path boundary for push
        id: boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
          echo "post_merge_promotion=false" >> "$GITHUB_OUTPUT"
          set +e
          output="$(POST_MERGE_SKIP_PROTECTED_APPROVAL=1 python3 scripts/security/validate_work_package.py --post-merge-push-event "$GITHUB_EVENT_PATH" 2>&1)"
          status="$?"
          set -e
          printf '%s\n' "$output"
          classification="$(printf '%s\n' "$output" | head -n 1)"
          echo "post_merge_classification=$classification" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ] && [ "$classification" = "VERIFIED_PROMOTION" ]; then
            echo "post_merge_promotion=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 2 ] || [ "$classification" != "NOT_APPLICABLE" ]; then
            exit 1
          fi
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            base="$before"
          else
            git fetch --no-tags --depth=1 origin desarrollo
            base="$(git merge-base HEAD origin/desarrollo)"
          fi
          python3 scripts/security/validate_work_package.py --changed-from "$base"

  post-merge-approval:
    name: Post-Merge Promotion Approval
    runs-on: ubuntu-latest
    needs: [path-boundary-push]
    if: github.event_name == 'push' && needs.path-boundary-push.outputs.post_merge_promotion == 'true'
    environment:
      name: Promotion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Revalidate protected promotion evidence and approval values
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          R3_JIT_APPROVAL_GRANT_ID: ${{ vars.R3_JIT_APPROVAL_GRANT_ID }}
          R3_JIT_APPROVAL_REFERENCE: ${{ secrets.R3_JIT_APPROVAL_REFERENCE }}
          R3_JIT_APPROVAL_EXPIRY: ${{ vars.R3_JIT_APPROVAL_EXPIRY }}
        run: |
          set -euo pipefail
          python3 scripts/security/validate_work_package.py --post-merge-push-event "$GITHUB_EVENT_PATH"

  promotion-boundary:
    name: Promotion Boundary
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.base.ref == 'certificacion' && github.event.pull_request.head.ref == 'promote/gov-hom-007-o2-req1') ||
       (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'promote/gov-hom-007-o3-req1') ||
       (github.event.pull_request.base.ref == 'certificacion' && github.event.pull_request.head.ref == 'promote/gov-hom-007-o4-req1') ||
       (github.event.pull_request.base.ref == 'desarrollo' && github.event.pull_request.head.ref == 'promote/gov-hom-007-o5-req1'))
    environment:
      name: Promotion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate protected promotion attestation
        env:
          R3_JIT_APPROVAL_GRANT_ID: ${{ vars.R3_JIT_APPROVAL_GRANT_ID }}
          R3_JIT_APPROVAL_REFERENCE: ${{ secrets.R3_JIT_APPROVAL_REFERENCE }}
          R3_JIT_APPROVAL_EXPIRY: ${{ vars.R3_JIT_APPROVAL_EXPIRY }}
        run: |
          set -euo pipefail
          python3 scripts/security/validate_work_package.py \
            --promotion-event "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --run-attempt "${GITHUB_RUN_ATTEMPT:-0}"

  governance-preflight:
    name: Governance Preflight
    runs-on: ubuntu-latest
    # Superseded HOM-006 is blocked by Canonical Path Boundary, not reactivated:
    # github.event.pull_request.head.ref == 'promote/gov-hom-006-o5-req1'
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'desarrollo' &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.pull_request.head.ref == 'certificacion' ||
          github.event.pull_request.head.ref == 'promote/gov-hom-007-o5-req1'))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate PR governance attestation and co-change policy
        env:
          BASE_REF: ${{ github.base_ref || github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.head_ref || github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/security/validate_change_governance.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --changed-from "$BASE_SHA"

  governance-tests:
    name: Governance Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run governance tests
        run: |
          set -euo pipefail
          python3 -m pip install 'pytest==8.3.5'
          python3 -m pytest -q tests/test_work_package_manifest.py tests/test_context_graph_semantics.py tests/test_change_governance.py tests/test_release_workflow_matrix.py tests/test_fase10_8_db_sync.py tests/test_fase10_main_boundary.py

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  static-build:
    name: Static Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  postgresql-17:
    name: PostgreSQL 17 DB Change Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run only when db changes exist
        run: |
          set -euo pipefail
          git cat-file -e "$F1011_TECH_BASE^{commit}" || git fetch --no-tags --depth=1 origin "$F1011_TECH_BASE"
          if ! git diff --quiet "$F1011_TECH_BASE" HEAD -- db; then
            echo "db changes detected; H2 PostgreSQL 17 contractual tests must be present before PASS"
            pg_isready -h localhost -p 5432 -U postgres
            test -d tests/sql || { echo "::error::READY_NOT_EXECUTED:tests/sql missing for db changes"; exit 1; }
            find tests/sql -type f -name '*h2*' | grep -q . || { echo "::error::READY_NOT_EXECUTED:H2 SQL tests missing"; exit 1; }
          else
            echo "no db changes; PostgreSQL 17 gate skipped"
          fi

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    needs: [credential-scan, python-check, manifest-digest, markdown-links, context-graph, path-boundary, path-boundary-push, post-merge-approval, promotion-boundary, governance-preflight, governance-tests, lint, typecheck, static-build, postgresql-17]
    if: always()
    steps:
      - name: Aggregate required checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          test '${{ needs.credential-scan.result }}' = 'success'
          test '${{ needs.python-check.result }}' = 'success'
          test '${{ needs.manifest-digest.result }}' = 'success'
          test '${{ needs.markdown-links.result }}' = 'success'
          test '${{ needs.context-graph.result }}' = 'success'
          if [ "$EVENT_NAME" = "push" ]; then
            test '${{ needs.path-boundary.result }}' = 'skipped'
            test '${{ needs.path-boundary-push.result }}' = 'success'
            if [ '${{ needs.path-boundary-push.outputs.post_merge_promotion }}' = 'true' ]; then
              test '${{ needs.post-merge-approval.result }}' = 'success'
            else
              test '${{ needs.post-merge-approval.result }}' = 'skipped'
            fi
          else
            test '${{ needs.path-boundary.result }}' = 'success'
            test '${{ needs.path-boundary-push.result }}' = 'skipped'
            test '${{ needs.post-merge-approval.result }}' = 'skipped'
          fi
          promotion=false
          if [ "$SAME_REPO" = "true" ]; then
            case "$PR_BASE_REF:$PR_HEAD_REF" in
              certificacion:promote/gov-hom-007-o2-req1|main:promote/gov-hom-007-o3-req1|certificacion:promote/gov-hom-007-o4-req1|desarrollo:promote/gov-hom-007-o5-req1)
                promotion=true
                ;;
            esac
          fi
          if [ "$promotion" = "true" ]; then
            test '${{ needs.promotion-boundary.result }}' = 'success'
          else
            test '${{ needs.promotion-boundary.result }}' = 'skipped'
          fi
          case "$EVENT_NAME:$PR_BASE_REF" in
            pull_request:desarrollo)
              if [ "$promotion" = "true" ]; then
                test '${{ needs.governance-preflight.result }}' = 'skipped'
              else
                test '${{ needs.governance-preflight.result }}' = 'success'
              fi
              ;;
            pull_request:certificacion|pull_request:main|push:)
              test '${{ needs.governance-preflight.result }}' = 'skipped'
              ;;
            *)
              echo "::error::unsupported governance event: $EVENT_NAME/$PR_BASE_REF"
              exit 1
              ;;
          esac
          test '${{ needs.governance-tests.result }}' = 'success'
          test '${{ needs.lint.result }}' = 'success'
          test '${{ needs.typecheck.result }}' = 'success'
          test '${{ needs.static-build.result }}' = 'success'
          test '${{ needs.postgresql-17.result }}' = 'success'
