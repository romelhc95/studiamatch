name: Security Audit Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - desarrollo
      - certificacion
      - main
  push:
    branches:
      - desarrollo
      - certificacion
      - main
      - transition/simple-flow-desarrollo

permissions:
  contents: read

env:
  PROTECTED_BASELINE_SHA: 9b486146962bd2a092acfd649fdcf716e922de89

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked tree
        run: sh scripts/security/scan_credentials.sh --tree
      - name: Scan changed diff
        run: |
          set -euo pipefail
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          sh scripts/security/scan_credentials.sh --diff "$base" HEAD

  protected-paths:
    name: Protected Path Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare protected paths to baseline
        run: |
          set -euo pipefail
          git cat-file -e "$PROTECTED_BASELINE_SHA^{commit}"
          changed=$(git diff --name-only "$PROTECTED_BASELINE_SHA" HEAD -- \
            web db supabase scripts/core scripts/shared scripts/maintenance config \
            Dockerfile docker-compose.yml docker-compose.yaml package.json package-lock.json \
            requirements.txt requirements-*.txt web/package.json web/package-lock.json || true)
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed" | sed 's/^/::error::protected path changed: /'
            exit 1
          fi
          echo "protected paths match baseline"

  python-check:
    name: Python Compile And Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python3 -m pip install pytest
      - name: Compile Python scripts
        run: find scripts -name '*.py' -exec python3 -m py_compile {} \;
      - name: Run offline security tests
        run: python3 -m pytest tests/test_supabase_credentials_contract.py tests/test_security_flow.py -q

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  static-build:
    name: Static Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  workflow-lint:
    name: actionlint And shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23'
      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Run actionlint
        run: "$(go env GOPATH)/bin/actionlint" .github/workflows/security-audit.yml .github/workflows/db-sync-to-pro.yml
      - name: Run shellcheck
        run: shellcheck scripts/security/scan_credentials.sh .githooks/pre-commit .githooks/pre-push

  db-gate:
    name: PostgreSQL DB Change Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run only when db changes exist
        run: |
          set -euo pipefail
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$PROTECTED_BASELINE_SHA"
          fi
          if git diff --quiet "$base" HEAD -- db; then
            echo "no db changes; PostgreSQL gate skipped"
            exit 0
          fi
          pg_isready -h localhost -p 5432 -U postgres
          echo "db changes detected; isolated PostgreSQL service is healthy"

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    needs: [credential-scan, protected-paths, python-check, lint, typecheck, static-build, workflow-lint, db-gate]
    if: always()
    steps:
      - name: Aggregate required checks
        run: |
          set -euo pipefail
          test '${{ needs.credential-scan.result }}' = 'success'
          test '${{ needs.protected-paths.result }}' = 'success'
          test '${{ needs.python-check.result }}' = 'success'
          test '${{ needs.lint.result }}' = 'success'
          test '${{ needs.typecheck.result }}' = 'success'
          test '${{ needs.static-build.result }}' = 'success'
          test '${{ needs.workflow-lint.result }}' = 'success'
          test '${{ needs.db-gate.result }}' = 'success'
