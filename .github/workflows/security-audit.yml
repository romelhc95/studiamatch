# StudIAMatch-Docs: .context/componentes/seguridad_tooling.md#registro-de-fuentes-y-gate
name: Security Audit Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - desarrollo
      - certificacion
      - main
  push:
    branches:
      - desarrollo
      - certificacion
      - main
      - transition/simple-flow-desarrollo

permissions:
  contents: read
  actions: read

env:
  # Compare protected paths against the trusted target branch for each event;
  # a fixed historical SHA accumulates already-integrated changes and blocks all PRs.
  # Never fall back to the checked-out commit: manual dispatch has no trusted
  # diff base and the required path/database gates must fail closed.
  PROTECTED_BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR merge_commit_sha can lag a just-updated branch; test the event's exact head.
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan tracked tree
        run: bash scripts/security/scan_credentials.sh --tree
      - name: Scan changed diff
        run: |
          set -euo pipefail
          base="$PROTECTED_BASELINE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git hash-object -t tree -w /dev/null)
          fi
          bash scripts/security/scan_credentials.sh --diff "$base" HEAD

  protected-paths:
    name: Protected Path Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare protected paths to baseline
        run: bash scripts/security/protected_path_scope_guard.sh --compare-candidate
  documentation-integrity:
    name: Documentation Source Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Select candidate-aware documentation manifest
        id: doc-manifest
        env:
          R21_MANIFEST: .context/evidencia/h3req1_public_admin_corrections_2026-10-26/candidate-scope-manifest-2026-10-26.json
          D04_MANIFEST: .context/evidencia/h3req1_d04_candidate_docs_scope_2026-10-25.json
        run: |
          # h3req1-manifest-selector:start
          set -euo pipefail
          node --input-type=module - "$PROTECTED_BASELINE_SHA" "$R21_MANIFEST" "$D04_MANIFEST" <<'NODE'
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import { createHash } from "node:crypto";

          const [baseSha, r21Manifest, d04Manifest] = process.argv.slice(2);
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          const isCandidateManifestPath = (path) => {
            const name = path.split("/").pop().toLowerCase();
            return name.includes("candidate") && (name.includes("scope") || name.includes("manifest"));
          };
          const isCandidateRole = (value) => typeof value?.manifest_role === "string"
            && value.manifest_role.includes("candidate-aware documentation integrity selection");
          const isCandidate = (value) => isCandidateRole(value)
            && Array.isArray(value.scope?.entries)
            && value.package_artifacts && typeof value.package_artifacts === "object"
            && !Array.isArray(value.package_artifacts);
          const promotion = (process.env.GITHUB_BASE_REF === "certificacion"
            && process.env.GITHUB_HEAD_REF === "desarrollo")
            || (process.env.GITHUB_BASE_REF === "main"
              && process.env.GITHUB_HEAD_REF === "certificacion")
            || (process.env.GITHUB_EVENT_NAME === "push"
              && ["refs/heads/certificacion", "refs/heads/main"].includes(process.env.GITHUB_REF));
          const isPrScope = (value) => value?.schemaVersion === 1
            && /^[a-f0-9]{40}$/i.test(value.baseSha ?? "")
            && Array.isArray(value.includedPaths)
            && value.includedPaths.every((path) => typeof path === "string")
            && typeof value.purpose === "string";
          const parse = (text) => { try { return JSON.parse(text); } catch { fail("candidate manifest JSON is invalid"); } };
          const names = (filter) => {
            try {
              return execFileSync("git", ["diff", "--name-only", "--no-renames", filter, "-z", `${baseSha}...HEAD`, "--", ".context/evidencia"], { encoding: "utf8" }).split("\0").filter(Boolean);
            } catch { fail("candidate manifest comparison against the trusted baseline failed"); }
          };

          if (!/^[a-f0-9]{40}$/i.test(baseSha) || /^0{40}$/.test(baseSha)) {
            fail("candidate-aware documentation selection requires a trusted baseline SHA");
          }

          for (const path of names("--diff-filter=D")) {
            if (!path.endsWith(".json")) continue;
            const previous = parse(execFileSync("git", ["show", `${baseSha}:${path}`], { encoding: "utf8" }));
            if (isCandidateRole(previous)) fail("candidate-aware documentation manifest deletion is not allowed");
          }

          const changedCandidates = [];
          for (const path of names("--diff-filter=ACMR")) {
            if (/[\r\n\t]/.test(path)) fail("candidate manifest path contains an unsupported control character");
            if (!path.endsWith(".json")) continue;
            let value;
            try { value = JSON.parse(fs.readFileSync(path, "utf8")); }
            catch {
              if (isCandidateManifestPath(path)) fail("candidate manifest JSON is invalid");
              let previous;
              try { previous = JSON.parse(execFileSync("git", ["show", `${baseSha}:${path}`], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] })); }
              catch { /* Newly added unrelated artifacts may have no baseline JSON. */ }
              if (isCandidateRole(previous)) fail("existing candidate manifest JSON is invalid");
              continue; // Unrelated historical JSON is not a documentation selection.
            }
            if (isCandidateManifestPath(path) || isCandidateRole(value)) {
              if (promotion && !isCandidateRole(value) && isPrScope(value)) continue;
              if (!isCandidate(value)) fail("changed candidate-aware documentation manifest has an invalid structure");
              changedCandidates.push(path);
            }
          }

          if (changedCandidates.length > 1 && !promotion) fail("multiple candidate-aware documentation manifests changed; selection is ambiguous");
          let selected = changedCandidates[0] || [r21Manifest, d04Manifest].find(fs.existsSync);
          if (promotion && selected) {
            // Aggregate every changed package AND every surviving path in the real diff.
            // Never select only the latest package or drop a missing selected input.
            const entries = new Set();
            const packages = [];
            for (const path of changedCandidates.length ? changedCandidates : [selected]) {
              const bytes = fs.readFileSync(path);
              const value = parse(bytes.toString("utf8"));
              for (const entry of value.scope.entries) {
                if (!entry || typeof entry.path !== "string") fail("candidate scope entry is invalid");
                if (entry.status !== "deleted") entries.add(entry.path);
              }
              for (const artifact of Object.values(value.package_artifacts)) {
                if (artifact?.included === true) {
                  if (typeof artifact.path !== "string") fail("candidate artifact path is invalid");
                  entries.add(artifact.path);
                }
              }
              packages.push({ path, sha256: createHash("sha256").update(bytes).digest("hex") });
            }
            const changed = execFileSync("git", ["diff", "--name-only", "--no-renames", "--diff-filter=ACMR", "-z", `${baseSha}...HEAD`], { encoding: "utf8" }).split("\0").filter(Boolean);
            for (const path of changed) entries.add(path);
            for (const path of entries) {
              if (/[\r\n\t]/.test(path) || path.startsWith("/") || path.split("/").includes("..")) fail("promotion scope contains an unsafe path");
              if (!fs.existsSync(path)) fail(`promotion scope input is missing: ${path}`);
            }
            const headSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            // Actions checkout has a .git directory; keep generated scope out of sources.
            selected = ".git/h3req1-promotion-documentation.json";
            const aggregate = { manifest_role: "candidate-aware documentation integrity selection; full promotion union", baseline_sha: baseSha, head_sha: headSha, packages, scope: { entries: [...entries].sort().map((path) => ({ path, status: "included" })) }, package_artifacts: {} };
            fs.writeFileSync(selected, JSON.stringify(aggregate, null, 2) + "\n");
            console.log(`promotion-documentation-scope packages=${packages.length} paths=${entries.size} base=${baseSha} head=${headSha} sha256=${createHash("sha256").update(fs.readFileSync(selected)).digest("hex")}`);
          }
          if (!selected || !isCandidate(parse(fs.readFileSync(selected, "utf8")))) {
            fail("candidate-aware documentation manifest is missing or invalid");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${selected}\n`);
          NODE
          # h3req1-manifest-selector:end
      - name: Check source registry, links and undocumented-source rejection
        env:
          CANDIDATE_MANIFEST: ${{ steps.doc-manifest.outputs.path }}
        run: node scripts/maintenance/h3req1_documentation_integrity.mjs --self-test --candidate-manifest "$CANDIDATE_MANIFEST"

  python-check:
    name: Python Compile And Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python3 -m pip install --require-hashes -r requirements-pipeline.txt
      - name: Compile Python scripts
        run: find scripts -name '*.py' -exec python3 -m py_compile {} \;
      - name: Run offline security tests
        run: |
          set -euo pipefail
          python3 scripts/maintenance/h2_scan_unauthorized_writers.py
          bash tests/test_scan_credentials.sh
          bash tests/test_protected_path_scope_guard.sh
          python3 -m pytest \
            tests/test_supabase_credentials_contract.py \
            tests/test_security_flow.py \
            tests/test_obsidian_context_state.py \
            tests/test_requirement_client_source_validation.py \
            tests/test_editorial_contract.py \
            tests/test_h2_backfill_editorial_state.py \
            tests/test_h2_editorial_migration.py \
            tests/test_h3_public_price_projection_migration.py \
            tests/test_h2_client_evidence_docs.py \
            tests/test_h2_development_legacy_compat.py \
             tests/test_h2_pro_migration_controls.py \
             tests/test_h2_pipeline_contract.py \
             tests/test_h2_writer_scan.py \
             tests/test_h3_invitation_callback_contract.py \
              tests/test_h3_mock_invitation_contract.py \
              tests/test_h3_admin_queue_ux_contract.py \
              tests/test_h3_admin_onboarding_denial_contract.py \
              tests/test_admin_invite_edge_contract.py \
              tests/test_protected_workflow_review.py \
              tests/test_h3req1_c03_docker_daemon_identity_f2d.py \
              tests/test_site_diagnostics_security.py \
              tests/test_taxonomy_roi_audit_privacy.py \
              tests/test_h3req1_local_pipeline_walk.py \
             -q
           python3 -m pytest tests/test_admin_invite_edge_contract.py tests/test_h3_invitation_callback_contract.py tests/test_h3_mock_invitation_contract.py -q

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  static-build:
    name: Static Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node ../tests/h3_duration_parser.test.mjs
      - run: node ../tests/admin_header_responsive.test.mjs
      - run: node ../tests/admin_audit_changes.test.mjs
      - run: node ../tests/admin_queue_request_guard.test.mjs
      - run: node ../tests/h3_admin_bff_mock_uat.mjs
      - run: node ../tests/h3_admin_auth_error_uat.mjs
      - run: node ../tests/h3_send_lead_error_uat.mjs
      - run: node ../tests/h3req1_c03_integrated_runtime.mjs --self-test-proxy-destinations
      - run: node ../tests/h3_admin_invite_edge_uat.mjs
      - run: node ../tests/h3_admin_invite_edge_typecheck.mjs
      - run: node ../tests/h3_admin_quota_uat.mjs
      - run: node ../tests/h3_admin_safe_suspend_uat.mjs
      - run: node ../tests/h3_supabase_sdk_headers_uat.mjs
      # The smoke owns a local fixture and runs the production build itself.
      # Never build against a DNS placeholder before starting that fixture.
      - run: bash ../scripts/security/h2_web_mock_smoke.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - run: npm install --prefix "$RUNNER_TEMP/h3-quota-tools" --no-save miniflare@4.20260730.0 esbuild@0.25.10
      - run: H3_QUOTA_TOOLS="$RUNNER_TEMP/h3-quota-tools" node ../tests/h3_admin_quota_runtime.mjs
      - run: H3_QUOTA_TOOLS="$RUNNER_TEMP/h3-quota-tools" node ../tests/h3_admin_safe_suspend_runtime_uat.mjs

  workflow-lint:
    name: actionlint And shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23'
      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Run actionlint
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint" .github/workflows/security-audit.yml .github/workflows/db-sync-to-pro.yml
      - name: Run shellcheck
        run: shellcheck scripts/security/scan_credentials.sh scripts/security/protected_path_scope_guard.sh tests/test_protected_path_scope_guard.sh scripts/security/h2_web_mock_smoke.sh tests/sql/h3_invitation_reservation_concurrency.sh .githooks/pre-commit .githooks/pre-push

  pwi-worker-contract:
    name: PWI Worker Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: scripts/security/pwi_worker/package-lock.json
      - name: Install PWI Worker test tools
        working-directory: scripts/security/pwi_worker
        run: npm ci --legacy-peer-deps
      - name: Check Worker source syntax
        working-directory: scripts/security/pwi_worker
        run: npm run check
      - name: Run Worker contract tests
        working-directory: scripts/security/pwi_worker
        run: npm test
      - name: Run Worker Durable Object runtime tests
        working-directory: scripts/security/pwi_worker
        run: npm run test:runtime

  db-gate:
    name: PostgreSQL DB Change Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - "127.0.0.1:5432:5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run only when db changes exist
        # Node 22 is needed by the real SDK wire fixture; it does not deploy.
        run: |
          set -euo pipefail
          base="$PROTECTED_BASELINE_SHA"
          if [ -z "$base" ]; then
            echo "::error::database changes require a trusted pull_request or push baseline"
            exit 1
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git hash-object -t tree -w /dev/null)
          fi
          if git diff --quiet "$base" HEAD -- db; then
            echo "no db changes; PostgreSQL gate skipped"
            exit 0
          fi
          pg_isready -h localhost -p 5432 -U postgres
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/sql/h2_pg17_harness.sql
           PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/sql/h2_pro_pg17_harness.sql
            PGPASSWORD=postgres createdb -h localhost -U postgres h3_gate
             PGPASSWORD=postgres psql -h localhost -U postgres -d h3_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_pg17_harness.sql
             PGPASSWORD=postgres createdb -h localhost -U postgres h3_pro_gate
              PGPASSWORD=postgres psql -h localhost -U postgres -d h3_pro_gate -v h3_pro_baseline=1 -v ON_ERROR_STOP=1 -f tests/sql/h3_pg17_harness.sql
              PGPASSWORD=postgres createdb -h localhost -U postgres h3_pro_chain_gate
               PGPASSWORD=postgres psql -h localhost -U postgres -d h3_pro_chain_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_from_h2_pro_pg17_harness.sql
               PGPASSWORD=postgres psql -h localhost -U postgres -d h3_pro_chain_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_admin_quota_harness.sql
               PGPASSWORD=postgres psql -h localhost -U postgres -d h3_pro_chain_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_admin_rpc_signed_gateway_harness.sql
               PGPASSWORD=postgres psql -h localhost -U postgres -d h3_pro_chain_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_safe_suspend_harness.sql
              PGPASSWORD=postgres createdb -h localhost -U postgres h3_future_contract_gate
               PGPASSWORD=postgres psql -h localhost -U postgres -d h3_future_contract_gate -v h3_contracted_baseline=1 -v ON_ERROR_STOP=1 -f tests/sql/h3_from_h2_pro_pg17_harness.sql
               PGPASSWORD=postgres psql -h localhost -U postgres -d h3_future_contract_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_admin_quota_harness.sql
               PGPASSWORD=postgres psql -h localhost -U postgres -d h3_future_contract_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_admin_rpc_signed_gateway_harness.sql
                PGPASSWORD=postgres psql -h localhost -U postgres -d h3_future_contract_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_safe_suspend_harness.sql
                PGPASSWORD=postgres psql -h localhost -U postgres -d h3_pro_chain_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_quota_postgrest_fixture.sql
                # The PostgREST fixture replays the original EXPAND hook; restore the current payload-bound contract before wire assertions.
                PGPASSWORD=postgres psql -h localhost -U postgres -d h3_pro_chain_gate -v ON_ERROR_STOP=1 -f db/migrations/20261004_h3_admin_rpc_signed_gateway_payload_bound_wrapper.sql
                npm ci --prefix web
               npm install --prefix "$RUNNER_TEMP/h3-quota-node" --no-save node@22.22.0
                 postgrest_config="$(mktemp "$RUNNER_TEMP/h3-quota-postgrest.XXXXXX")"
                 printf 'server-host = "127.0.0.1"\n' >"$postgrest_config"
                 chmod 644 "$postgrest_config"
                 trap 'docker stop h3-quota-postgrest-ci >/dev/null 2>&1 || true; rm -f "$postgrest_config"' EXIT
                 docker run -d --name h3-quota-postgrest-ci --network host \
                   --mount "type=bind,source=$postgrest_config,target=/etc/postgrest.conf,readonly" \
                   -e PGRST_DB_URI=postgres://postgres:postgres@127.0.0.1:5432/h3_pro_chain_gate \
                   -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon -e PGRST_SERVER_PORT=3233 \
                   -e PGRST_DB_PRE_REQUEST=public.h3_admin_rpc_signed_gateway_pre_request \
                   -e PGRST_JWT_SECRET=local-only-postgrest-signing-fixture-20261002 \
                  postgrest/postgrest:v13.0.7@sha256:0a46780309a604cdc8b56c776c6e5e15788ce58174d709e40459ab5a2d44d228 /bin/postgrest /etc/postgrest.conf
               ready=false
               for _attempt in $(seq 1 30); do
                 if curl --silent --fail --output /dev/null http://127.0.0.1:3233/; then ready=true; break; fi
                 sleep 1
               done
               [ "$ready" = true ]
                H3_POSTGREST_TEST_URL=http://127.0.0.1:3233 \
                  H3_POSTGREST_TEST_SECRET=local-only-postgrest-signing-fixture-20261002 \
                  H3_POSTGREST_TEST_RPC_SECRET=local-only-pg17-rpc-gateway-fixture-key-32-bytes \
                  "$RUNNER_TEMP/h3-quota-node/node_modules/node/bin/node" tests/h3_admin_quota_postgrest.mjs
               PGPASSWORD=postgres psql -h localhost -U postgres -d h3_pro_chain_gate -v ON_ERROR_STOP=1 -f tests/sql/h3_quota_postgrest_assert.sql
              PGPASSWORD=postgres PGHOST=localhost PGUSER=postgres PGDATABASE=h3_gate bash tests/sql/h3_invitation_reservation_concurrency.sh
           node --check tests/h3_invitation_uat.mjs
           node --check tests/h3_admin_bff_mock_uat.mjs
           node --check tests/h3_admin_auth_error_uat.mjs
            node --check tests/h3_admin_invite_edge_uat.mjs
            node --check tests/h3_supabase_sdk_headers_uat.mjs

  h2-main-production-expand-gate:
    name: H2 Main Production Expand Gate
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify H2 production expand evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          evidence=".context/operaciones/h2_main_production_expand_evidence.json"
          test -f "$evidence"
          python3 - <<'PY'
          import json
          import pathlib
          import re

          evidence = json.loads(pathlib.Path('.context/operaciones/h2_main_production_expand_evidence.json').read_text(encoding='utf-8'))
          required = {
              'schema': 'h2-main-production-expand-evidence-v1',
              'workflow_name': 'DB Sync to Production',
              'branch': 'certificacion',
              'manifest': 'h2-expand-compat',
              'operation': 'apply',
              'verify_result': 'success',
          }
          for key, expected in required.items():
              if evidence.get(key) != expected:
                  raise SystemExit(f'{key} mismatch: {evidence.get(key)!r}')
          if not isinstance(evidence.get('run_id'), int):
              raise SystemExit('run_id must be an integer')
          for key in ('payload_sha', 'candidate_sha'):
              if not re.fullmatch(r'[0-9a-f]{40}', str(evidence.get(key, ''))):
                  raise SystemExit(f'{key} must be a 40-char SHA')
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', str(evidence.get('h2_expected_cohort_digest', ''))):
              raise SystemExit('h2_expected_cohort_digest must be sha256:<64 hex chars>')
          if int(evidence.get('h2_expected_eligible_count', 0)) <= 0:
              raise SystemExit('h2_expected_eligible_count must be positive')
          if evidence.get('h2_advisors_reviewed') is not True:
              raise SystemExit('h2 advisors must be reviewed before main')
          if evidence.get('h2_advisors_result') != 'no_new_high_or_critical_h2_findings':
              raise SystemExit('h2 advisors result is not acceptable')
          if evidence.get('h2_advisors_artifact') is not True:
              raise SystemExit('h2 advisors artifact is required')
          PY
          evidence_candidate="$(python3 -c "import json; print(json.load(open('$evidence'))['candidate_sha'])")"
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head" "main:refs/remotes/origin/main"
          test "$(git rev-parse "refs/remotes/origin/pr-${PR_NUMBER}-head")" = "$PR_HEAD_SHA"
          git cat-file -e "${evidence_candidate}^{commit}"
          git merge-base --is-ancestor "$evidence_candidate" "$PR_HEAD_SHA"
          changed_after_candidate="$(git diff --name-only "$evidence_candidate" "$PR_HEAD_SHA")"
          # H2 evidence remains immutable in content; governance documentation
          # may be promoted after the verified candidate without allowing code,
          # schema, pipeline, or application behavior to change.
          disallowed_after_candidate="$(printf '%s\n' "$changed_after_candidate" | grep -Ev '^(\.context/.*|AGENTS\.md|\.github/workflows/security-audit\.yml|tests/test_(obsidian_context_state|requirement_client_source_validation|security_flow|h2_pro_migration_controls)\.py)$' || true)"
          if [ -n "$disallowed_after_candidate" ]; then
            printf '%s\n' "$disallowed_after_candidate" | sed 's/^/::error::change after verified H2 candidate is not allowed for main gate: /'
            exit 1
          fi
          run_id="$(python3 -c "import json; print(json.load(open('$evidence'))['run_id'])")"
          api="https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}"
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > run.json
          python3 - <<'PY'
          import json
          evidence = json.load(open('.context/operaciones/h2_main_production_expand_evidence.json'))
          run = json.load(open('run.json'))
          if run.get('name') != evidence['workflow_name']:
              raise SystemExit('workflow name mismatch')
          if run.get('head_branch') != evidence['branch']:
              raise SystemExit('workflow branch mismatch')
          if run.get('head_sha') != evidence['candidate_sha']:
              raise SystemExit('workflow candidate SHA mismatch')
          if run.get('conclusion') != 'success':
              raise SystemExit('workflow run was not successful')
          if run.get('event') != 'workflow_dispatch':
              raise SystemExit('workflow run must be workflow_dispatch')
          PY
          jobs_api="https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/jobs"
          artifacts_api="https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/artifacts"
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$jobs_api" > jobs.json
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$artifacts_api" > artifacts.json
          python3 - <<'PY'
          import json
          evidence = json.load(open('.context/operaciones/h2_main_production_expand_evidence.json'))
          jobs = json.load(open('jobs.json')).get('jobs', [])
          artifacts = json.load(open('artifacts.json')).get('artifacts', [])
          required_jobs = {'Apply pending migrations', 'Verify target schema'}
          successful_jobs = {job.get('name') for job in jobs if job.get('conclusion') == 'success'}
          missing_jobs = sorted(required_jobs - successful_jobs)
          if missing_jobs:
              raise SystemExit(f'missing successful DB Sync jobs: {missing_jobs}')
          expected_artifact = f"h2-production-expand-verify-{evidence['candidate_sha']}"
          matching = [artifact for artifact in artifacts if artifact.get('name') == expected_artifact]
          if not matching:
              raise SystemExit(f'missing H2 production expand verify artifact: {expected_artifact}')
          with open('artifact_url.txt', 'w', encoding='utf-8') as handle:
              handle.write(matching[0]['archive_download_url'])
          PY
          artifact_url="$(cat artifact_url.txt)"
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$artifact_url" > artifact.zip
          python3 - <<'PY'
          import json
          import zipfile

          committed = json.load(open('.context/operaciones/h2_main_production_expand_evidence.json'))
          with zipfile.ZipFile('artifact.zip') as archive:
              names = archive.namelist()
              required_names = {
                  'h2-production-expand-verify-evidence.json',
                  'supabase-security-advisors.json',
                  'supabase-performance-advisors.json',
              }
              if set(names) != required_names:
                  raise SystemExit(f'unexpected artifact contents: {names}')
              artifact = json.loads(archive.read('h2-production-expand-verify-evidence.json').decode('utf-8'))
          if artifact != committed:
              raise SystemExit('committed H2 expand evidence differs from DB Sync artifact')
          PY

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    needs: [credential-scan, protected-paths, documentation-integrity, python-check, lint, typecheck, static-build, workflow-lint, pwi-worker-contract, db-gate, h2-main-production-expand-gate]
    if: always()
    steps:
      - name: Aggregate required checks
        run: |
          set -euo pipefail
          test '${{ needs.credential-scan.result }}' = 'success'
          test '${{ needs.protected-paths.result }}' = 'success'
          test '${{ needs.documentation-integrity.result }}' = 'success'
          test '${{ needs.python-check.result }}' = 'success'
          test '${{ needs.lint.result }}' = 'success'
          test '${{ needs.typecheck.result }}' = 'success'
          test '${{ needs.static-build.result }}' = 'success'
          test '${{ needs.workflow-lint.result }}' = 'success'
          test '${{ needs.pwi-worker-contract.result }}' = 'success'
          test '${{ needs.db-gate.result }}' = 'success'
          if [ '${{ github.event_name }}' = 'pull_request' ] && [ '${{ github.event.pull_request.base.ref }}' = 'main' ]; then
            test '${{ needs.h2-main-production-expand-gate.result }}' = 'success'
          else
            test '${{ needs.h2-main-production-expand-gate.result }}' = 'skipped'
          fi
