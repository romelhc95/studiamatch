            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "IPv4 chain check failed during cleanup (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi
          if [ "$ipv6_available" -eq 1 ] && [ -n "$state_dir" ] && [ -f "$state_dir/ipv6-owned" ]; then
            while true; do
              if sudo ip6tables -w 10 -C OUTPUT -j FASE10_EGRESS >/dev/null 2>&1; then
                if ! sudo ip6tables -w 10 -D OUTPUT -j FASE10_EGRESS; then
                  cleanup_failed=1
                  break
                fi
              else
                rc=$?
                if [ "$rc" -eq 1 ]; then
                  break
                fi
                echo "IPv6 jump check failed during cleanup (rc=$rc)"
                cleanup_failed=1
                break
              fi
            done
            if sudo ip6tables -w 10 -nL FASE10_EGRESS >/dev/null 2>&1; then
              if ! sudo ip6tables -w 10 -F FASE10_EGRESS; then
                cleanup_failed=1
              fi
              if ! sudo ip6tables -w 10 -X FASE10_EGRESS; then
                cleanup_failed=1
              fi
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "IPv6 chain check failed during cleanup (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi

          if [ "$ipv4_available" -eq 1 ]; then
            if sudo iptables -w 10 -nL FASE10_EGRESS >/dev/null 2>&1; then
              echo "FASE10_EGRESS chain remains in iptables"
              cleanup_failed=1
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Unable to verify IPv4 chain absence (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi
          if [ "$ipv6_available" -eq 1 ]; then
            if sudo ip6tables -w 10 -nL FASE10_EGRESS >/dev/null 2>&1; then
              echo "FASE10_EGRESS chain remains in ip6tables"
              cleanup_failed=1
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Unable to verify IPv6 chain absence (rc=$rc)"
                cleanup_failed=1
              fi
            fi
          fi
          if [ -n "$state_dir" ] && [ -d "$state_dir" ]; then
            if ! rm -rf -- "$state_dir"; then
              cleanup_failed=1
            fi
          fi
          exit "$cleanup_failed"

  fase09-7-remediation:
    name: F9.7 Remediation Definition PostgreSQL 17 Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 258ef3a98c7c1010efe58522bb1eca892e26390e
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve frozen F9.7 candidate
        run: |
          set -eu
          F97_CANDIDATE_COMMIT="$F97_FROZEN_COMMIT"
          printf '%s' "$F97_CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "$F97_BASELINE_COMMIT^{commit}"
          git cat-file -e "$F97_CANDIDATE_COMMIT^{commit}"
          git merge-base --is-ancestor "$F97_BASELINE_COMMIT" "$F97_CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$F97_CANDIDATE_COMMIT"
          F97_CANDIDATE_TREE="$(git rev-parse "$F97_CANDIDATE_COMMIT^{tree}")"
          test "$F97_CANDIDATE_TREE" = "$F97_FROZEN_TREE"
          git diff --quiet
          git diff --cached --quiet
          {
            echo "F97_CANDIDATE_MODE=commit"
            echo "F97_CANDIDATE_COMMIT=$F97_CANDIDATE_COMMIT"
            echo "F97_CANDIDATE_TREE=$F97_CANDIDATE_TREE"
          } >> "$GITHUB_ENV"
          echo "HISTORICAL_F97_PASS commit=$F97_CANDIDATE_COMMIT tree=$F97_CANDIDATE_TREE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned F9.7 test dependencies
        run: >-
          pip install --require-hashes
          -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Prepare F9.7 local PostgreSQL socket
        run: |
          state_dir=$(mktemp -d "$RUNNER_TEMP/fase097-audit.XXXXXXXX")
          chmod 711 "$state_dir"
          mkdir "$state_dir/postgres-socket"
          chmod 777 "$state_dir/postgres-socket"
          echo "FASE097_AUDIT_STATE=$state_dir" >> "$GITHUB_ENV"
          firewall_state=$(mktemp -d "$RUNNER_TEMP/fase097-audit-firewall.XXXXXXXX")
          chmod 700 "$firewall_state"
          echo "FASE097_AUDIT_FIREWALL_STATE=$firewall_state" >> "$GITHUB_ENV"
      - name: Start networkless F9.7 PostgreSQL 17
        run: |
          docker run --detach --name studiamatch-f97-audit-postgres \
            --network none \
            --security-opt no-new-privileges:true \
            --volume "$FASE097_AUDIT_STATE/postgres-socket:/var/run/postgresql" \
            --env POSTGRES_DB=studiamatch_f97 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' \
            studiamatch-f97-audit-postgres)" = "none"
          for _ in $(seq 1 30); do
            pg_isready --host "$FASE097_AUDIT_STATE/postgres-socket" \
              --username postgres --dbname studiamatch_f97 && exit 0
            sleep 1
          done
          exit 1
      - name: Block external egress for F9.7
        run: |
          .github/scripts/fase09_7_firewall_guard.sh setup FASE097_AUDIT_EGRESS "$FASE097_AUDIT_FIREWALL_STATE"
      - name: Validate F9.7 local-only remediation contracts
        run: |
          workspace_ancestor="$(dirname "$GITHUB_WORKSPACE")"
          while [ "$workspace_ancestor" != "/" ]; do
            sudo chmod o+x "$workspace_ancestor"
            workspace_ancestor="$(dirname "$workspace_ancestor")"
          done
          sudo chmod -R go+rX,go-w "$GITHUB_WORKSPACE"
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            F97_BASELINE_COMMIT="$F97_BASELINE_COMMIT" \
            F97_CANDIDATE_MODE="$F97_CANDIDATE_MODE" \
            F97_CANDIDATE_COMMIT="$F97_CANDIDATE_COMMIT" \
            F97_CANDIDATE_TREE="$F97_CANDIDATE_TREE" \
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider \
              tests/test_fase09_7_backend_identity.py \
              tests/test_fase09_7_acl_source_attestation.py \
              tests/test_fase09_7_gate_b_readonly.py \
              tests/test_fase09_7_remediation_definition.py \
              tests/test_fase09_7_schema_rls.py \
              tests/test_fase09_7_leads_email_security_hold.py \
              tests/test_fase09_7_pipeline_no_regression.py \
              tests/test_fase09_7_release_gates.py \
              tests/test_supabase_credentials_contract.py
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            PYTHONDONTWRITEBYTECODE=1 \
            TEST_DATABASE_URL="postgresql://postgres:postgres@/studiamatch_f97?host=$FASE097_AUDIT_STATE/postgres-socket" \
            python3 -m pytest -q -p no:cacheprovider \
              tests/test_fase09_7_acl_source_attestation.py
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            TEST_DATABASE_URL="postgresql://postgres:postgres@/studiamatch_f97?host=$FASE097_AUDIT_STATE/postgres-socket" \
            bash tests/sql/run_fase09_7_postgres.sh
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i HOME=/tmp CI=true PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            TEST_DATABASE_URL="postgresql://postgres:postgres@/studiamatch_f97?host=$FASE097_AUDIT_STATE/postgres-socket" \
            bash tests/sql/run_fase09_7_leads_email_security_hold_postgres.sh
      - name: Restore runner and remove F9.7 database
        if: always()
        run: |
          cleanup_status=0
          firewall_state="${FASE097_AUDIT_FIREWALL_STATE:-}"
          if [ -n "$firewall_state" ]; then
            if [ -d "$firewall_state" ]; then
              .github/scripts/fase09_7_firewall_guard.sh cleanup FASE097_AUDIT_EGRESS "$firewall_state" || cleanup_status=$?
              if [ "$cleanup_status" -eq 0 ]; then
                rm -rf -- "$firewall_state" || cleanup_status=1
              fi
            else
              echo "F9.7 audit firewall state directory is missing"
              cleanup_status=1
            fi
          fi
          if docker inspect studiamatch-f97-audit-postgres >/dev/null 2>&1; then
            docker rm --force studiamatch-f97-audit-postgres || cleanup_status=1
          fi
          audit_state="${FASE097_AUDIT_STATE:-}"
          if [ -n "$audit_state" ]; then
            if [ -d "$audit_state" ]; then
              sudo rm -rf -- "$audit_state" || cleanup_status=1
            else
              echo "F9.7 audit state directory is missing"
              cleanup_status=1
            fi
          fi
          exit "$cleanup_status"

  fase09-8-ca1:
    name: F9.8 CA1 Pipeline Candidate Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned F9.8 test dependencies
        run: >-
          pip install --require-hashes
          -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Validate CA1-only workflow gates
        run: |
          set -euo pipefail
          grep -q "AUTOMATION_ENABLED" .github/workflows/fg1_inventory.yml
          grep -q "AUTOMATION_ENABLED" .github/workflows/production_pipeline.yml
          grep -q "AUTOMATION_ENABLED" .github/workflows/fg3_integrity.yml
          grep -q "github.ref_name == 'main' && vars.AUTOMATION_ENABLED == 'true'" .github/workflows/fg1_inventory.yml
          grep -q "github.ref_name == 'main' && vars.AUTOMATION_ENABLED == 'true'" .github/workflows/production_pipeline.yml
          grep -q "github.ref_name == 'main' && vars.AUTOMATION_ENABLED == 'true'" .github/workflows/fg3_integrity.yml
          grep -q "group: studiamatch-fg2" .github/workflows/fg3_integrity.yml
          grep -q "Production-Scheduled-FG1" .github/workflows/fg1_inventory.yml
          grep -q "Production-Scheduled-FG2" .github/workflows/production_pipeline.yml
          grep -q "Production-Scheduled-FG3" .github/workflows/fg3_integrity.yml
          if grep -q "scripts/maintenance/" .github/workflows/production_pipeline.yml; then exit 1; fi
          if grep -q "requirements-db-migrate.txt" .github/workflows/production_pipeline.yml; then exit 1; fi
          if grep -q "pages/projects" .github/workflows/production_pipeline.yml; then exit 1; fi
      - name: Validate CA1-only code gates
        run: |
          set -euo pipefail
          grep -q "config/institution_sources.json is required" scripts/core/discovery_institutions.py
          if grep -q "LEGACY_SOURCES" scripts/core/discovery_institutions.py; then exit 1; fi
          if grep -q "status.*pending.*discovered" scripts/core/universal_harvester.py; then exit 1; fi
          grep -q "is_safe_public_url" scripts/core/integrity_ping.py
          grep -q "parsed.scheme != 'https'" scripts/core/integrity_ping.py
          grep -q "request_pinned_public_url" scripts/core/integrity_ping.py
          grep -q "FixedIPHTTPSConnection" scripts/core/integrity_ping.py
          grep -q "patch_course_exact_one" scripts/core/integrity_ping.py
          grep -q "get_pending_enriched(limit=None)" scripts/core/sync_vector_worker.py
          grep -q "failed or partial" scripts/core/integrity_ping.py
          grep -q "failed or partial" scripts/core/sync_vector_worker.py
      - name: Run focused F9.8 CA1 tests
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_fase09_8_ca1_candidate.py tests/test_fase09_8_runtime_security.py

  fase09-9-ca1-reactivation:
    name: F9.9 CA1 Reactivation Functional Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Resolve target-aware F9.9 candidate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            F99_BASE_COMMIT="${{ github.event.pull_request.base.sha }}"
            F99_CANDIDATE_COMMIT="${{ github.event.pull_request.head.sha }}"
          else
            case "${{ github.ref }}" in
              refs/heads/desarrollo|refs/heads/certificacion|refs/heads/main) ;;
              *) echo "F9.9 only supports permanent branch pushes" >&2; exit 1 ;;
            esac
            F99_BASE_COMMIT="${{ github.event.before }}"
            F99_CANDIDATE_COMMIT="${{ github.sha }}"
          fi
          printf '%s' "$F99_BASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$F99_CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test "$F99_BASE_COMMIT" != "0000000000000000000000000000000000000000"
          git cat-file -e "$F99_BASE_COMMIT^{commit}"
          git cat-file -e "$F99_CANDIDATE_COMMIT^{commit}"
          git merge-base --is-ancestor "$F99_BASE_COMMIT" "$F99_CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$F99_CANDIDATE_COMMIT"
          F99_CANDIDATE_TREE="$(git rev-parse "$F99_CANDIDATE_COMMIT^{tree}")"
          if git cat-file -e "$F99_BASE_COMMIT:tests/e2e/ca1/ca1_functional_gate.py" 2>/dev/null; then
            F99_BASE_HAS_HARNESS=true
            F99_HARNESS_COMMIT="$F99_BASE_COMMIT"
          else
            F99_BASE_HAS_HARNESS=false
            F99_HARNESS_COMMIT="$F99_CANDIDATE_COMMIT"
          fi
          export F99_BASE_COMMIT F99_CANDIDATE_COMMIT
          python3 - <<'PY' > /tmp/f99-classification.env
          import os
          import subprocess

          base = subprocess.check_output(['git', 'rev-parse', os.environ['F99_BASE_COMMIT']], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', os.environ['F99_CANDIDATE_COMMIT']], text=True).strip()
          runtime_paths = {
              '.github/workflows/fg1_inventory.yml',
              '.github/workflows/fg3_integrity.yml',
              '.github/workflows/production_pipeline.yml',
              'scripts/core/cleansing_worker.py',
              'scripts/core/discovery_institutions.py',
              'scripts/core/integrity_ping.py',
              'scripts/core/sync_vector_worker.py',
              'scripts/core/universal_harvester.py',
              'scripts/shared/db_client.py',
          }
          harness_paths = {'tests/test_fase09_9_ca1_reactivation.py'}
          rows = subprocess.check_output(['git', 'diff', '--name-status', base, head], text=True).splitlines()
          runtime_changed = False
          harness_changed = False
          denied_changed = False
          for row in rows:
              parts = row.split('\t')
              status = parts[0]
              paths = parts[1:]
              if any(path in runtime_paths for path in paths):
                  runtime_changed = True
              if any(path.startswith('tests/e2e/ca1/') or path in harness_paths for path in paths):
                  harness_changed = True
              if any(path.startswith(('db/', 'supabase/', 'web/', 'scripts/maintenance/')) for path in paths):
                  denied_changed = True
              if status.startswith(('R', 'C')) and any(path in runtime_paths for path in paths):
                  raise SystemExit('CA1 runtime rename/copy is forbidden')
          if runtime_changed and denied_changed:
              raise SystemExit('CA1 runtime candidate also touches denied paths')
          print(f'F99_RUNTIME_CHANGED={str(runtime_changed).lower()}')
          print(f'F99_HARNESS_CHANGED={str(harness_changed).lower()}')
          PY
          cat /tmp/f99-classification.env >> "$GITHUB_ENV"
          . /tmp/f99-classification.env
          if [ "$F99_RUNTIME_CHANGED" = "true" ] && [ "$F99_BASE_HAS_HARNESS" != "true" ]; then
            echo "base lacks trusted harness for runtime validation" >&2
            exit 1
          fi
          if [ "$F99_RUNTIME_CHANGED" = "true" ] && [ "$F99_HARNESS_CHANGED" = "true" ] && [ "$F99_BASE_HAS_HARNESS" = "true" ]; then
            echo "Runtime and harness changed together after bootstrap" >&2
            exit 1
          fi
          if [ "$F99_RUNTIME_CHANGED" = "true" ]; then
            F99_EXPECTED_DECISION="GO_TO_PREPARE_CERTIFICATION_PR"
          else
            F99_EXPECTED_DECISION="NO_GO_KNOWN_T_H1_CA1_002B"
          fi
          {
            echo "F99_BASE_COMMIT=$F99_BASE_COMMIT"
            echo "F99_CANDIDATE_COMMIT=$F99_CANDIDATE_COMMIT"
            echo "F99_CANDIDATE_TREE=$F99_CANDIDATE_TREE"
            echo "F99_BASE_HAS_HARNESS=$F99_BASE_HAS_HARNESS"
            echo "F99_HARNESS_COMMIT=$F99_HARNESS_COMMIT"
            echo "F99_EXPECTED_DECISION=$F99_EXPECTED_DECISION"
          } >> "$GITHUB_ENV"
      - name: Install pinned F9.9 test dependencies
        run: >-
          pip install --require-hashes
          -r requirements-test.txt
      - name: Run F9.9 harness contract tests
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_fase09_9_ca1_reactivation.py
      - name: Build CA1 E2E runner image
        run: |
          set -euo pipefail
          docker build --pull -t studiamatch-ca1-e2e-runner -f - . <<'DOCKERFILE'
          FROM python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93
          WORKDIR /deps
          COPY requirements-pipeline.txt requirements-test.txt ./
          RUN python -m pip install --no-cache-dir --require-hashes -r requirements-pipeline.txt -r requirements-test.txt
          DOCKERFILE
      - name: Run hermetic F9.9 CA1 E2E
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/f99-ca1-runtime"
          harness_dir="$RUNNER_TEMP/f99-ca1-harness"
          evidence_dir="$RUNNER_TEMP/f99-ca1-evidence"
          network="f99-ca1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$runtime_dir" "$harness_dir" "$evidence_dir"
          mkdir -p "$runtime_dir" "$harness_dir" "$evidence_dir"
          echo "F99_EVIDENCE_SAFE=false" >> "$GITHUB_ENV"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar "$F99_CANDIDATE_COMMIT" | tar -xf - -C "$runtime_dir"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar "$F99_HARNESS_COMMIT" -- tests/e2e/ca1 tests/test_fase09_9_ca1_reactivation.py | tar -xf - -C "$harness_dir"
          runtime_manifest_json="$(python3 - <<'PY'
          import json
          import subprocess

          import os

          commit = os.environ['F99_CANDIDATE_COMMIT']
          paths = [
              '.github/workflows/fg1_inventory.yml',
              '.github/workflows/fg3_integrity.yml',
              '.github/workflows/production_pipeline.yml',
              'scripts/core/cleansing_worker.py',
              'scripts/core/discovery_institutions.py',
              'scripts/core/integrity_ping.py',
              'scripts/core/sync_vector_worker.py',
              'scripts/core/universal_harvester.py',
              'scripts/shared/db_client.py',
          ]
          rows = []
          for path in paths:
              raw = subprocess.check_output(['git', 'ls-tree', commit, '--', path], text=True).strip()
              meta, actual_path = raw.split('\t', 1)
              mode, kind, blob = meta.split(' ')
              if kind != 'blob' or actual_path != path:
                  raise SystemExit(f'invalid runtime manifest entry for {path}')
              rows.append({'path': path, 'mode': mode, 'blob': blob})
          print(json.dumps(rows, separators=(',', ':')))
          PY
          )"
          harness_manifest_json="$(python3 - <<'PY'
          import hashlib
          import json
          import subprocess

          import os

          commit = os.environ['F99_HARNESS_COMMIT']
          manifest = json.loads(subprocess.check_output(['git', 'show', f'{commit}:tests/e2e/ca1/harness_manifest_paths.json'], text=True))
          rows = []
          for path in manifest['paths']:
              raw = subprocess.check_output(['git', 'ls-tree', commit, '--', path], text=True).strip()
              meta, actual_path = raw.split('\t', 1)
              mode, kind, blob = meta.split(' ')
              content = subprocess.check_output(['git', 'show', f'{commit}:{path}'])
              rows.append({'path': actual_path, 'mode': mode, 'blob': blob, 'sha256': hashlib.sha256(content).hexdigest()})
          print(json.dumps({'schema': manifest['schema'], 'source_commit': commit, 'paths': rows}, separators=(',', ':')))
          PY
          )"
          docker network create --internal "$network"
          cleanup() {
            docker rm -f f99-ca1-e2e-runner >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          set +e
          docker run --name f99-ca1-e2e-runner --network "$network" \
            --volume "$runtime_dir:/app" \
            --volume "$harness_dir:/harness" \
            --volume "$evidence_dir:/evidence" \
            --env CA1_RUN_ID="f99-ca1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --env CA1_EVIDENCE_DIR=/evidence \
            --env CA1_APP_DIR=/app \
            --env CA1_ENV_EXAMPLE_VERSIONED=synthetic_versioned \
            --env CA1_ENV_EXAMPLE_SCAN_PASS=synthetic_scan_pass \
            --env CA1_TLS_VERIFIED=synthetic_tls_verified \
            studiamatch-ca1-e2e-runner \
            python3 /harness/tests/e2e/ca1/ca1_functional_gate.py \
              --candidate-commit "$F99_CANDIDATE_COMMIT" \
              --candidate-tree "$F99_CANDIDATE_TREE" \
              --runtime-commit "$F99_CANDIDATE_COMMIT" \
              --runtime-tree "$F99_CANDIDATE_TREE" \
              --runtime-manifest-json "$runtime_manifest_json" \
              --harness-manifest-json "$harness_manifest_json" \
              --expected-decision "$F99_EXPECTED_DECISION" \
              --evidence-dir /evidence
          e2e_exit=$?
          set -e
          cleanup
          cleanup
          missing_artifacts=false
          for name in summary.json junit.xml redacted-logs.json; do
            if [ ! -s "$evidence_dir/$name" ]; then
              missing_artifacts=true
            fi
          done
          set +e
          git grep -a -q -E "$F97_CREDENTIAL_PATTERN" "$F99_CANDIDATE_TREE" -- .
          candidate_secret_rc=$?
          set -e
          if [ "$candidate_secret_rc" -eq 0 ]; then
            echo "::error::Credential detected in candidate tree while processing F9.9 artifacts"
            rm -rf -- "$evidence_dir"
            exit 1
          fi
          if [ "$candidate_secret_rc" -ne 1 ]; then
            echo "::error::F9.9 candidate credential scan failed"
            rm -rf -- "$evidence_dir"
            exit 1
          fi
          if [ "$missing_artifacts" = "true" ]; then
            echo "::error::F9.9 evidence artifacts missing"
            rm -rf -- "$evidence_dir"
            exit 1
          fi
          set +e
          grep -R -E -q "$F97_CREDENTIAL_PATTERN" "$evidence_dir"
          evidence_secret_rc=$?
          set -e
          if [ "$evidence_secret_rc" -eq 0 ]; then
            echo "::error::Credential detected in F9.9 evidence artifacts"
            rm -rf -- "$evidence_dir"
            exit 1
          fi
          if [ "$evidence_secret_rc" -ne 1 ]; then
            echo "::error::F9.9 evidence credential scan failed"
            rm -rf -- "$evidence_dir"
            exit 1
          fi
          echo "F99_EVIDENCE_SAFE=true" >> "$GITHUB_ENV"
          exit "$e2e_exit"
      - name: Upload F9.9 CA1 evidence
        if: always() && env.F99_EVIDENCE_SAFE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f99-ca1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f99-ca1-evidence
          if-no-files-found: error
          retention-days: 14

  security-audit:
    name: security-audit
    if: always()
    needs: [credential-scan, release-gates, lint, typecheck, frontend-build, python-check, context-graph, fase06-db-as-code, fase07-g1b, fase08-hito1, fase09-pre-free, fase09-free-preflight-contract, fase09-5-rls, fase09-7-remediation, fase09-8-ca1, fase09-9-ca1-reactivation, fase10-promotion-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          CS: ${{ needs.credential-scan.result }}
          RG: ${{ needs.release-gates.result }}
          LINT: ${{ needs.lint.result }}
          TC: ${{ needs.typecheck.result }}
          BUILD: ${{ needs.frontend-build.result }}
          PC: ${{ needs.python-check.result }}
          CG: ${{ needs.context-graph.result }}
          F6: ${{ needs.fase06-db-as-code.result }}
          F7: ${{ needs.fase07-g1b.result }}
          F8: ${{ needs.fase08-hito1.result }}
          F9: ${{ needs.fase09-pre-free.result }}
          F93: ${{ needs.fase09-free-preflight-contract.result }}
          F95: ${{ needs.fase09-5-rls.result }}
          F97: ${{ needs.fase09-7-remediation.result }}
          F98: ${{ needs.fase09-8-ca1.result }}
          F99: ${{ needs.fase09-9-ca1-reactivation.result }}
          F10: ${{ needs.fase10-promotion-contract.result }}
        run: |
          exec >> "$GITHUB_STEP_SUMMARY"
          echo "### Security Audit Results"
          echo ""
          echo "| Check | Status |"
          echo "|---|---|"
          # Credential scan and Python check are HARD requirements
          if [ "$CS" != "success" ]; then
            echo "❌ **credential-scan**: $CS (BLOCKING)"
            exit 1
          fi
          echo "✅ **credential-scan**: passed"
          if [ "$RG" != "success" ]; then
            echo "❌ **release-gates**: $RG (BLOCKING)"
            exit 1
          fi
          echo "✅ **release-gates**: passed"
          if [ "$PC" != "success" ]; then
            echo "❌ **python-check**: $PC (BLOCKING)"
            exit 1
          fi
          echo "✅ **python-check**: passed"
          if [ "$CG" != "success" ]; then
            echo "❌ **context-graph**: $CG (BLOCKING)"
            exit 1
          fi
          echo "✅ **context-graph**: passed"
          if [ "$F6" != "success" ]; then
            echo "❌ **fase06-db-as-code**: $F6 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase06-db-as-code**: passed"
          if [ "$F7" != "success" ]; then
            echo "❌ **fase07-g1b**: $F7 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase07-g1b**: passed"
          if [ "$F8" != "success" ]; then
            echo "❌ **fase08-hito1**: $F8 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase08-hito1**: passed"
          if [ "$F9" != "success" ]; then
            echo "❌ **fase09-pre-free**: $F9 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase09-pre-free**: passed"
          if [ "$F93" != "success" ]; then
            echo "❌ **fase09-free-preflight-contract**: $F93 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase09-free-preflight-contract**: passed"
          if [ "$F95" != "success" ]; then
            echo "❌ **fase09-5-rls**: $F95 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase09-5-rls**: passed"
          if [ "$F97" != "success" ]; then
            echo "❌ **fase09-7-remediation**: $F97 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase09-7-remediation**: passed"
          if [ "$F98" != "success" ]; then
            echo "❌ **fase09-8-ca1**: $F98 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase09-8-ca1**: passed"
          if [ "$F99" != "success" ]; then
            echo "❌ **fase09-9-ca1-reactivation**: $F99 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase09-9-ca1-reactivation**: passed"
          if [ "$F10" != "success" ]; then
            echo "❌ **fase10-promotion-contract**: $F10 (BLOCKING)"
            exit 1
          fi
          echo "✅ **fase10-promotion-contract**: passed"
          if [ "$LINT" != "success" ]; then
            echo "❌ **lint**: $LINT (BLOCKING)"
            exit 1
          fi
          echo "✅ **lint**: passed"
          if [ "$TC" != "success" ]; then
            echo "❌ **typecheck**: $TC (BLOCKING)"
            exit 1
          fi
          echo "✅ **typecheck**: passed"
          if [ "$BUILD" != "success" ]; then
            echo "❌ **frontend-build**: $BUILD (BLOCKING)"
            exit 1
          fi
          echo "✅ **frontend-build**: passed"
          echo ""
          echo "✅ **Security audit PASSED** — all F6/F7/F8/F9/F9.3/F9.5/F9.7/F9.8/F9.9/F10, credential, Python, Context Graph and frontend gates are green."
