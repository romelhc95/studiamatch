name: Security Audit Gate

on:
  pull_request:
    branches: [desarrollo, certificacion, main]
  push:
    branches: [desarrollo, certificacion, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

permissions:
  contents: read

jobs:
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan for hardcoded credentials
        run: |
          FOUND=0
          PATTERNS="eyJhbG[A-Za-z0-9_-]{10,}|sb_secret_[A-Za-z0-9_-]{10,}|sbp_[A-Za-z0-9_-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghs_[A-Za-z0-9]{20,}|opencode_[A-Za-z0-9_-]{20,}|oc_[A-Za-z0-9_-]{30,}|OPENCODE_API_KEY[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_-]{20,}"
          if ! find . -type f \
            ! -path './.git/*' \
            ! -path '*/node_modules/*' \
            ! -path '*/.next/*' \
            ! -path '*/out/*' \
            ! -name '*.png' ! -name '*.jpg' ! -name '*.jpeg' \
            ! -name '*.gif' ! -name '*.ico' \
            ! -name '*.woff*' ! -name '*.ttf' ! -name '*.eot' \
            ! -name '*.mp4' ! -name '*.mov' ! -name '*.avi' \
            ! -name '*.pdf' ! -name '*.zip' ! -name '*.tar.gz' \
            -print0 > credential_files.list; then
            echo "Credential scan failed while enumerating files"
            exit 1
          fi
          while IFS= read -r -d '' file; do
            if grep -IqE "$PATTERNS" "$file"; then
              printf '%s\0' "$file" >> credential_findings.list
            else
              status=$?
              if [ "$status" -gt 1 ]; then
                echo "::error file=${file#./}::Credential scan failed while reading file"
                exit 1
              fi
            fi
          done < credential_files.list
          if [ -s credential_findings.list ]; then
            echo "❌ CREDENTIAL SCAN FAILED: Hardcoded credentials detected!"
            while IFS= read -r -d '' file; do
              echo "::error file=${file#./}::Potential hardcoded credential detected (content redacted)"
            done < credential_findings.list
            exit 1
          fi
          echo "✅ Credential scan passed"

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend Static Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
        run: npm run build

  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check all core scripts compile
        run: |
          echo "Checking scripts/core/*.py..."
          find scripts/core -name '*.py' -exec python3 -m py_compile {} \;
          echo "Checking scripts/maintenance/*.py..."
          find scripts/maintenance -name '*.py' -exec python3 -m py_compile {} \;
          echo "Checking scripts/shared/*.py..."
          find scripts/shared -name '*.py' -exec python3 -m py_compile {} \;
          echo "✅ All Python scripts compile successfully"

  context-graph:
    name: Context Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate canonical context graph
        run: python3 scripts/maintenance/validate_context_graph.py

  fase06-db-as-code:
    name: FASE-06 DB-as-Code Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Validate FASE-06 package and credential contracts
        run: python3 -m pytest -q tests/test_fase06_db_as_code.py tests/test_supabase_credentials_contract.py

  fase07-g1b:
    name: FASE-07 G1b Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt -r requirements-test.txt
      - name: Validate FASE-07 G1b contract
        run: python3 -m pytest -q tests/test_fase07_g1b.py

  security-audit:
    name: security-audit
    if: always()
    needs: [credential-scan, lint, typecheck, frontend-build, python-check, context-graph, fase06-db-as-code, fase07-g1b]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          CS: ${{ needs.credential-scan.result }}
          LINT: ${{ needs.lint.result }}
          TC: ${{ needs.typecheck.result }}
          BUILD: ${{ needs.frontend-build.result }}
          PC: ${{ needs.python-check.result }}
          CG: ${{ needs.context-graph.result }}
          F6: ${{ needs.fase06-db-as-code.result }}
          F7: ${{ needs.fase07-g1b.result }}
        run: |
          echo "### Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          # Credential scan and Python check are HARD requirements
          if [ "$CS" != "success" ]; then
            echo "❌ **credential-scan**: $CS (BLOCKING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ **credential-scan**: passed" >> $GITHUB_STEP_SUMMARY
          if [ "$PC" != "success" ]; then
            echo "❌ **python-check**: $PC (BLOCKING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ **python-check**: passed" >> $GITHUB_STEP_SUMMARY
          if [ "$CG" != "success" ]; then
            echo "❌ **context-graph**: $CG (BLOCKING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ **context-graph**: passed" >> $GITHUB_STEP_SUMMARY
          if [ "$F6" != "success" ]; then
            echo "❌ **fase06-db-as-code**: $F6 (BLOCKING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ **fase06-db-as-code**: passed" >> $GITHUB_STEP_SUMMARY
          if [ "$F7" != "success" ]; then
            echo "❌ **fase07-g1b**: $F7 (BLOCKING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ **fase07-g1b**: passed" >> $GITHUB_STEP_SUMMARY
          if [ "$LINT" != "success" ]; then
            echo "❌ **lint**: $LINT (BLOCKING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ **lint**: passed" >> $GITHUB_STEP_SUMMARY
          if [ "$TC" != "success" ]; then
            echo "❌ **typecheck**: $TC (BLOCKING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ **typecheck**: passed" >> $GITHUB_STEP_SUMMARY
          if [ "$BUILD" != "success" ]; then
            echo "❌ **frontend-build**: $BUILD (BLOCKING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ **frontend-build**: passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Security audit PASSED** — all F6/F7, credential, Python, Context Graph and frontend gates are green." >> $GITHUB_STEP_SUMMARY
