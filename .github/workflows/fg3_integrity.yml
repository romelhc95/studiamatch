name: FG3 - Daily Integrity Management

on:
  schedule:
    - cron: '0 11 * * *' # Runs after the FG2 production window
  workflow_dispatch:      # Manual

concurrency:
  group: studiamatch-fg2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integrity:
    name: "3. Daily Integrity Ping"
    if: contains(fromJSON('["refs/heads/main","refs/heads/certificacion","refs/heads/desarrollo"]'), github.ref) && (github.event_name != 'schedule' || (github.ref_name == 'main' && vars.AUTOMATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: ${{ (github.event_name == 'schedule' && github.ref_name == 'main' && 'Production-Scheduled-FG3') || (github.ref_name == 'main' && 'Production') || (github.ref_name == 'certificacion' && 'Certification') || 'Development' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install --require-hashes -r requirements-fg3.txt
      - name: Run Integrity Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        working-directory: scripts/core
        run: python integrity_ping.py
