name: Pause Production Writers

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Canonical release manifest path'
        required: true
        type: string
      manifest_sha256:
        description: 'Exact SHA-256 of the release manifest'
        required: true
        type: string
      candidate_commit_sha:
        description: 'Certified candidate commit SHA'
        required: true
        type: string
      confirmation:
        description: 'Type PAUSE_PRODUCTION_WRITERS'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: studiamatch-production-writers
  cancel-in-progress: false

jobs:
  pause:
    if: github.ref_name == 'certificacion'
    runs-on: ubuntu-latest
    environment:
      name: Certification
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate state and absence of active writers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$INPUT_MANIFEST_PATH" =~ ^\.context/evidencias/releases/[a-z0-9._-]+/release-manifest\.json$ ]]
          [[ "$INPUT_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$INPUT_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$INPUT_CONFIRMATION" = "PAUSE_PRODUCTION_WRITERS"
          python -m pip install jsonschema==4.23.0 requests
          python scripts/maintenance/release_gate.py \
            "$INPUT_MANIFEST_PATH" \
            --stage certification \
            --verify-github-provenance \
            --expected-manifest-sha256 "$INPUT_MANIFEST_SHA"
          for workflow in db-sync-to-pro.yml production_pipeline.yml fg1_inventory.yml fg3_integrity.yml; do
            for status in in_progress queued waiting; do
              active=$(gh run list --workflow "$workflow" --status "$status" --json databaseId --jq 'length')
              test "$active" -eq 0
            done
          done
          gh variable set PRODUCTION_WRITERS_PAUSED --env Certification --body true
      - name: Emit pause evidence
        env:
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python scripts/maintenance/emit_writers_pause_evidence.py \
            --manifest "$INPUT_MANIFEST_PATH" \
            --manifest-sha256 "$INPUT_MANIFEST_SHA" \
            --run-id "$WORKFLOW_RUN_ID" \
            --commit "$WORKFLOW_COMMIT" \
            --output pause-evidence/writers-pause.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: writers-pause-evidence-${{ github.run_id }}
          path: pause-evidence/writers-pause.json
          if-no-files-found: error
          retention-days: 90
