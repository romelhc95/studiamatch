name: Pipeline Canary

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Canary environment'
        required: true
        type: choice
        options: [free, pro]
      package_commit_sha:
        description: 'Certification commit containing current manifest/evidence'
        required: true
        type: string
      candidate_commit_sha:
        description: 'Certified code candidate SHA'
        required: true
        type: string
      manifest_path:
        description: 'Canonical release manifest path'
        required: true
        type: string
      manifest_sha256:
        description: 'Exact manifest SHA-256'
        required: true
        type: string
      confirmation:
        description: 'Type RUN_PIPELINE_CANARY'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: studiamatch-production-writers
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target == 'pro' && 'Production' || 'Certification' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.package_commit_sha }}
          path: package
          fetch-depth: 0
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.candidate_commit_sha }}
          path: candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install trusted gate dependencies
        run: python -m pip install jsonschema==4.23.0 requests==2.32.3
      - name: Validate package, branch and state
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PACKAGE_SHA: ${{ inputs.package_commit_sha }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRITERS_PAUSED: ${{ vars.PRODUCTION_WRITERS_PAUSED }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$INPUT_PACKAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$INPUT_MANIFEST_PATH" =~ ^\.context/evidencias/releases/[a-z0-9._-]+/release-manifest\.json$ ]]
          test "$INPUT_CONFIRMATION" = "RUN_PIPELINE_CANARY"
          test "$WRITERS_PAUSED" = "true"
          if [ "$INPUT_TARGET" = "free" ]; then
            test "$WORKFLOW_REF_NAME" = "certificacion"
            STAGE=free-canary
          else
            test "$WORKFLOW_REF_NAME" = "main"
            STAGE=pro-canary
          fi
          git -C package fetch origin certificacion --no-tags
          test "$(git -C package rev-parse HEAD)" = "$INPUT_PACKAGE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$INPUT_CANDIDATE_SHA"
          git -C package merge-base --is-ancestor "$INPUT_CANDIDATE_SHA" "$INPUT_PACKAGE_SHA"
          git -C package merge-base --is-ancestor "$INPUT_PACKAGE_SHA" origin/certificacion
          unexpected=$(git -C package diff --name-only "$INPUT_CANDIDATE_SHA" "$INPUT_PACKAGE_SHA" -- . \
            | grep -Ev '^\.context/evidencias/' || true)
          test -z "$unexpected"
          python trusted/scripts/maintenance/release_gate.py \
            "package/$INPUT_MANIFEST_PATH" \
            --repo-root package \
            --stage "$STAGE" \
            --verify-github-provenance \
            --expected-manifest-sha256 "$INPUT_MANIFEST_SHA"
      - name: Build isolated candidate worker image
        run: docker build --file trusted/.github/canary-worker.Dockerfile --tag studiamatch-canary-worker candidate
      - name: Run isolated canary with guaranteed cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_SUPABASE_ACCESS_TOKEN: ${{ secrets.CANARY_SUPABASE_ACCESS_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
        run: |
          python trusted/scripts/maintenance/pipeline_canary.py \
            --env "$INPUT_TARGET" \
            --run-id "$WORKFLOW_RUN_ID" \
            --candidate-commit "$INPUT_CANDIDATE_SHA" \
            --worker-root candidate \
            --worker-image studiamatch-canary-worker \
            --output canary-artifact/report.json
      - name: Rehearse idempotent cleanup
        if: always() && hashFiles('canary-artifact/run-manifest.json') != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          python trusted/scripts/maintenance/pipeline_canary.py \
            --env "$INPUT_TARGET" \
            --cleanup-manifest canary-artifact/run-manifest.json \
            --worker-root candidate \
            --output canary-artifact/cleanup-rehearsal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pipeline-canary-raw-${{ inputs.target }}-${{ github.run_id }}
          path: canary-artifact/
          if-no-files-found: warn
          retention-days: 90
      - name: Emit structured NO_GO on failure
        if: failure() && hashFiles('package/**/release-manifest.json') != ''
        env:
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python trusted/scripts/maintenance/emit_workflow_failure_evidence.py \
            --manifest "package/$INPUT_MANIFEST_PATH" \
            --manifest-sha256 "$INPUT_MANIFEST_SHA" \
            --run-id "$WORKFLOW_RUN_ID" \
            --commit "$WORKFLOW_COMMIT" \
            --workflow .github/workflows/pipeline-canary.yml \
            --role pipeline-engineer \
            --summary "Pipeline canary failed; cleanup report is attached when available" \
            --output failure-evidence/no-go.json
      - name: Upload NO_GO evidence
        if: failure() && hashFiles('failure-evidence/no-go.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-no-go-${{ github.run_id }}
          path: failure-evidence/no-go.json
          if-no-files-found: error
          retention-days: 90

  certify:
    needs: canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.package_commit_sha }}
          path: package
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.candidate_commit_sha }}
          path: candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.23.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pipeline-canary-raw-${{ inputs.target }}-${{ github.run_id }}
          path: canary-artifact
      - name: Certify raw canary evidence in a fresh job
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$INPUT_CANDIDATE_SHA"
          mkdir certified-artifact
          cp canary-artifact/report.json certified-artifact/report.json
          cp canary-artifact/cleanup-rehearsal.json certified-artifact/cleanup-rehearsal.json
          python trusted/scripts/maintenance/emit_pipeline_canary_evidence.py \
            --manifest "package/$INPUT_MANIFEST_PATH" \
            --manifest-sha256 "$INPUT_MANIFEST_SHA" \
            --report certified-artifact/report.json \
            --cleanup-report certified-artifact/cleanup-rehearsal.json \
            --env "$INPUT_TARGET" \
            --candidate-commit "$INPUT_CANDIDATE_SHA" \
            --candidate-root candidate \
            --run-id "$WORKFLOW_RUN_ID" \
            --commit "$WORKFLOW_COMMIT" \
            --output certified-artifact/evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-canary-${{ inputs.target }}-${{ github.run_id }}
          path: certified-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Emit structured NO_GO when certification fails
        if: failure() && hashFiles('package/**/release-manifest.json') != ''
        env:
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python trusted/scripts/maintenance/emit_workflow_failure_evidence.py \
            --manifest "package/$INPUT_MANIFEST_PATH" \
            --manifest-sha256 "$INPUT_MANIFEST_SHA" \
            --run-id "$WORKFLOW_RUN_ID" \
            --commit "$WORKFLOW_COMMIT" \
            --workflow .github/workflows/pipeline-canary.yml \
            --role pipeline-engineer \
            --summary "Fresh-job canary certification failed" \
            --output failure-evidence/no-go.json
      - name: Upload certification NO_GO evidence
        if: failure() && hashFiles('failure-evidence/no-go.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-no-go-${{ github.run_id }}
          path: failure-evidence/no-go.json
          if-no-files-found: error
          retention-days: 90
