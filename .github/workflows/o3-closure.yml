name: O3 Closure Coordinator

on:
  workflow_run:
    workflows: ["DB Sync to Production"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  close-o3:
    name: O3 Closure Evidence
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Assert no production apply path
        env:
          SUPABASE_URL: ""
          NEXT_SUPABASE_SECRET_KEY: ""
          NEXT_SUPABASE_PUBLISHABLE_KEY: ""
        run: |
          set -euo pipefail
          test -z "$SUPABASE_URL"
          test -z "$NEXT_SUPABASE_SECRET_KEY"
          test -z "$NEXT_SUPABASE_PUBLISHABLE_KEY"
          echo "O3 closure consumes artifacts only; no Supabase credentials are available."
      - name: Download DB detect-only evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: db-sync-detect-only-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: o3-inputs
      - name: Produce O3 closure evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAIN_MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.security import validate_work_package as validator
          from scripts.security.promotion_evidence import wait_for_o3_closure

          main_sha = os.environ["MAIN_MERGE_SHA"]
          evidence = validator.load_post_merge_evidence(main_sha)
          pr = evidence.get("pull_request") or {}
          pr_number = int(pr.get("number") or 0)
          head = pr.get("head") or {}
          pr_created_at = validator.parse_utc(pr.get("created_at"))
          pr_merged_at = validator.parse_utc(pr.get("merged_at"))
          if not pr_number or not pr_created_at or not pr_merged_at:
              raise SystemExit("O3_PR_METADATA_INVALID")
          promotion_check, error = validator.latest_check_run(
              evidence.get("checks") or [],
              "Promotion Boundary",
              head_sha=str(head.get("sha") or ""),
              pr_number=pr_number,
              pr_created_at=pr_created_at,
              pr_merged_at=pr_merged_at,
              allow_empty_pull_requests=True,
          )
          if error or not promotion_check:
              raise SystemExit(error or "O3_PROMOTION_CHECK_MISSING")
          run_id = validator.workflow_run_id_from_details(promotion_check.get("details_url"))
          if run_id is None:
              raise SystemExit("O3_PROMOTION_RUN_MISSING")
          premerge = validator.load_promotion_approval_evidence(run_id, pr_number)
          premerge["main_merge_sha"] = main_sha
          db_artifact = json.loads(Path("o3-inputs/db-sync-detect-only.json").read_text(encoding="utf-8"))

          def checks_provider():
              data = validator.github_api_json(f"commits/{main_sha}/check-runs?per_page=100", paginate=True)
              if not isinstance(data, list):
                  raise SystemExit("O3_CHECKS_SCHEMA_INVALID")
              return data

          closure, errors = wait_for_o3_closure(premerge, checks_provider, lambda: [db_artifact])
          if errors:
              raise SystemExit("\n".join(errors))
          Path("o3-closure-evidence.json").write_text(json.dumps(closure, ensure_ascii=True, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload O3 closure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o3-closure-evidence-${{ github.event.workflow_run.head_sha }}
          path: o3-closure-evidence.json
          if-no-files-found: error
          retention-days: 30
