name: F9.9 - Certification Canary

on:
  push:
    branches: [certificacion]
  workflow_dispatch:
    inputs:
      institution_slug:
        description: Exact institution slug to canary in Certification
        required: true
        type: string
      fg1_source_slug:
        description: Optional FG1 source slug; defaults to institution_slug
        required: false
        type: string
      max_harvest_urls:
        description: Maximum URLs FG2 may discover/harvest
        required: true
        default: '5'
        type: string
      max_staging_records:
        description: Maximum staging rows cleansing may consume
        required: true
        default: '5'
        type: string
      max_enrichment_records:
        description: Maximum cleansed rows enrichment may consume
        required: true
        default: '3'
        type: string
      max_sync_records:
        description: Maximum enriched rows sync may publish
        required: true
        default: '3'
        type: string
      max_integrity_courses:
        description: Maximum active courses FG3 may ping
        required: true
        default: '3'
        type: string
      run_fg1:
        description: Run FG1 inventory canary
        required: true
        default: true
        type: boolean
      run_fg2:
        description: Run FG2 pipeline canary
        required: true
        default: false
        type: boolean
      run_fg3:
        description: Run FG3 integrity canary
        required: true
        default: false
        type: boolean

concurrency:
  group: f9-9-certification-canary-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.institution_slug || vars.F99_CERTIFICATION_CANARY_INSTITUTION_SLUG || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certification_canary:
    name: Certification Canary
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name == 'certificacion' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: Certification
    env:
      CANARY_EXPECTED_ENVIRONMENT: Certification
      F99_CERTIFICATION_CANARY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONIOENCODING: utf-8
      PYTHONPATH: .
      WORKFLOW_INPUT_INSTITUTION_SLUG: ${{ inputs.institution_slug }}
      WORKFLOW_INPUT_FG1_SOURCE_SLUG: ${{ inputs.fg1_source_slug }}
      WORKFLOW_INPUT_MAX_HARVEST_URLS: ${{ inputs.max_harvest_urls }}
      WORKFLOW_INPUT_MAX_STAGING_RECORDS: ${{ inputs.max_staging_records }}
      WORKFLOW_INPUT_MAX_ENRICHMENT_RECORDS: ${{ inputs.max_enrichment_records }}
      WORKFLOW_INPUT_MAX_SYNC_RECORDS: ${{ inputs.max_sync_records }}
      WORKFLOW_INPUT_MAX_INTEGRITY_COURSES: ${{ inputs.max_integrity_courses }}
      WORKFLOW_INPUT_RUN_FG1: ${{ inputs.run_fg1 }}
      WORKFLOW_INPUT_RUN_FG2: ${{ inputs.run_fg2 }}
      WORKFLOW_INPUT_RUN_FG3: ${{ inputs.run_fg3 }}
      CONFIG_INSTITUTION_SLUG: ${{ vars.F99_CERTIFICATION_CANARY_INSTITUTION_SLUG }}
      CONFIG_FG1_SOURCE_SLUG: ${{ vars.F99_CERTIFICATION_CANARY_FG1_SOURCE_SLUG }}
      CONFIG_MAX_HARVEST_URLS: ${{ vars.F99_CERTIFICATION_CANARY_MAX_HARVEST_URLS }}
      CONFIG_MAX_STAGING_RECORDS: ${{ vars.F99_CERTIFICATION_CANARY_MAX_STAGING_RECORDS }}
      CONFIG_MAX_ENRICHMENT_RECORDS: ${{ vars.F99_CERTIFICATION_CANARY_MAX_ENRICHMENT_RECORDS }}
      CONFIG_MAX_SYNC_RECORDS: ${{ vars.F99_CERTIFICATION_CANARY_MAX_SYNC_RECORDS }}
      CONFIG_MAX_INTEGRITY_COURSES: ${{ vars.F99_CERTIFICATION_CANARY_MAX_INTEGRITY_COURSES }}
      CONFIG_RUN_FG1: ${{ vars.F99_CERTIFICATION_CANARY_RUN_FG1 }}
      CONFIG_RUN_FG2: ${{ vars.F99_CERTIFICATION_CANARY_RUN_FG2 }}
      CONFIG_RUN_FG3: ${{ vars.F99_CERTIFICATION_CANARY_RUN_FG3 }}
      CONFIG_MUTABLE_APPROVED: ${{ vars.F99_CERTIFICATION_CANARY_MUTABLE_APPROVED }}
      F99_CERTIFICATION_CANARY_SUPABASE_HOST: ${{ vars.F99_CERTIFICATION_CANARY_SUPABASE_HOST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Guard Certification target and limits
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|push) ;;
            *) echo "Unsupported Certification canary event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF_NAME" = "certificacion"

          normalize_bool() {
            case "${1:-}" in
              true|TRUE|True|1|yes|YES|Yes) printf 'true' ;;
              false|FALSE|False|0|no|NO|No) printf 'false' ;;
              *) echo "Invalid boolean value: ${1:-}" >&2; return 1 ;;
            esac
          }
          resolve_number() {
            value="${1:-}"
            default_value="$2"
            if [ -z "$value" ]; then
              value="$default_value"
            fi
            case "$value" in
              ''|*[!0-9]*) echo "Invalid numeric limit: $value" >&2; return 1 ;;
            esac
            if [ "$value" -lt 1 ] || [ "$value" -gt 50 ]; then
              echo "Limit out of allowed canary range 1..50: $value" >&2
              return 1
            fi
            printf '%s' "$value"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            institution_slug="$WORKFLOW_INPUT_INSTITUTION_SLUG"
            fg1_source_slug="$WORKFLOW_INPUT_FG1_SOURCE_SLUG"
            max_harvest_urls="$(resolve_number "$WORKFLOW_INPUT_MAX_HARVEST_URLS" 5)"
            max_staging_records="$(resolve_number "$WORKFLOW_INPUT_MAX_STAGING_RECORDS" 5)"
            max_enrichment_records="$(resolve_number "$WORKFLOW_INPUT_MAX_ENRICHMENT_RECORDS" 3)"
            max_sync_records="$(resolve_number "$WORKFLOW_INPUT_MAX_SYNC_RECORDS" 3)"
            max_integrity_courses="$(resolve_number "$WORKFLOW_INPUT_MAX_INTEGRITY_COURSES" 3)"
            run_fg1="$(normalize_bool "$WORKFLOW_INPUT_RUN_FG1")"
            run_fg2="$(normalize_bool "$WORKFLOW_INPUT_RUN_FG2")"
            run_fg3="$(normalize_bool "$WORKFLOW_INPUT_RUN_FG3")"
          else
            institution_slug="$CONFIG_INSTITUTION_SLUG"
            fg1_source_slug="$CONFIG_FG1_SOURCE_SLUG"
            max_harvest_urls="$(resolve_number "$CONFIG_MAX_HARVEST_URLS" 5)"
            max_staging_records="$(resolve_number "$CONFIG_MAX_STAGING_RECORDS" 5)"
            max_enrichment_records="$(resolve_number "$CONFIG_MAX_ENRICHMENT_RECORDS" 3)"
            max_sync_records="$(resolve_number "$CONFIG_MAX_SYNC_RECORDS" 3)"
            max_integrity_courses="$(resolve_number "$CONFIG_MAX_INTEGRITY_COURSES" 3)"
            run_fg1="$(normalize_bool "${CONFIG_RUN_FG1:-true}")"
            run_fg2="$(normalize_bool "${CONFIG_RUN_FG2:-false}")"
            run_fg3="$(normalize_bool "${CONFIG_RUN_FG3:-false}")"
          fi

          case "$institution_slug" in
            ''|*[!a-z0-9-]*) echo "Invalid institution_slug" >&2; exit 1 ;;
          esac
          if [ -n "$fg1_source_slug" ] && [ "$fg1_source_slug" != "$institution_slug" ]; then
            echo "fg1_source_slug must be empty or equal to institution_slug" >&2
            exit 1
          fi
          mutable_approved="$(normalize_bool "${CONFIG_MUTABLE_APPROVED:-false}")"
          if { [ "$run_fg2" = "true" ] || [ "$run_fg3" = "true" ]; } && [ "$mutable_approved" != "true" ]; then
            echo "FG2/FG3 require F99_CERTIFICATION_CANARY_MUTABLE_APPROVED=true" >&2
            exit 1
          fi
          if [ -z "$F99_CERTIFICATION_CANARY_SUPABASE_HOST" ]; then
            echo "F99_CERTIFICATION_CANARY_SUPABASE_HOST is required" >&2
            exit 1
          fi
          {
            echo "CANARY_REQUESTED_INSTITUTION_SLUG=$institution_slug"
            echo "CANARY_FG1_SOURCE_SLUG=$fg1_source_slug"
            echo "CANARY_MAX_HARVEST_URLS=$max_harvest_urls"
            echo "CANARY_MAX_STAGING_RECORDS=$max_staging_records"
            echo "CANARY_MAX_ENRICHMENT_RECORDS=$max_enrichment_records"
            echo "CANARY_MAX_SYNC_RECORDS=$max_sync_records"
            echo "CANARY_MAX_INTEGRITY_COURSES=$max_integrity_courses"
            echo "CANARY_RUN_FG1=$run_fg1"
            echo "CANARY_RUN_FG2=$run_fg2"
            echo "CANARY_RUN_FG3=$run_fg3"
            echo "CANARY_MUTABLE_APPROVED=$mutable_approved"
            echo "CANARY_STATE_DIR=$RUNNER_TEMP/f9_9_canary_state"
            echo "CANARY_PRIVATE_SNAPSHOT=$RUNNER_TEMP/f9_9_canary_state/private_snapshot.json"
          } >> "$GITHUB_ENV"

      - name: Guard Certification Supabase target
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          expected = os.environ.get('F99_CERTIFICATION_CANARY_SUPABASE_HOST', '').strip().lower()
          if not expected:
              raise SystemExit('missing expected Certification Supabase host')
          for variable in ('SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_URL'):
              parsed = urlparse(os.environ.get(variable, ''))
              host = (parsed.hostname or '').lower()
              try:
                  port = parsed.port
              except ValueError as exc:
                  raise SystemExit(f'{variable} has invalid Supabase URL port') from exc
              if (
                  parsed.scheme != 'https'
                  or parsed.username
                  or parsed.password
                  or port not in (None, 443)
                  or host != expected
              ):
                  raise SystemExit(f'{variable} does not match expected Certification Supabase host')
          PY

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CA1 dependencies
        run: pip install --require-hashes -r requirements-pipeline.txt

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          if [ "$CANARY_RUN_FG2" != "true" ]; then
            echo "Skipping Playwright install because FG2 is disabled."
            exit 0
          fi
          playwright install chromium

      - name: Build pre-canary manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/core/certification_canary_manifest.py \
            --institution-slug "$CANARY_REQUESTED_INSTITUTION_SLUG" \
            --stage pre \
            --output artifacts/f9_9_canary_pre.json \
            --github-env "$GITHUB_ENV" \
            --require-pipeline-enabled \
            --max-staging-records "$CANARY_MAX_STAGING_RECORDS" \
            --max-enrichment-records "$CANARY_MAX_ENRICHMENT_RECORDS" \
            --max-sync-records "$CANARY_MAX_SYNC_RECORDS" \
            --max-integrity-courses "$CANARY_MAX_INTEGRITY_COURSES"

      - name: Capture private mutable canary pre-state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "$CANARY_RUN_FG2" != "true" ] && [ "$CANARY_RUN_FG3" != "true" ]; then
            echo "Skipping mutable snapshot because FG2 and FG3 are disabled."
            exit 0
          fi
          mkdir -p "$CANARY_STATE_DIR"
          python scripts/core/certification_canary_state.py snapshot \
            --institution-slug "$CANARY_REQUESTED_INSTITUTION_SLUG" \
            --output "$CANARY_PRIVATE_SNAPSHOT" \
            --summary-output artifacts/f9_9_canary_snapshot.json

      - name: FG1 one-source inventory canary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "$CANARY_RUN_FG1" != "true" ]; then
            echo "Skipping FG1 canary by request."
            exit 0
          fi
          source_slug="$CANARY_FG1_SOURCE_SLUG"
          if [ -z "$source_slug" ]; then
            source_slug="$CANARY_INSTITUTION_SLUG"
          fi
          python scripts/core/discovery_institutions.py --source-slug "$source_slug" --no-insert

      - name: FG2 bounded harvest canary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "$CANARY_RUN_FG2" != "true" ]; then
            echo "Skipping FG2 harvest canary by request."
            exit 0
          fi
          JOB_START_TIME="$(date +%s)"
          export JOB_START_TIME
          python3 scripts/core/master_orchestrator.py \
            --institution-slug "$CANARY_INSTITUTION_SLUG" \
            --limit 1 \
            --max-urls "$CANARY_MAX_HARVEST_URLS" \
            --skip-cleansing

      - name: FG2 bounded cleansing canary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "$CANARY_RUN_FG2" != "true" ]; then
            echo "Skipping FG2 cleansing canary by request."
            exit 0
          fi
          python scripts/core/cleansing_worker.py \
            --institution-id "$CANARY_INSTITUTION_ID" \
            --limit "$CANARY_MAX_STAGING_RECORDS"

      - name: FG2 bounded enrichment canary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          if [ "$CANARY_RUN_FG2" != "true" ]; then
            echo "Skipping FG2 enrichment canary by request."
            exit 0
          fi
          python scripts/core/enrichment_worker.py \
            --institution-id "$CANARY_INSTITUTION_ID" \
            --limit "$CANARY_MAX_ENRICHMENT_RECORDS"

      - name: FG2 bounded sync canary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "$CANARY_RUN_FG2" != "true" ]; then
            echo "Skipping FG2 sync canary by request."
            exit 0
          fi
          python scripts/core/sync_vector_worker.py \
            --institution-id "$CANARY_INSTITUTION_ID" \
            --limit "$CANARY_MAX_SYNC_RECORDS"

      - name: FG3 bounded integrity canary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "$CANARY_RUN_FG3" != "true" ]; then
            echo "Skipping FG3 integrity canary by request."
            exit 0
          fi
          python scripts/core/integrity_ping.py \
            --institution-id "$CANARY_INSTITUTION_ID" \
            --limit "$CANARY_MAX_INTEGRITY_COURSES"

      - name: Build post-canary manifest
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/core/certification_canary_manifest.py \
            --institution-slug "$CANARY_REQUESTED_INSTITUTION_SLUG" \
            --stage post \
            --output artifacts/f9_9_canary_post.json \
            --max-staging-records "$CANARY_MAX_STAGING_RECORDS" \
            --max-enrichment-records "$CANARY_MAX_ENRICHMENT_RECORDS" \
            --max-sync-records "$CANARY_MAX_SYNC_RECORDS" \
            --max-integrity-courses "$CANARY_MAX_INTEGRITY_COURSES"

      - name: Restore mutable canary state
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "${CANARY_RUN_FG2:-false}" != "true" ] && [ "${CANARY_RUN_FG3:-false}" != "true" ]; then
            echo "Skipping mutable restore because FG2 and FG3 are disabled."
            exit 0
          fi
          test -s "$CANARY_PRIVATE_SNAPSHOT"
          python scripts/core/certification_canary_state.py restore \
            --institution-slug "$CANARY_REQUESTED_INSTITUTION_SLUG" \
            --snapshot "$CANARY_PRIVATE_SNAPSHOT" \
            --summary-output artifacts/f9_9_canary_restore.json

      - name: Verify mutable canary cleanup idempotence
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "${CANARY_RUN_FG2:-false}" != "true" ] && [ "${CANARY_RUN_FG3:-false}" != "true" ]; then
            echo "Skipping idempotence check because FG2 and FG3 are disabled."
            exit 0
          fi
          test -s "$CANARY_PRIVATE_SNAPSHOT"
          python scripts/core/certification_canary_state.py restore \
            --institution-slug "$CANARY_REQUESTED_INSTITUTION_SLUG" \
            --snapshot "$CANARY_PRIVATE_SNAPSHOT" \
            --summary-output artifacts/f9_9_canary_restore_idempotent.json \
            --expect-noop

      - name: Build after-cleanup manifest
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CANARY_REQUESTED_INSTITUTION_SLUG:-}" ]; then
            echo "Skipping after-cleanup manifest because canary inputs were not normalized."
            exit 0
          fi
          python scripts/core/certification_canary_manifest.py \
            --institution-slug "$CANARY_REQUESTED_INSTITUTION_SLUG" \
            --stage after-cleanup \
            --output artifacts/f9_9_canary_after_cleanup.json \
            --max-staging-records "${CANARY_MAX_STAGING_RECORDS:-5}" \
            --max-enrichment-records "${CANARY_MAX_ENRICHMENT_RECORDS:-3}" \
            --max-sync-records "${CANARY_MAX_SYNC_RECORDS:-3}" \
            --max-integrity-courses "${CANARY_MAX_INTEGRITY_COURSES:-3}"

      - name: Print sanitized manifests
        if: always()
        run: |
          set -euo pipefail
          for manifest in artifacts/f9_9_canary_*.json; do
            test -s "$manifest"
            python -m json.tool "$manifest"
          done

      - name: Upload sanitized canary manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f9-9-certification-canary-manifests-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/f9_9_canary_*.json
          if-no-files-found: error
          retention-days: 30
