name: DB Sync to Production

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Immutable main commit approved for Production"
        required: true
        type: string
      apply_authorized:
        description: "Production environment approval was granted"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  MIGRATION_MANIFEST: db/manifests/fase08_candidate.json

concurrency:
  group: studiamatch-db-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: "Detect pending migrations"
    if: github.ref_name == 'main' && inputs.apply_authorized
    runs-on: ubuntu-latest
    environment:
      name: Production
    outputs:
      pending_count: ${{ steps.check.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt
      - name: Check pending migrations
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 scripts/maintenance/db_migrate.py --env pro --dry-run --manifest "$MIGRATION_MANIFEST" > report.txt
          count=$(grep -c "PENDIENTE" report.txt || true)
          echo "count=$count" >> $GITHUB_OUTPUT
          cat report.txt

  apply:
    name: "Apply pending migrations"
    needs: detect
    if: github.ref_name == 'main' && needs.detect.outputs.pending_count > 0
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt
      - name: Apply migrations to Pro
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/maintenance/db_migrate.py --env pro --manifest "$MIGRATION_MANIFEST"

  verify:
    name: "Verify target schema"
    needs: [detect, apply]
    if: always() && github.ref_name == 'main' && needs.detect.result == 'success' && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt
      - name: Run target schema check
        id: parity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/maintenance/check_db_parity.py --env pro --target-only
      - name: Report target schema result
        run: |
          if [ "${{ steps.parity.outcome }}" = "failure" ]; then
            echo "❌ Target schema check FAILED — Pro no tiene la configuracion/schema minima"
            exit 1
          fi
          echo "✅ Target schema check PASSED"

  defer-fg2:
    name: "FG2 deferred to scheduled production window"
    needs: verify
    if: success() && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deferred production scraping
        run: |
          echo "✅ DB sync/parity completed. FG2 is intentionally NOT dispatched immediately."
          echo "Production FG2 will run on its scheduled window or by explicit workflow_dispatch."
