name: DB Sync to Production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "manual only; report is dry-run, apply requires separate DDL authorization, verify checks target schema"
        required: true
        default: report
        type: choice
        options:
          - report
          - apply
          - verify
      migration_manifest:
        description: "Closed Pro migration manifest to report/apply/verify"
        required: true
        default: h2-expand-compat
        type: choice
        options:
          - f10-8-atomic-cleansing-provenance
          - h2-expand-compat
          - h2-contract-public-reader
          - h2-contract-legacy-cohort
          - h2-rollback-public-reader-contract
      candidate_sha:
        description: "Immutable certificacion/main evidence commit approved for Production DB operation"
        required: true
        type: string
      payload_sha:
        description: "Immutable payload commit authorized by the evidence commit"
        required: true
        type: string
      apply_authorized:
        description: "Production environment approval was granted for this manual apply"
        required: true
        default: false
        type: boolean
      backup_pitr_verified:
        description: "Backup/PITR was verified immediately before this manual apply"
        required: true
        default: false
        type: boolean
      ddl_authorization_id:
        description: "Separate approved DDL authorization ID"
        required: false
        type: string
      h2_expected_eligible_count:
        description: "Expected H2 Pro eligible/cohort/effective count for h2-expand-compat"
        required: false
        default: "224"
        type: string
      h2_expected_cohort_digest:
        description: "Expected H2 Pro ordered cohort digest, format sha256:<64 hex chars>"
        required: false
        type: string
      h2_advisors_reviewed:
        description: "Security and Performance Advisors reviewed after H2 verify; no new HIGH/CRITICAL H2 findings"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: studiamatch-db-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-db-changes:
    name: "Detect DB changes"
    if: github.ref_name == 'main' || github.ref_name == 'certificacion'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      db_changed: ${{ steps.detect.outputs.db_changed }}
    steps:
      - name: Resolve immutable candidate
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || '' }}
        run: |
          set -euo pipefail
          candidate="$PUSH_SHA"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            candidate="$DISPATCH_SHA"
          fi
          printf '%s' "$candidate" | grep -Eq '^[0-9a-f]{40}$'
          test "$candidate" != "0000000000000000000000000000000000000000"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.resolve.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$CANDIDATE_SHA"
          case "${{ inputs.migration_manifest }}" in
            h2-expand-compat)
              test "${GITHUB_REF_NAME}" = "certificacion"
              ;;
            h2-contract-public-reader|h2-contract-legacy-cohort|h2-rollback-public-reader-contract)
              test "${GITHUB_REF_NAME}" = "main"
              ;;
          esac
      - name: Detect db path changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "db_changed=true" >> "$GITHUB_OUTPUT"
            echo "DB Sync manual dispatch requires report/preflight path." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$BEFORE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$BEFORE_SHA" != "0000000000000000000000000000000000000000"
          git cat-file -e "$BEFORE_SHA^{commit}"
          git merge-base --is-ancestor "$BEFORE_SHA" "$CANDIDATE_SHA"
          set +e
          git diff --quiet "$BEFORE_SHA" "$CANDIDATE_SHA" -- db/
          diff_status="$?"
          set -e
          if [ "$diff_status" -eq 0 ]; then
            echo "db_changed=false" >> "$GITHUB_OUTPUT"
            echo "No db/** changes detected; DB Sync report/apply/verify remain skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$diff_status" -eq 1 ]; then
            echo "db_changed=true" >> "$GITHUB_OUTPUT"
            echo "db/** changes detected; DB Sync dry-run report remains required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "git diff failed with status $diff_status" >&2
            exit "$diff_status"
          fi

  db-sync-detect-only:
    name: "DB Sync Detect Only"
    needs: detect-db-changes
    if: >-
      (github.ref_name == 'main' || github.ref_name == 'certificacion') &&
      needs.detect-db-changes.outputs.db_changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Assert detect-only result
        env:
          DB_CHANGED: ${{ needs.detect-db-changes.outputs.db_changed }}
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ "$DB_CHANGED" = "false" ]; then
            printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
            test "$CANDIDATE_SHA" != "0000000000000000000000000000000000000000"
            test "$CANDIDATE_SHA" = "$GITHUB_SHA"
            echo "NO_DB_CHANGES" >> "$GITHUB_STEP_SUMMARY"
            echo "DB Sync Detect Only=NO_DB_CHANGES"
            python3 -c 'import hashlib,json,os,pathlib; payload={"schema":"db-sync-detect-only-v1","head_sha":os.environ["CANDIDATE_SHA"],"result":"NO_DB_CHANGES","db_changed":False,"apply_executed":False}; raw=json.dumps(payload,ensure_ascii=True,sort_keys=True,separators=(",",":")).encode("utf-8"); payload["payload_sha256"]=hashlib.sha256(raw).hexdigest(); pathlib.Path("db-sync-detect-only.json").write_text(json.dumps(payload,ensure_ascii=True,sort_keys=True,indent=2)+"\n",encoding="utf-8")'
            exit 0
          fi
          echo "::error::DB Sync Detect Only requires NO_DB_CHANGES for HOM-012 O3"
          exit 1
      - name: Upload DB detect-only evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: db-sync-detect-only-${{ github.sha }}
          path: db-sync-detect-only.json
          if-no-files-found: error
          retention-days: 30

  db-contract-preflight:
    name: "DB contract preflight"
    needs: detect-db-changes
    if: >-
      (github.ref_name == 'main' || github.ref_name == 'certificacion') &&
      needs.detect-db-changes.outputs.db_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$CANDIDATE_SHA"
      - name: Validate closed Pro manifest offline
        env:
          MIGRATION_MANIFEST: ${{ inputs.migration_manifest }}
        run: |
          set -euo pipefail
          printf '%s' "$MIGRATION_MANIFEST" | grep -Eq '^(f10-8-atomic-cleansing-provenance|h2-expand-compat|h2-contract-public-reader|h2-contract-legacy-cohort|h2-rollback-public-reader-contract)$'
          python3 - <<'PY'
          import pathlib

          root = pathlib.Path(".")
          script = (root / "scripts" / "maintenance" / "db_migrate.py").read_text(encoding="utf-8")
          required = [
              "PRO_MIGRATION_MANIFESTS",
              "f10-8-atomic-cleansing-provenance",
              "h2-expand-compat",
              "h2-contract-public-reader",
              "h2-contract-legacy-cohort",
              "h2-rollback-public-reader-contract",
          ]
          missing = [item for item in required if item not in script]
          if missing:
              raise SystemExit(f"db_migrate.py missing manifest contract: {missing}")
          PY

  report:
    name: "Report pending migrations"
    needs: [detect-db-changes, db-contract-preflight]
    if: >-
      always() &&
      (github.ref_name == 'main' || github.ref_name == 'certificacion') &&
      needs.detect-db-changes.outputs.db_changed == 'true' &&
      needs.db-contract-preflight.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: Production
    outputs:
      pending_count: ${{ steps.check.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$CANDIDATE_SHA"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt
      - name: H2 Pro preflight digest report
        if: inputs.migration_manifest == 'h2-expand-compat' && inputs.operation != 'verify'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/maintenance/h2_pro_preflight_report.py | tee h2-pro-preflight-report.json
      - name: Report pending migrations dry-run
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          MIGRATION_MANIFEST: ${{ inputs.migration_manifest }}
        run: |
          set -euo pipefail
          python3 scripts/maintenance/db_migrate.py --env pro --dry-run --manifest "$MIGRATION_MANIFEST" > report.txt
          count=$(grep -c "PENDIENTE" report.txt || true)
          printf '%s' "$count" | grep -Eq '^[0-9]+$'
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cat report.txt
      - name: Confirm report-only mode
        run: |
          set -euo pipefail
          echo "DB sync push/report mode is dry-run only. No migration apply is performed by this job."
      - name: Upload H2 Pro preflight report
        if: inputs.migration_manifest == 'h2-expand-compat' && inputs.operation != 'verify'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2-pro-preflight-report-${{ needs.detect-db-changes.outputs.candidate_sha }}
          path: h2-pro-preflight-report.json
          if-no-files-found: error
          retention-days: 30

  apply:
    name: "Apply pending migrations"
    needs: [detect-db-changes, report]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref_name == 'main' || github.ref_name == 'certificacion') &&
      (
        (
          inputs.operation == 'apply' &&
          inputs.apply_authorized &&
          inputs.backup_pitr_verified &&
          inputs.ddl_authorization_id != '' &&
          fromJSON(needs.report.outputs.pending_count) > 0
        ) || (
          inputs.operation == 'verify' &&
          fromJSON(needs.report.outputs.pending_count) == 0
        )
      )
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$CANDIDATE_SHA"
      - name: Confirm verify no-op
        if: inputs.operation == 'verify'
        run: |
          set -euo pipefail
          echo "operation=verify with no pending migrations; apply job is a no-op and succeeds."
      - name: Verify explicit DDL authorization
        if: inputs.operation == 'apply'
        env:
          DDL_AUTHORIZATION_ID: ${{ inputs.ddl_authorization_id }}
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          PAYLOAD_SHA: ${{ inputs.payload_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$DDL_AUTHORIZATION_ID" | grep -Eq '^DDL-[A-Z0-9][A-Z0-9_-]{3,}$'
          printf '%s' "$PAYLOAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          auth_file=".context/operaciones/ddl_authorizations/${DDL_AUTHORIZATION_ID}.md"
          test -f "$auth_file"
          grep -Fx "Status: APPROVED_FOR_PRODUCTION_DDL" "$auth_file"
          grep -Fx "Authorized manifest: ${{ inputs.migration_manifest }}" "$auth_file"
          grep -Fx "Authorized payload SHA: ${PAYLOAD_SHA}" "$auth_file"
          if [ "${{ inputs.migration_manifest }}" = "h2-expand-compat" ]; then
            printf '%s' "${{ inputs.h2_expected_eligible_count }}" | grep -Eq '^[1-9][0-9]*$'
            printf '%s' "${{ inputs.h2_expected_cohort_digest }}" | grep -Eq '^sha256:[0-9a-f]{64}$'
            grep -Fx "H2 expected eligible count: ${{ inputs.h2_expected_eligible_count }}" "$auth_file"
            grep -Fx "H2 expected cohort digest: ${{ inputs.h2_expected_cohort_digest }}" "$auth_file"
          fi
          grep -Fx "Backup/PITR gate: BACKUP_PITR_RUNTIME_GATE_REQUIRED" "$auth_file"
          grep -Fx "Pro apply gate: APPLY_REQUIRES_WORKFLOW_DISPATCH_PRODUCTION_ENVIRONMENT_APPROVAL_AND_RUNTIME_BACKUP_PITR" "$auth_file"

          auth_base_sha="$(sed -n 's/^Authorized base SHA: //p' "$auth_file" | head -n 1)"
          expected_non_auth_digest="$(sed -n 's/^Authorized non-auth digest SHA256: //p' "$auth_file" | head -n 1)"
          printf '%s' "$auth_base_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$expected_non_auth_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          git cat-file -e "$auth_base_sha^{commit}"
          git cat-file -e "$PAYLOAD_SHA^{commit}"
          git merge-base --is-ancestor "$auth_base_sha" "$PAYLOAD_SHA"
          git merge-base --is-ancestor "$PAYLOAD_SHA" "$CANDIDATE_SHA"
          changed_after_payload="$(git diff --name-only "$PAYLOAD_SHA" "$CANDIDATE_SHA")"
          test "$changed_after_payload" = "$auth_file"

          AUTH_FILE="$auth_file" AUTH_BASE_SHA="$auth_base_sha" PAYLOAD_SHA="$PAYLOAD_SHA" EXPECTED_NON_AUTH_DIGEST="$expected_non_auth_digest" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys

          auth_file = os.environ["AUTH_FILE"]
          base = os.environ["AUTH_BASE_SHA"]
          head = os.environ["PAYLOAD_SHA"]
          expected_non_auth_digest = os.environ["EXPECTED_NON_AUTH_DIGEST"]

          raw = subprocess.check_output([
              "git", "diff", "--name-status", "-z", "--find-renames", "--find-copies",
              base, head, "--",
          ])
          fields = raw.split(b"\0")
          index = 0
          digest_records = []
          failures = []
          while index < len(fields) and fields[index]:
              status = fields[index].decode("ascii")
              index += 1
              if status.startswith(("R", "C")):
                  old_path = fields[index].decode("utf-8", "surrogateescape")
                  index += 1
                  failures.append(f"unsupported-status:{status}:{old_path}")
              path = fields[index].decode("utf-8", "surrogateescape")
              index += 1
              if path == auth_file:
                  continue
              meta = subprocess.check_output(["git", "ls-tree", head, "--", path], text=True).strip()
              if not meta:
                  failures.append(f"missing-head:{path}")
                  continue
              mode, kind, blob = meta.split(None, 3)[:3]
              if kind != "blob":
                  failures.append(f"non-blob:{path}:{kind}")
                  continue
              blob_bytes = subprocess.check_output(["git", "cat-file", "blob", blob])
              digest_records.append({
                  "mode": mode,
                  "path": path,
                  "sha256": hashlib.sha256(blob_bytes).hexdigest(),
                  "status": status,
              })
          actual_digest = "sha256:" + hashlib.sha256(
              json.dumps(digest_records, separators=(",", ":"), sort_keys=True).encode("utf-8")
          ).hexdigest()
          if actual_digest != expected_non_auth_digest:
              failures.append(f"non-auth-digest:{actual_digest}")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print("Production DDL authorization governance boundary passed")
          PY
      - name: Setup Python
        if: inputs.operation == 'apply'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        if: inputs.operation == 'apply'
        run: pip install --require-hashes -r requirements-db-migrate.txt
      - name: Verify production controls before migrations
        if: inputs.operation == 'apply'
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          PRODUCTION_WRITERS_PAUSED: ${{ vars.PRODUCTION_WRITERS_PAUSED }}
        run: bash .github/scripts/production_control_preflight.sh DB-SYNC --enforce
      - name: Apply migrations to Pro
        if: inputs.operation == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          MIGRATION_MANIFEST: ${{ inputs.migration_manifest }}
          H2_EXPECTED_ELIGIBLE_COUNT: ${{ inputs.h2_expected_eligible_count }}
          H2_EXPECTED_COHORT_DIGEST: ${{ inputs.h2_expected_cohort_digest }}
          H2_PAYLOAD_SHA: ${{ inputs.payload_sha }}
          H2_AUTHORIZATION_ID: ${{ inputs.ddl_authorization_id }}
        run: python3 scripts/maintenance/db_migrate.py --env pro --manifest "$MIGRATION_MANIFEST"

  verify:
    name: "Verify target schema"
    needs: [detect-db-changes, report, apply]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref_name == 'main' || github.ref_name == 'certificacion') &&
      (
        (
          inputs.operation == 'apply' &&
          needs.report.result == 'success' &&
          needs.apply.result == 'success'
        ) || (
          inputs.operation == 'verify' &&
          needs.report.result == 'success' &&
          (needs.apply.result == 'success' || needs.apply.result == 'skipped') &&
          needs.report.outputs.pending_count == '0'
        )
      )
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$CANDIDATE_SHA"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt
      - name: Run target schema check
        id: parity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          MIGRATION_MANIFEST: ${{ inputs.migration_manifest }}
          H2_EXPECTED_ELIGIBLE_COUNT: ${{ inputs.h2_expected_eligible_count }}
          H2_EXPECTED_COHORT_DIGEST: ${{ inputs.h2_expected_cohort_digest }}
        run: python3 scripts/maintenance/check_db_parity.py --env pro --target-only --h2-manifest "$MIGRATION_MANIFEST"
      - name: Report target schema result
        run: |
          set -euo pipefail
          if [ "${{ steps.parity.outcome }}" = "failure" ]; then
            echo "Target schema check FAILED: Pro does not match the minimum schema contract"
            exit 1
          fi
          echo "Target schema check PASSED"
      - name: Write H2 production expand verify evidence
        if: inputs.migration_manifest == 'h2-expand-compat'
        env:
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          PAYLOAD_SHA: ${{ inputs.payload_sha }}
          RUN_ID: ${{ github.run_id }}
          H2_EXPECTED_ELIGIBLE_COUNT: ${{ inputs.h2_expected_eligible_count }}
          H2_EXPECTED_COHORT_DIGEST: ${{ inputs.h2_expected_cohort_digest }}
          H2_ADVISORS_REVIEWED: ${{ inputs.h2_advisors_reviewed }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          test "$H2_ADVISORS_REVIEWED" = "true"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" = "xwhtiqmboljkshrtviyw"
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          expected_host = "xwhtiqmboljkshrtviyw.supabase.co"
          parsed = urlparse(os.environ["SUPABASE_URL"])
          if (
              parsed.scheme != "https"
              or parsed.hostname != expected_host
              or parsed.username
              or parsed.password
              or parsed.port not in (None, 443)
          ):
              raise SystemExit(f"SUPABASE_URL must point to canonical Pro project {expected_host}")
          PY
          mkdir -p h2-production-expand-evidence
          curl -fsSL -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors/security" \
            > h2-production-expand-evidence/supabase-security-advisors.json
          curl -fsSL -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors/performance" \
            > h2-production-expand-evidence/supabase-performance-advisors.json
          python3 - <<'PY'
          import json
          import os
          import pathlib

          def has_blocking_advisor(value):
              if isinstance(value, dict):
                  severity = str(value.get("severity", value.get("level", ""))).lower()
                  status = str(value.get("status", "")).lower()
                  if severity in {"critical", "high", "error"} and status not in {"passing", "ok", "resolved"}:
                      return True
                  return any(has_blocking_advisor(item) for item in value.values())
              if isinstance(value, list):
                  return any(has_blocking_advisor(item) for item in value)
              return False

          evidence_dir = pathlib.Path("h2-production-expand-evidence")
          for advisor_file in ("supabase-security-advisors.json", "supabase-performance-advisors.json"):
              payload_raw = json.loads((evidence_dir / advisor_file).read_text(encoding="utf-8"))
              if has_blocking_advisor(payload_raw):
                  raise SystemExit(f"blocking Supabase advisor findings in {advisor_file}")

          payload = {
              "schema": "h2-main-production-expand-evidence-v1",
              "workflow_name": "DB Sync to Production",
              "run_id": int(os.environ["RUN_ID"]),
              "branch": "certificacion",
              "operation": "apply",
              "manifest": "h2-expand-compat",
              "verify_result": "success",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "payload_sha": os.environ["PAYLOAD_SHA"],
              "h2_expected_eligible_count": int(os.environ["H2_EXPECTED_ELIGIBLE_COUNT"]),
              "h2_expected_cohort_digest": os.environ["H2_EXPECTED_COHORT_DIGEST"],
              "h2_advisors_reviewed": os.environ["H2_ADVISORS_REVIEWED"] == "true",
              "h2_advisors_result": "no_new_high_or_critical_h2_findings",
              "h2_advisors_artifact": True,
          }
          (evidence_dir / "h2-production-expand-verify-evidence.json").write_text(
              json.dumps(payload, ensure_ascii=True, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload H2 production expand verify evidence
        if: inputs.migration_manifest == 'h2-expand-compat'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2-production-expand-verify-${{ needs.detect-db-changes.outputs.candidate_sha }}
          path: h2-production-expand-evidence
          if-no-files-found: error
          retention-days: 30

  defer-fg2:
    name: "FG2 deferred to scheduled production window"
    needs: verify
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref_name == 'main' || github.ref_name == 'certificacion') &&
      (inputs.operation == 'apply' || inputs.operation == 'verify') &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deferred production scraping
        run: |
          set -euo pipefail
          echo "DB sync/parity completed. FG2 is intentionally NOT dispatched immediately."
          echo "Production FG2 will run on its scheduled window or by explicit workflow_dispatch."
