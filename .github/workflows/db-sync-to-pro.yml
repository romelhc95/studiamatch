name: DB Sync to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "report runs dry-run only; apply requires separate DDL authorization"
        required: true
        default: report
        type: choice
        options:
          - report
          - apply
      candidate_sha:
        description: "Immutable main commit approved for Production"
        required: true
        type: string
      apply_authorized:
        description: "Production environment approval was granted for this manual apply"
        required: true
        default: false
        type: boolean
      backup_pitr_verified:
        description: "Backup/PITR was verified immediately before this manual apply"
        required: true
        default: false
        type: boolean
      ddl_authorization_id:
        description: "Separate approved DDL authorization ID"
        required: false
        type: string

permissions:
  contents: read

env:
  F10_8_ONLY_MIGRATION: 20260808_fase10_8_atomic_cleansing_provenance

concurrency:
  group: studiamatch-db-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-db-changes:
    name: "Detect DB changes"
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      db_changed: ${{ steps.detect.outputs.db_changed }}
    steps:
      - name: Resolve immutable candidate
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || '' }}
        run: |
          set -euo pipefail
          candidate="$PUSH_SHA"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            candidate="$DISPATCH_SHA"
          fi
          printf '%s' "$candidate" | grep -Eq '^[0-9a-f]{40}$'
          test "$candidate" != "0000000000000000000000000000000000000000"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.resolve.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
      - name: Detect db path changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "db_changed=true" >> "$GITHUB_OUTPUT"
            echo "DB Sync manual dispatch requires report/preflight path." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$BEFORE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$BEFORE_SHA" != "0000000000000000000000000000000000000000"
          git cat-file -e "$BEFORE_SHA^{commit}"
          git merge-base --is-ancestor "$BEFORE_SHA" "$CANDIDATE_SHA"
          set +e
          git diff --quiet "$BEFORE_SHA" "$CANDIDATE_SHA" -- db/
          diff_status="$?"
          set -e
          if [ "$diff_status" -eq 0 ]; then
            echo "db_changed=false" >> "$GITHUB_OUTPUT"
            echo "No db/** changes detected; DB Sync report/apply/verify remain skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$diff_status" -eq 1 ]; then
            echo "db_changed=true" >> "$GITHUB_OUTPUT"
            echo "db/** changes detected; DB Sync dry-run report remains required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "git diff failed with status $diff_status" >&2
            exit "$diff_status"
          fi

  db-contract-preflight:
    name: "DB contract preflight"
    needs: detect-db-changes
    if: >-
      github.ref_name == 'main' &&
      needs.detect-db-changes.outputs.db_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
      - name: Validate F10.8 one-migration apply target offline
        run: |
          set -euo pipefail
          test -f "db/migrations/${F10_8_ONLY_MIGRATION}.sql"
          python3 - <<'PY'
          import pathlib

          root = pathlib.Path(".")
          migration = root / "db" / "migrations" / "20260808_fase10_8_atomic_cleansing_provenance.sql"
          script = (root / "scripts" / "maintenance" / "db_migrate.py").read_text(encoding="utf-8")
          if not migration.exists():
              raise SystemExit("F10.8 migration is missing")
          if "--only" not in script:
              raise SystemExit("db_migrate.py must support --only")
          if "F10_8_ALLOWED_PRO_ONLY_MIGRATIONS" not in script:
              raise SystemExit("db_migrate.py must constrain Pro --only migrations")
          PY

  report:
    name: "Report pending migrations"
    needs: [detect-db-changes, db-contract-preflight]
    if: >-
      always() &&
      github.ref_name == 'main' &&
      needs.detect-db-changes.outputs.db_changed == 'true' &&
      needs.db-contract-preflight.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: Production
    outputs:
      pending_count: ${{ steps.check.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt
      - name: Report pending migrations dry-run
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/maintenance/db_migrate.py --env pro --dry-run --only "$F10_8_ONLY_MIGRATION" > report.txt
          count=$(grep -c "PENDIENTE" report.txt || true)
          printf '%s' "$count" | grep -Eq '^[0-9]+$'
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cat report.txt
      - name: Confirm report-only mode
        run: |
          set -euo pipefail
          echo "DB sync push/report mode is dry-run only. No migration apply is performed by this job."

  apply:
    name: "Apply pending migrations"
    needs: [detect-db-changes, report]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'main' &&
      inputs.operation == 'apply' &&
      inputs.apply_authorized &&
      inputs.backup_pitr_verified &&
      inputs.ddl_authorization_id != '' &&
      fromJSON(needs.report.outputs.pending_count) > 0
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
      - name: Verify explicit DDL authorization
        env:
          DDL_AUTHORIZATION_ID: ${{ inputs.ddl_authorization_id }}
          CANDIDATE_SHA: ${{ needs.detect-db-changes.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$DDL_AUTHORIZATION_ID" | grep -Eq '^DDL-[A-Z0-9][A-Z0-9_-]{3,}$'
          auth_file=".context/operaciones/ddl_authorizations/${DDL_AUTHORIZATION_ID}.md"
          test -f "$auth_file"
          grep -Fx "Status: APPROVED_FOR_PRODUCTION_DDL" "$auth_file"
          grep -Fx "Authorized migration: ${F10_8_ONLY_MIGRATION}" "$auth_file"
          grep -Fx "Backup/PITR gate: BACKUP_PITR_RUNTIME_GATE_REQUIRED" "$auth_file"
          grep -Fx "Pro apply gate: APPLY_REQUIRES_WORKFLOW_DISPATCH_PRODUCTION_ENVIRONMENT_APPROVAL_AND_RUNTIME_BACKUP_PITR" "$auth_file"

          auth_base_sha="$(sed -n 's/^Authorized base SHA: //p' "$auth_file" | head -n 1)"
          expected_non_auth_digest="$(sed -n 's/^Authorized non-auth digest SHA256: //p' "$auth_file" | head -n 1)"
          printf '%s' "$auth_base_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$expected_non_auth_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          git cat-file -e "$auth_base_sha^{commit}"
          git merge-base --is-ancestor "$auth_base_sha" "$CANDIDATE_SHA"

          AUTH_FILE="$auth_file" AUTH_BASE_SHA="$auth_base_sha" EXPECTED_NON_AUTH_DIGEST="$expected_non_auth_digest" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys

          auth_file = os.environ["AUTH_FILE"]
          base = os.environ["AUTH_BASE_SHA"]
          head = os.environ["CANDIDATE_SHA"]
          expected_non_auth_digest = os.environ["EXPECTED_NON_AUTH_DIGEST"]
          expected = {
              ".context/backlog_tareas/req_est_001_sprint_1/tarea_001_hito_1.md": ("A", "100644"),
              ".context/estado_del_proyecto.md": ("M", "100644"),
              ".context/evidencias_cliente/sprint_1/paquete_hito_001.md": ("M", "100644"),
              ".context/hitos/hito_001.md": ("A", "100644"),
              ".context/operaciones/ddl_authorizations/DDL-F10_8_ATOMIC_CLEANSING_PROVENANCE_PRO.md": ("A", "100644"),
              ".context/operaciones/flujo_release_minimo.md": ("A", "100644"),
              ".context/operaciones/plan_cierre_hito1_ca1_only.md": ("M", "100644"),
              ".github/workflows/db-sync-to-pro.yml": ("M", "100644"),
              ".github/workflows/security-audit.yml": ("M", "100755"),
              "tests/test_fase10_8_db_sync.py": ("M", "100644"),
              "tests/test_fase10_main_boundary.py": ("M", "100644"),
          }
          if auth_file not in expected:
              print(f"::error::authorization file {auth_file} is not allowlisted")
              sys.exit(1)
          denied_prefixes = ("db/", "supabase/", "web/", "scripts/core/", "scripts/maintenance/")
          raw = subprocess.check_output([
              "git", "diff", "--name-status", "-z", "--find-renames", "--find-copies",
              base, head, "--",
          ])
          fields = raw.split(b"\0")
          index = 0
          seen = {}
          failures = []
          while index < len(fields) and fields[index]:
              status = fields[index].decode("ascii")
              index += 1
              if status.startswith(("R", "C")):
                  old_path = fields[index].decode("utf-8", "surrogateescape")
                  index += 1
                  failures.append(f"unsupported-status:{status}:{old_path}")
              path = fields[index].decode("utf-8", "surrogateescape")
              index += 1
              if path.startswith(denied_prefixes):
                  failures.append(f"denied-path:{status}:{path}")
                  continue
              if path not in expected:
                  failures.append(f"unexpected-path:{status}:{path}")
                  continue
              expected_status, expected_mode = expected[path]
              if status != expected_status:
                  failures.append(f"status:{status}:{path}")
                  continue
              meta = subprocess.check_output(["git", "ls-tree", head, "--", path], text=True).strip()
              if not meta:
                  failures.append(f"missing-head:{path}")
                  continue
              mode, kind, blob = meta.split(None, 3)[:3]
              if (mode, kind) != (expected_mode, "blob"):
                  failures.append(f"mode-kind:{path}:{mode}:{kind}")
              seen[path] = (status, mode, blob)
          if set(seen) != set(expected):
              failures.append(f"missing-expected:{sorted(set(expected) - set(seen))}")
          digest_records = []
          for path in sorted(set(expected) - {auth_file}):
              status, mode, blob = seen[path]
              blob_bytes = subprocess.check_output(["git", "cat-file", "blob", blob])
              digest_records.append({
                  "mode": mode,
                  "path": path,
                  "sha256": hashlib.sha256(blob_bytes).hexdigest(),
                  "status": status,
              })
          actual_digest = "sha256:" + hashlib.sha256(
              json.dumps(digest_records, separators=(",", ":"), sort_keys=True).encode("utf-8")
          ).hexdigest()
          if actual_digest != expected_non_auth_digest:
              failures.append(f"non-auth-digest:{actual_digest}")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print("F10.8 DDL authorization governance boundary passed")
          PY
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt
      - name: Verify production controls before migrations
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          PRODUCTION_WRITERS_PAUSED: ${{ vars.PRODUCTION_WRITERS_PAUSED }}
        run: bash .github/scripts/production_control_preflight.sh DB-SYNC --enforce
      - name: Apply migrations to Pro
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: python3 scripts/maintenance/db_migrate.py --env pro --only "$F10_8_ONLY_MIGRATION"

  verify:
    name: "Verify target schema"
    needs: [detect-db-changes, report, apply]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'main' &&
      inputs.operation == 'apply' &&
      needs.report.result == 'success' &&
      needs.apply.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect-db-changes.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-db-migrate.txt
      - name: Run target schema check
        id: parity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
        run: python3 scripts/maintenance/check_db_parity.py --env pro --target-only
      - name: Report target schema result
        run: |
          set -euo pipefail
          if [ "${{ steps.parity.outcome }}" = "failure" ]; then
            echo "Target schema check FAILED: Pro does not match the minimum schema contract"
            exit 1
          fi
          echo "Target schema check PASSED"

  defer-fg2:
    name: "FG2 deferred to scheduled production window"
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'main' &&
      inputs.operation == 'apply' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deferred production scraping
        run: |
          set -euo pipefail
          echo "DB sync/parity completed. FG2 is intentionally NOT dispatched immediately."
          echo "Production FG2 will run on its scheduled window or by explicit workflow_dispatch."
