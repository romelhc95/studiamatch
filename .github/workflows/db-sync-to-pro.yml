name: DB Sync to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: studiamatch-db-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: "Detect pending migrations"
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: Production
    outputs:
      pending_count: ${{ steps.check.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check pending migrations
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 scripts/maintenance/db_migrate.py --env pro --dry-run > report.txt
          count=$(grep -c "PENDIENTE" report.txt || true)
          echo "count=$count" >> $GITHUB_OUTPUT
          cat report.txt

  apply:
    name: "Apply pending migrations"
    needs: detect
    if: github.ref_name == 'main' && needs.detect.outputs.pending_count > 0
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations to Pro
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/maintenance/db_migrate.py --env pro

  verify:
    name: "Verify target schema"
    needs: [detect, apply]
    if: always() && github.ref_name == 'main' && needs.detect.result == 'success' && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run target schema check
        id: parity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY: ${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/maintenance/check_db_parity.py --env pro --target-only
      - name: Report target schema result
        run: |
          if [ "${{ steps.parity.outcome }}" = "failure" ]; then
            echo "❌ Target schema check FAILED — Pro no tiene la configuracion/schema minima"
            exit 1
          fi
          echo "✅ Target schema check PASSED"

  defer-fg2:
    name: "FG2 deferred to scheduled production window"
    needs: verify
    if: success() && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deferred production scraping
        run: |
          echo "✅ DB sync/parity completed. FG2 is intentionally NOT dispatched immediately."
          echo "Production FG2 will run on its scheduled window or by explicit workflow_dispatch."
